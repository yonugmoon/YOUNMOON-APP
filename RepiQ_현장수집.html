<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>RepiQ 현장수집 · 도면-설비 연동 DB 현행화</title>
<style>
:root{
  --bg:#0b1220; --panel:#111a2e; --panel-2:#0e1626; --line:#1e2b45;
  --ink:#e8edf7; --ink-dim:#9fb0cc; --ink-faint:#64748b;
  --brand:#3bd6c6; --brand-2:#2a9df4; --warn:#f4b740; --bad:#f4685f; --good:#4ad991;
  --chip:#16233c; --shadow:0 8px 30px rgba(0,0,0,.35);
  --r:14px; --r-sm:10px;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
body{padding-bottom:78px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.mono{font-family:var(--mono)}

/* ---- Top bar ---- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0d1526,#0b1220);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo .dot{width:11px;height:11px;border-radius:3px;background:conic-gradient(from 210deg,var(--brand),var(--brand-2));box-shadow:0 0 14px var(--brand)}
.logo small{font-weight:600;color:var(--ink-dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.bar .site{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim);max-width:46vw}
.bar .site b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key-pill{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--chip);white-space:nowrap}
.key-pill.ok{color:var(--good);border-color:#1c3d33}
.key-pill.no{color:var(--warn);border-color:#3d341c}

/* ---- Layout ---- */
main{max-width:820px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.card-h .n{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--chip);color:var(--brand);font-family:var(--mono)}
.card-h h2{font-size:15.5px}
.card-h .sub{margin-left:auto;font-size:12px;color:var(--ink-dim)}
.card-b{padding:15px}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;border-radius:var(--r-sm);font-weight:600;font-size:14px;background:var(--chip);border:1px solid var(--line);color:var(--ink);transition:.12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--brand),#22b3a5);color:#04201d;border-color:transparent;box-shadow:0 4px 14px rgba(59,214,198,.28)}
.btn.blue{background:linear-gradient(180deg,var(--brand-2),#1e83d6);color:#031627;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:#3d2020}
.btn:disabled{opacity:.4;pointer-events:none}
.btn .sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row.tight{gap:7px}

/* ---- Fields ---- */
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);outline:none}
.inp:focus{border-color:var(--brand-2)}
textarea.inp{resize:vertical;min-height:60px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* ---- Chips / categories ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;transition:.1s}
.chip.on{background:var(--chip);border-color:var(--brand);color:var(--ink)}
.chip.on .k{color:var(--brand)}
.chip .k{font-family:var(--mono);font-size:10.5px;opacity:.8}
.chip .c{background:var(--brand);color:#04201d;border-radius:11px;font-size:10.5px;font-weight:800;padding:1px 6px;min-width:16px;text-align:center}

/* ---- Photo tiles ---- */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:12px}
.shot{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .tag{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);padding:14px 6px 5px;font-size:10px;font-weight:600;line-height:1.2}
.shot .tag .t{color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .tag .s{color:var(--brand);font-family:var(--mono);font-size:9px}
.shot .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;background:rgba(6,10,20,.75);color:#fff;font-size:13px;display:grid;place-items:center;line-height:1}
.shot .st{position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.shot.plan{border-style:dashed;border-color:var(--brand-2)}
.shot.add{border-style:dashed;display:grid;place-items:center;color:var(--ink-dim);font-size:12px;text-align:center;gap:4px;cursor:pointer}
.shot.add .plus{font-size:24px;line-height:1;color:var(--brand)}
.st.q0{background:var(--ink-faint)} .st.q1{background:var(--warn)} .st.q2{background:var(--good)} .st.qx{background:var(--bad)}

/* ---- AI result ---- */
.link-row{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);margin-bottom:9px;align-items:flex-start}
.link-row .lp{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--chip)}
.link-row .meta{flex:1;min-width:0}
.link-row .meta .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.link-row .meta .kv{font-size:12px;color:var(--ink-dim);margin-top:3px;font-family:var(--mono)}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.02em}
.badge.match{background:#12332b;color:var(--good)}
.badge.new{background:#123047;color:var(--brand-2)}
.badge.miss{background:#3a2320;color:var(--bad)}
.badge.chk{background:#3a331a;color:var(--warn)}
.conf{height:4px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.conf i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}

/* ---- Empty / hint ---- */
.empty{padding:26px 16px;text-align:center;color:var(--ink-dim);font-size:13.5px}
.empty .ic{font-size:30px;margin-bottom:8px;opacity:.5}
.hint{font-size:12px;color:var(--ink-faint);margin-top:8px;line-height:1.5}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---- Stat strip ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.stats .s{background:var(--panel-2);padding:11px 6px;text-align:center}
.stats .s b{display:block;font-size:20px;font-weight:800;font-family:var(--mono)}
.stats .s span{font-size:10.5px;color:var(--ink-dim)}
.stats .s.g b{color:var(--good)} .stats .s.b b{color:var(--brand-2)} .stats .s.w b{color:var(--warn)} .stats .s.r b{color:var(--bad)}

/* ---- Bottom nav ---- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(11,18,32,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:var(--ink-faint);font-size:10.5px;font-weight:600}
nav button .ni{font-size:19px;line-height:1}
nav button.on{color:var(--brand)}
nav button.on .ni{filter:drop-shadow(0 0 8px var(--brand))}
nav button .bdg{position:absolute;transform:translate(14px,-4px);background:var(--bad);color:#fff;font-size:9px;font-weight:800;border-radius:10px;padding:0 5px;min-width:15px;text-align:center}

/* ---- Sheet / modal ---- */
.scrim{position:fixed;inset:0;background:rgba(4,8,16,.6);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:.26s cubic-bezier(.3,.9,.3,1);max-height:88vh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 3px}
.sheet .sh-h{display:flex;align-items:center;padding:8px 16px 12px;border-bottom:1px solid var(--line)}
.sheet .sh-h h3{font-size:16px}
.sheet .sh-h .x{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:16px}
.sheet .sh-b{padding:15px 16px;overflow-y:auto}
.pages{display:none}
.pages.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2740;border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.24s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:#1c3d33;color:var(--good)}
.toast.bad{border-color:#3d2020;color:var(--bad)}

.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-dim)}
.seg button.on{background:var(--chip);color:var(--ink)}

.note{font-size:12px;padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);line-height:1.55}
.note b{color:var(--ink)}
kbd{font-family:var(--mono);font-size:11px;background:var(--chip);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}

/* ---- Digital Twin ---- */
.twin-health{display:flex;gap:14px;align-items:center}
.gauge{width:92px;height:92px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;position:relative}
.gauge::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.gauge b{position:relative;z-index:1;font-family:var(--mono);font-size:24px;font-weight:800;line-height:1;text-align:center}
.gauge b small{display:block;font-size:9.5px;color:var(--ink-dim);font-weight:600;font-family:var(--sans);margin-top:3px}
.hbars{flex:1;min-width:0;display:grid;gap:6px}
.hbar{display:grid;grid-template-columns:62px 1fr 34px;gap:7px;align-items:center;font-size:11.5px;color:var(--ink-dim)}
.hbar .tr{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.hbar .v{font-family:var(--mono);text-align:right;color:var(--ink)}
.bld{border-left:3px solid var(--line);border-right:3px solid var(--line);padding:8px 8px 0;border-radius:4px}
.bld-roof{height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:16px solid var(--line);margin:0 -11px}
.fl{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:6px;width:100%;text-align:left}
.fl.ug{background:#0b1322;border-style:dashed}
.fl .lb{width:40px;font-family:var(--mono);font-weight:800;font-size:13px;color:var(--brand)}
.fl .bars{flex:1;min-width:0}
.fl .fbar{height:9px;border-radius:6px;background:var(--line);display:flex;overflow:hidden}
.fl .fbar i{display:block;height:100%}
.fl .cs{font-size:10.5px;color:var(--ink-faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.fl .n{font-family:var(--mono);font-weight:800;font-size:14px;min-width:24px;text-align:right}
.fl .pl{font-size:10px;color:var(--brand-2)}
.ground{height:4px;background:repeating-linear-gradient(90deg,var(--ink-faint) 0 6px,transparent 6px 10px);margin:4px -11px 8px;opacity:.6}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;touch-action:manipulation;user-select:none}
.stage img{display:block;width:100%;height:auto;pointer-events:none}
.stage.placing{outline:3px dashed var(--brand);outline-offset:-3px;cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2}
.pin .hd{min-width:26px;padding:2px 5px;border-radius:7px;font-family:var(--mono);font-size:9.5px;font-weight:800;color:#04201d;box-shadow:0 2px 8px rgba(0,0,0,.45);border:1.5px solid #fff;white-space:nowrap}
.pin .tl{width:2px;height:7px;background:#fff;box-shadow:0 0 2px #000}
.pin.sel .hd{outline:3px solid var(--brand-2);transform:scale(1.15)}
.pin.dim{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--ink-dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.banner{padding:10px 12px;border-radius:10px;background:#103a36;border:1px solid var(--brand);color:var(--ink);font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.banner button{margin-left:auto}
.tn{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;font-size:13px;width:100%;text-align:left}
.tn:active{background:var(--chip)}
.tn.sel{background:#123047}
.tn.hit{background:#2a2414}
.tn .tw{color:var(--ink-faint);font-family:var(--mono);font-size:11px;width:12px;flex-shrink:0}
.tn .dt{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tn .cd{font-family:var(--mono);font-size:10.5px;color:var(--brand);flex-shrink:0}
.tn .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .fx{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);flex-shrink:0}
.tn .imp{font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;background:var(--chip);color:var(--ink-dim);flex-shrink:0}
.tn .inf{font-size:9.5px;color:var(--ink-faint);flex-shrink:0}
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.hist .he{position:relative;padding:0 0 13px}
.hist .he::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--brand)}
.hist .he.edit::before{border-color:var(--warn)}
.hist .he .t{font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.hist .he .d{font-size:13px}
.hist .he .cl{font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);margin-top:4px;line-height:1.6}
.ver{color:var(--good);font-size:11px;font-weight:800}
.chk-row{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);margin-bottom:11px;font-size:14px}
.chk-row input{width:18px;height:18px;accent-color:var(--brand)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="dot"></span>RepiQ<small>현장수집</small></div>
    <div class="site">
      <b id="siteLabel">사업장 미선택</b>
      <span class="key-pill no" id="keyPill" onclick="ui.openSheet('settings')">API 키 없음</span>
    </div>
  </div>
</header>

<main>
  <!-- ===== 1. 수집 (Collect) ===== -->
  <section class="pages on" id="page-collect"></section>
  <!-- ===== 2. 연동 (Link/AI) ===== -->
  <section class="pages" id="page-link"></section>
  <!-- ===== 3. 대장 (DB) ===== -->
  <section class="pages" id="page-db"></section>
  <!-- ===== 4. 디지털트윈 (Twin) ===== -->
  <section class="pages" id="page-twin"></section>
</main>

<nav>
  <button class="on" data-tab="collect" onclick="ui.tab('collect')"><span class="ni">📷</span>수집</button>
  <button data-tab="link" onclick="ui.tab('link')"><span class="ni">🔗</span>AI 연동<span class="bdg" id="linkBadge" style="display:none">0</span></button>
  <button data-tab="db" onclick="ui.tab('db')"><span class="ni">🗂️</span>대장·현행화</button>
  <button data-tab="twin" onclick="ui.tab('twin')"><span class="ni">🏢</span>디지털트윈</button>
</nav>

<!-- Sheet -->
<div class="scrim" id="scrim" onclick="ui.closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sh-h"><h3 id="sheetTitle">제목</h3><button class="x" onclick="ui.closeSheet()">✕</button></div>
  <div class="sh-b" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="filePlan" accept="image/*" capture="environment" hidden>
<input type="file" id="fileEquip" accept="image/*" capture="environment" hidden multiple>
<input type="file" id="fileImport" accept="application/json" hidden>

<script>
(function(){ // 데이터 모듈은 IIFE로 감싸 메인 스크립트의 const 구조분해와 이름 충돌을 방지
/* ============================================================
   RepiQ 현장수집 · 데이터 모듈
   - 34종 정보통신설비 장비 분류 (TTA K-10.0303 / 과기정통부 고시 기준)
   - AI(Gemini Vision) 프롬프트 정의
   - kb-core 연동을 위한 보정 규칙 스텁
   ============================================================ */

/* 34종 장비 분류.
   code : 대장/파일 식별용 짧은 키
   name : 화면 표기명
   group: 분류(구내통신/방송공동수신/구내방송/전송/전원/기타)
   fields: AI가 사진에서 추출을 시도할 핵심 규격 항목
   planSym: 도면에서 찾을 대표 심볼/약어 힌트                        */
const EQUIP_CATS = [
  // ── 구내통신선로설비 ──
  {code:"MDF",   name:"국선단자함(MDF)",       group:"구내통신", fields:["제조사","모델명","단자수","설치위치"], planSym:["MDF","국선단자함"]},

const EQUIP_GROUPS = ["구내통신","방송수신","구내방송","전송","전원","기타"];

/* ============================================================
   디지털트윈 · 계통(토폴로지) 규칙
   code → 상위 설비 후보(우선순위 순). 후보가 없으면 계통의 최상위(root).
   규칙은 DAG(순환 없음)로 유지한다.
   ============================================================ */
const TOPO_PARENTS = {
  // 구내통신: MDF → (FDF/RACK/OLT/ROUTER) → IDF → 세대단자함 → 인출구

  IDF:["MDF","FDF"], ONU:["IDF","FDF","MDF"], WORKSP:["IDF"], OUTLET:["WORKSP","IDF"],
  PATCH:["RACK","IDF","MDF"], SW:["RACK","IDF","MDF"], CABLE:["IDF","MDF"],
  CONDUIT:["IDF","MDF"], PULLBOX:["IDF","MDF"],
  INBLD:["MDF"], ANT:["INBLD"],
  // 방송공동수신: 안테나 → 헤드엔드 → 증폭/분배 → TAP
  HEADEND:["SATANT"], AMP:["HEADEND"], TAP:["AMP","HEADEND"], COAX:["AMP","HEADEND"],
  // 구내방송: 앰프 → 스피커/입력
  SPK:["PAAMP"], MIC:["PAAMP"],
  // 전원: UPS → PDU → 정류기/SPD/냉방
  PDU:["UPS"], RECT:["PDU","UPS"], SPD:["PDU","GND"], AIRCON:["PDU"],
  // 부대
  ENVMON:["RACK","MDF","IDF"], CCTV:["SW"], ACCESS:["SW"],
};

/* 층 파싱: "B2", "지하1층", "3F", "12층", "RF/옥상" → 정수 (RF=999) */
function parseFloor(s){
  if(s==null) return null;
  const t=String(s).toUpperCase().replace(/\s+/g,"");
  if(!t) return null;
  let m=t.match(/(?:^|[^A-Z])B(\d{1,2})(?:F|층)?/) || t.match(/^B(\d{1,2})/) || t.match(/지하(\d{1,2})/);
  if(m) return -parseInt(m[1],10);
  if(/(?:^|[^A-Z])(?:RF|PH)(?:$|[^A-Z])|옥상|지붕/.test(t)) return 999;
  m=t.match(/(\d{1,3})(?:F|층)/) || t.match(/지상(\d{1,3})/);
  if(m) return parseInt(m[1],10);
  return null;
}
function floorLabel(n){ if(n==null) return "층미상"; if(n===999) return "RF"; return n<0?`B${-n}`:`${n}F`; }
/* 실명 파싱 */
function parseRoom(s){
  if(!s) return "";
  const m=String(s).match(/(TPS|EPS|MDF|IDF|[가-힣A-Za-z0-9]{1,8}실)/);
  return m?m[1]:"";
}

/* ============================================================
   AI 프롬프트 — Gemini Vision (gemini-2.0-flash 계열)
   두 단계로 사용:
   (A) 도면 해석 : 층/구역 도면에서 심볼·실명(室名)·설비 위치 추출
   (B) 설비 판독 : 설비 사진에서 모델명/규격 추출
   (C) 연동 매칭 : 도면 해석 결과 + 설비 판독 결과를 매칭
   모든 응답은 JSON only (마크다운/설명 금지)
   ============================================================ */
const AI = {
  // (A) 도면에서 설비 심볼/위치 추출
  planPrompt(ctx){
    const cats = EQUIP_CATS.map(c=>`${c.code}:${c.name}(심볼힌트 ${c.planSym.join("/")||"-"})`).join("\n");
    return `너는 정보통신설비 점검 전문가다. 첨부한 "구내통신/방송/전원 계통도 또는 평면 도면" 사진을 분석한다.
사업장: ${ctx.site||"미상"} / 도면구분: ${ctx.planName||"미상"}

목표: 도면에 표기된 정보통신설비를 아래 34종 분류에 매핑하여 위치와 함께 추출한다.
[34종 분류]
${cats}

규칙:
- 도면의 실명(예: TPS실, MDF실, 통신실, 전기실), 층/동 정보를 최대한 읽어라.
- 각 설비의 표기 규격(예: UTP Cat6 24C, 광 12C, EMT 36Φ)이 있으면 그대로 옮겨라.
- 확실치 않으면 confidence를 낮추고 note에 근거를 적어라.
- 디지털트윈 배치를 위해 각 설비 심볼의 중심 위치를 이미지 기준 상대좌표 pos로 적어라
  (좌상단 x=0,y=0 / 우하단 x=1,y=1, 소수 3자리). 위치를 특정할 수 없으면 pos를 생략.
- 도면이 단일 층이면 floor에 "B1","3F","RF" 형식으로 적고, 여러 층(계통도)이면 각 item의 loc에 층을 포함하라.
- upstream에는 도면 선로상 그 설비에 신호/전원을 공급하는 상위 설비의 label을 적어라(모르면 빈 문자열).
- 반드시 JSON만 출력. 마크다운/설명 금지.

출력 형식:
{
 "plan_scope": "도면이 포괄하는 범위 (예: 지하1층 통신 계통)",
 "floor": "B1",
 "locations": ["TPS실(3F)","MDF실(B1)", ...],
 "items": [
   {"code":"IDF","label":"3층 TPS 단자함","loc":"3F TPS실","spec":"UTP Cat6 24C","qty":1,
    "pos":{"x":0.412,"y":0.305},"upstream":"B1 MDF","confidence":0.0~1.0,"note":""}
 ]
}`;
  },

  // (B) 설비 사진에서 규격 추출
  equipPrompt(cat, ctx){
    const flds = cat.fields.join(", ");
    return `너는 정보통신설비 점검 전문가다. 첨부한 "${cat.name}" 현장 설비 사진을 판독한다.
사업장: ${ctx.site||"미상"} / 촬영위치 메모: ${ctx.locNote||"없음"}

목표: 사진 속 명판·라벨·형태로부터 아래 항목을 최대한 정확히 추출한다.
추출항목: ${flds}

규칙:
- 명판(nameplate)의 제조사/모델명/규격을 글자 그대로 읽어라. 흐릿하면 읽은 그대로 두고 confidence를 낮춰라.
- 케이블은 피복 인쇄(예: CAT.6 U/UTP 4P 24AWG)를 읽어라.
- 사진에 여러 설비가 있으면 주(主) 설비 1건만 판독하고 note에 그 외 설비 존재를 적어라.
- 판독 불가/사진품질 문제는 quality에 표기.
- 반드시 JSON만 출력.

출력 형식:
{
 "code":"${cat.code}",
 "name":"${cat.name}",
 "extracted":{ ${cat.fields.map(f=>`"${f}":""`).join(", ")} },
 "text_found":"명판에서 읽어낸 원문",
 "quality":"good|blurry|dark|angle|no_label",
 "confidence":0.0~1.0,
 "note":""
}`;
  },

  // (C) 도면 항목 ↔ 설비 판독 매칭
  matchPrompt(planItems, equipReads, ctx){
    return `너는 정보통신설비 DB 현행화 담당자다.
아래 [도면추출 설비]와 [현장 설비사진 판독]을 대조하여 최신 설비대장을 만든다.
사업장: ${ctx.site||"미상"}

[도면추출 설비]
${JSON.stringify(planItems,null,1)}

[현장 설비사진 판독]
${JSON.stringify(equipReads,null,1)}

규칙:
- 같은 code + 유사 위치/규격이면 매칭(status="match")하고 도면값을 사진 실측값으로 갱신.
- 도면엔 있으나 사진 없음 → status="plan_only"(현장 확인 필요).
- 사진엔 있으나 도면에 없음 → status="field_new"(도면 미반영 신규).
- 규격이 도면≠사진이면 status="mismatch"로 두고 both 값을 남겨라.
- 위치(loc)는 도면/사진 중 더 구체적인 값을 채택하고 층(예: B1, 3F)을 반드시 포함.
- planRef에는 매칭된 도면항목의 ref 값(예: "P3")을, photoRef에는 설비사진의 id 값을 그대로 적어라. 없으면 빈 문자열.
- 반드시 JSON만 출력.

출력 형식:
{
 "roster":[
  {"code":"IDF","name":"3층 TPS 단자함","loc":"3F TPS실",
   "spec_final":"UTP Cat6 24C","spec_plan":"","spec_field":"",
   "status":"match|plan_only|field_new|mismatch",
   "planRef":"P3","photoRef":"eq_xxxx",
   "action":"현행화 조치 요약(예: 규격 갱신, 현장 재확인)","confidence":0.0~1.0}
 ],
 "summary":{"match":0,"plan_only":0,"field_new":0,"mismatch":0}
}`;
  }
};

/* kb-core 보정 규칙 훅 (있으면 사용) — 없으면 통과 */
function kbApply(kind, obj){
  try{ if(window.kbCore && typeof kbCore.correct==="function") return kbCore.correct(kind,obj); }catch(e){}
  return obj;
}

window.REPIQ_DATA = { EQUIP_CATS, EQUIP_GROUPS, CAT_BY_CODE, AI, kbApply, TOPO_PARENTS, parseFloor, floorLabel, parseRoom };
})();

const { EQUIP_CATS, EQUIP_GROUPS, CAT_BY_CODE, AI, kbApply, TOPO_PARENTS, parseFloor, floorLabel, parseRoom } = window.REPIQ_DATA;

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const uid = p => (p||"") + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- IndexedDB (사진 blob 저장) ---------- */
const DB = {
  _db:null,
  open(){ return new Promise((res,rej)=>{
    if(this._db) return res(this._db);
    const r=indexedDB.open("repiq_field",1);
    r.onupgradeneeded=e=>{ const db=e.target.result;
      if(!db.objectStoreNames.contains("photos")) db.createObjectStore("photos"); };
    r.onsuccess=e=>{ this._db=e.target.result; res(this._db); };
    r.onerror=e=>rej(e.target.error);
  });},
  async put(id, blob){ const db=await this.open(); return new Promise((res,rej)=>{
    const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").put(blob,id);
    tx.oncomplete=()=>res(id); tx.onerror=e=>rej(e.target.error); });},
  async get(id){ const db=await this.open(); return new Promise((res,rej)=>{
    const tx=db.transaction("photos","readonly"); const rq=tx.objectStore("photos").get(id);
    rq.onsuccess=()=>res(rq.result); rq.onerror=e=>rej(e.target.error); });},
  async del(id){ const db=await this.open(); return new Promise((res)=>{
    const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").delete(id);
    tx.oncomplete=()=>res(); });}
};
const _urlCache={};
async function photoURL(id){
  if(_urlCache[id]) return _urlCache[id];
  const b=await DB.get(id); if(!b) return "";
  const u=URL.createObjectURL(b); _urlCache[id]=u; return u;
}

/* ---------- 이미지 리사이즈(업로드 전 축소) ---------- */
function resizeImage(file, max=1600, q=0.82){
  return new Promise((res)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(Math.max(w,h)>max){ const r=max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); res(b); },"image/jpeg",q);
    };
    img.onerror=()=>res(file);
    img.src=url;
  });
}
function blobToBase64(blob){ return new Promise((res)=>{ const r=new FileReader();
  r.onload=()=>res(r.result.split(",")[1]); r.readAsDataURL(blob); }); }

function load(){

function blankState(){

/* 이전 버전 상태 → 트윈 스키마 보정 (tid/floor/room 부여) */
function migrate(st){
  st={...blankState(), ...st};
  if(!Array.isArray(st.history)) st.history=[];
  st.plans.forEach(p=>{ if(p.floor===undefined) p.floor=parseFloor(p.ai?.floor)??parseFloor(p.name)??parseFloor(p.ai?.plan_scope); });
  st.roster=(st.roster||[]).map(r=>normItem(r, st.plans));
  return st;
}

/* ---------- Gemini 호출 ---------- */
async function callGemini(prompt, imageBlobs){
  if(!S.apiKey) throw new Error("API 키가 없습니다. 우측 상단에서 등록하세요.");
  const parts=[{text:prompt}];
  for(const b of (imageBlobs||[])){
    parts.push({inline_data:{mime_type:"image/jpeg", data:await blobToBase64(b)}});
  }
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent?key=${encodeURIComponent(S.apiKey)}`;
  const body={contents:[{role:"user",parts}],
    generationConfig:{temperature:0.1, maxOutputTokens:8192, responseMimeType:"application/json"}};
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error(`AI 오류 ${r.status}: ${t.slice(0,160)}`); }
  const j=await r.json();
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  return parseJSON(txt);
}
function parseJSON(txt){
  let t=(txt||"").trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  try{ return JSON.parse(t); }catch(e){
    const m=t.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(_){} }
    throw new Error("AI 응답 파싱 실패");
  }
}

        ${r.action?`<div class="kv" style="color:var(--brand)">▸ ${esc(r.action)}</div>`:""}
        <div class="conf"><i style="width:${Math.round((r.confidence||0)*100)}%"></i></div>
      </div>`;
    if(r.tid){ row.style.cursor="pointer"; row.onclick=()=>ui.openSheet("item", r.tid); }

    const imgEl=row.querySelector("img.lp");

  }
}
function findPhotoForRoster(r){
  // 사진 id 참조 → 원문 참조 → 같은 code 첫 설비사진
  if(r.photoId) return r.photoId;
  const byId = r.photoRef && S.equips.find(e=>e.id===r.photoRef);
  if(byId) return byId.photoId;
  const byRef = S.equips.find(e=> e.ai && (e.ai.text_found && r.photoRef && e.ai.text_found.includes?.(r.photoRef)));
  if(byRef) return byRef.photoId;
  const byCode = S.equips.find(e=>e.code===r.code);
  return byCode?.photoId;
}

let pendingCat=null; // cat 시트에서 촬영 대기 정보

function setProg(txt){ const p=$("#aiProg"); if(p) p.innerHTML=txt; }

// ① 도면 해석
async function runPlanAI(){
  const targets=S.plans.filter(p=>!p.ai);
  if(!targets.length){ toast("해석할 도면 없음"); return; }
  const btn=$("#btnPlan"); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="sp"></span> 해석 중`; }
  let ok=0,fail=0;
  for(let i=0;i<targets.length;i++){
    const p=targets[i]; setProg(`도면 해석 ${i+1}/${targets.length} · ${esc(p.name||"")}`);
    try{
      const blob=await DB.get(p.photoId);
      let res=await callGemini(AI.planPrompt({site:S.site, planName:p.name}), [blob]);
      res=kbApply("plan", res);
      p.ai=res; p.parsedAt=now(); ok++;
      if(p.floor==null) p.floor=parseFloor(res.floor)??parseFloor(p.name)??parseFloor(res.plan_scope);
      save();
    }catch(err){ fail++; setProg(`⚠️ ${esc(err.message)}`); }
  }
  save(); render();
  toast(`도면 해석 완료 · 성공 ${ok}${fail?` / 실패 ${fail}`:""}`, fail?"bad":"good");
}

// ② 설비 판독
async function runEquipAI(){
  const targets=S.equips.filter(e=>!e.ai);
  if(!targets.length){ toast("판독할 설비 없음"); return; }
  const btn=$("#btnEquip"); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="sp"></span> 판독 중`; }
  let ok=0,fail=0;
  for(let i=0;i<targets.length;i++){
    const e=targets[i]; const cat=CAT_BY_CODE[e.code];
    setProg(`설비 판독 ${i+1}/${targets.length} · ${esc(cat?.name||e.code)}`);
    try{
      const blob=await DB.get(e.photoId);
      let res=await callGemini(AI.equipPrompt(cat,{site:S.site, locNote:e.locNote}), [blob]);
      res=kbApply("equip", res);
      e.ai=res; e.readAt=now(); ok++; save();
    }catch(err){ fail++; setProg(`⚠️ ${esc(err.message)}`); }

}

// ③ 연동 매칭 → 최신 대장
async function runMatch(){
  const btn=$("#btnLink"); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="sp"></span> 연동 중`; }
  setProg("도면·설비 대조 중…");
  // 도면 항목 취합 (ref 부여 → 대장↔도면 좌표 연결)
  const planIdx=buildPlanItems();
  const planItems=planIdx.list;
  const planForAI=planItems.map(({pos,planId,planFloor,...rest})=>rest);
  // 설비 판독 취합
  const equipReads=S.equips.filter(e=>e.ai).map(e=>({
    id:e.id, code:e.code, locNote:e.locNote,
    extracted:e.ai.extracted, text_found:e.ai.text_found, confidence:e.ai.confidence
  }));
  try{
    let res=await callGemini(AI.matchPrompt(planForAI, equipReads, {site:S.site}), []);
    res=kbApply("match", res);
    const c=commitRoster((res.roster||[]).map(r=>attachPlanRefs({...r}, planIdx)), "ai");
    resolveUpHints();
    S.linkedAt=now(); save(); render();
    toast(`연동 완료 · 대장 ${S.roster.length}건 (+${c.added} −${c.removed} ~${c.changed})`,"good");
    setProg("");
  }catch(err){
    // AI 매칭 실패 시 로컬 규칙 기반 폴백
    setProg("AI 매칭 실패 → 로컬 규칙으로 대장 생성");
    commitRoster(localMatch(planItems, equipReads).map(r=>attachPlanRefs(r, planIdx)), "local");
    resolveUpHints();
    S.linkedAt=now(); save(); render();
    toast(`로컬 연동으로 대장 ${S.roster.length}건 생성`,"bad");
  }
}

// AI 없이도 최소 동작: code 기준 병합
function localMatch(planItems, equipReads){
  const out=[]; const usedEquip=new Set();
  planItems.forEach(pi=>{
    const pf=parseFloor(pi.loc)??pi.planFloor;
    const cands=equipReads.filter(e=>e.code===pi.code && !usedEquip.has(e.id));
    const m=cands.find(e=>pf!=null && parseFloor(e.locNote)===pf) || cands.find(e=>parseFloor(e.locNote)==null) || (pf==null?cands[0]:null);
    if(m){ usedEquip.add(m.id);
      const fSpec=Object.values(m.extracted||{}).filter(Boolean).join(" ");
      out.push({code:pi.code, name:pi.label||CAT_BY_CODE[pi.code]?.name, loc:pi.loc||m.locNote||"",
        spec_final:fSpec||pi.spec||"", spec_plan:pi.spec||"", spec_field:fSpec||"",
        status: fSpec&&pi.spec&&fSpec!==pi.spec?"mismatch":"match",
        action:fSpec&&pi.spec&&fSpec!==pi.spec?"규격 갱신 검토":"", confidence:m.confidence||0.5, photoRef:m.id, planRef:pi.ref});
    } else out.push({code:pi.code, name:pi.label||CAT_BY_CODE[pi.code]?.name, loc:pi.loc||"",
        spec_final:pi.spec||"", spec_plan:pi.spec||"", status:"plan_only",
        action:"현장 재확인", confidence:pi.confidence||0.4, planRef:pi.ref});
  });
  equipReads.forEach(e=>{ if(usedEquip.has(e.id)) return;
    const fSpec=Object.values(e.extracted||{}).filter(Boolean).join(" ");
    out.push({code:e.code, name:CAT_BY_CODE[e.code]?.name, loc:e.locNote||"",
      spec_final:fSpec, spec_field:fSpec, status:"field_new",
      action:"도면 미반영 신규", confidence:e.confidence||0.5, photoRef:e.id});
  });
  return out;
}

/* ============================================================
   디지털트윈 엔진
   - 대장 항목에 고유 tid를 부여하여 재연동 시에도 동일 설비로 추적
   - 층/실 파싱 → 건물 모델, 도면 좌표(pos) → 평면 핀 배치
   - 규칙 기반 계통 추론(TOPO_PARENTS) + 수동 지정 → 장애 영향 분석
   - 재연동/수정 시 변경분(diff)을 현행화 이력으로 기록
   ============================================================ */
const STATUS_COLOR={match:"var(--good)", field_new:"var(--brand-2)", mismatch:"var(--warn)", plan_only:"var(--bad)"};
const normKey = s => (s==null?"":String(s)).toLowerCase().replace(/[\s()\[\]·,./_-]+/g,"");
const clamp01 = v => Math.max(0, Math.min(1, Number(v)));
const validPos = p => p && isFinite(p.x) && isFinite(p.y);

function normItem(r, plans){
  const it={...r};
  if(!it.tid) it.tid=uid("tw_");
  if(!it.name) it.name=CAT_BY_CODE[it.code]?.name||it.code||"설비";
  if(it.floor===undefined || it.floor===null){
    let f=parseFloor(it.loc);
    if(f==null && it.pos?.planId){ const p=(plans||S?.plans||[]).find(x=>x.id===it.pos.planId); f=p?.floor??null; }
    it.floor=f;
  }
  if(!it.room) it.room=parseRoom(it.loc);
  if(it.pos && !validPos(it.pos)) delete it.pos;
  return it;
}

function pushHistory(entry){
  S.history.unshift({id:uid("h_"), at:now(), ...entry});
  if(S.history.length>80) S.history.length=80;
}

/* 수동 수정 기록 */
function logEdit(item, changes){
  if(!changes.length) return;
  pushHistory({kind:"edit", source:"manual",
    changes:changes.map(c=>({type:"changed", tid:item.tid, name:item.name, ...c}))});
}

/* 새 연동 결과를 기존 트윈에 병합 (tid·핀·계통·현장확인 유지) */
function commitRoster(newList, source){
  const prev=S.roster||[];
  const fresh=newList.map(r=>normItem(r));
  const used=new Set(); const changes=[];
  fresh.forEach(n=>{
    let best=null, bs=0;
    prev.forEach(o=>{
      if(used.has(o.tid) || o.code!==n.code) return;
      let sc=1;
      if(normKey(o.loc) && normKey(o.loc)===normKey(n.loc)) sc+=3;
      else if(o.floor!=null && o.floor===n.floor) sc+=1.5;
      if(normKey(o.name) && normKey(o.name)===normKey(n.name)) sc+=2;
      if(o.photoRef && o.photoRef===n.photoRef) sc+=2;
      if(sc>bs){ bs=sc; best=o; }
    });
    if(best && bs>=2.5){
      used.add(best.tid); n.tid=best.tid;
      if(best.pos?.manual || (!n.pos && best.pos)) n.pos=best.pos;
      if(best.parent) n.parent=best.parent;
      if(best.memo) n.memo=best.memo;
      ["spec_final","status","loc"].forEach(f=>{
        if((best[f]||"")!==(n[f]||"")) changes.push({type:"changed", tid:n.tid, name:n.name, field:f, from:best[f]||"", to:n[f]||""});
      });
      if(best.verified && (best.spec_final||"")===(n.spec_final||"")) n.verified=best.verified;
    } else changes.push({type:"added", tid:n.tid, name:n.name, to:n.spec_final||""});
  });
  prev.forEach(o=>{
    if(used.has(o.tid)) return;
    if(o.manual || o.verified){ fresh.push(o); return; } // 수동 등록·현장확인 설비는 보존
    changes.push({type:"removed", tid:o.tid, name:o.name, from:o.spec_final||""});
  });
  const ids=new Set(fresh.map(x=>x.tid));
  fresh.forEach(x=>{ if(x.parent && !ids.has(x.parent)) delete x.parent; });
  S.roster=fresh;
  const counts={added:0,removed:0,changed:0}; changes.forEach(c=>counts[c.type]++);
  pushHistory({kind:"link", source, summary:rosterSummary(), counts, total:fresh.length, changes:changes.slice(0,200)});
  return counts;
}

/* 도면항목 ref → 대장항목에 좌표/층/상위 힌트 부여 */
function attachPlanRefs(item, planIdx){
  const pi = planIdx.byRef[item.planRef] || planIdx.byLabel[normKey(item.planRef)];
  if(!pi) return item;
  if(!item.pos && validPos(pi.pos)) item.pos={planId:pi.planId, x:clamp01(pi.pos.x), y:clamp01(pi.pos.y)};
  if(item.floor==null) item.floor=parseFloor(item.loc)??parseFloor(pi.loc)??pi.planFloor??null;
  if(pi.upstream) item._upHint=pi.upstream;
  return item;
}
function buildPlanItems(){
  const list=[]; let n=0;
  S.plans.forEach(p=>(p.ai?.items||[]).forEach(it=>{ n++;
    list.push({...it, ref:"P"+n, planId:p.id, planName:p.name, planFloor:p.floor??null}); }));
  const byRef={}, byLabel={};
  list.forEach(x=>{ byRef[x.ref]=x; if(x.label) byLabel[normKey(x.label)]=x; });
  return {list, byRef, byLabel};
}
/* 도면 upstream 라벨 힌트 → 실제 parent tid 확정(수동 지정이 없을 때만) */
function resolveUpHints(){
  S.roster.forEach(r=>{
    if(!r._upHint){ return; }
    if(!r.parent){
      const k=normKey(r._upHint);
      const cand=S.roster.find(o=>o.tid!==r.tid && (normKey(o.name)===k || normKey(o.loc+o.code)===k || normKey(o.name).includes(k)));
      if(cand && !isDescendant(cand.tid, r.tid)) r.parent=cand.tid;
    }
    delete r._upHint;
  });
}

/* ---------- 계통(토폴로지) ---------- */
function floorDist(a,b){ if(a==null||b==null) return 50; const fa=a===999?200:a, fb=b===999?200:b; return Math.abs(fa-fb); }
function inferParent(item, roster){
  const cands=TOPO_PARENTS[item.code]; if(!cands) return null;
  for(const pc of cands){
    let best=null, bd=1e9;
    roster.forEach(o=>{ if(o.tid===item.tid || o.code!==pc) return;
      let d=floorDist(item.floor,o.floor)*2 + (item.room&&o.room&&item.room===o.room?0:1);
      if(d<bd){ bd=d; best=o; } });
    if(best) return best.tid;
  }
  return null;
}
/* 유효 상위 맵 {tid: {parent, inferred}} */
function topology(){
  const map={}; const R=S.roster;
  R.forEach(r=>{
    if(r.parent) map[r.tid]={parent:r.parent, inferred:false};
    else { const p=inferParent(r,R); map[r.tid]={parent:p, inferred:!!p}; }
  });
  // 순환 방지: 수동 지정끼리 순환하면 끊는다
  R.forEach(r=>{ const seen=new Set([r.tid]); let cur=map[r.tid]?.parent;
    while(cur){ if(seen.has(cur)){ map[r.tid].parent=null; break; } seen.add(cur); cur=map[cur]?.parent; } });
  const children={};
  R.forEach(r=>{ const p=map[r.tid].parent; if(p){ (children[p]=children[p]||[]).push(r.tid); } });
  return {map, children};
}
function descendants(tid, children){
  const out=[]; const st=[...(children[tid]||[])];
  while(st.length){ const t=st.pop(); out.push(t); st.push(...(children[t]||[])); }
  return out;
}
function isDescendant(maybeChild, ofTid){
  const {children}=topology(); return descendants(ofTid, children).includes(maybeChild);
}
const byTid = tid => S.roster.find(r=>r.tid===tid);

/* ---------- 트윈 동기화 지수 ---------- */
function twinHealth(){
  const R=S.roster, n=R.length; if(!n) return null;
  const {map}=topology();
  const sync=R.filter(r=>r.status==="match"||r.verified).length/n;
  const pos=R.filter(r=>validPos(r.pos)).length/n;
  const topo=R.filter(r=>!TOPO_PARENTS[r.code] || map[r.tid]?.parent).length/n;
  const photo=R.filter(r=>findPhotoForRoster(r)).length/n;
  const conf=R.reduce((a,r)=>a+(Number(r.confidence)||0),0)/n;
  const score=Math.round(100*(.35*sync+.2*pos+.15*topo+.15*photo+.15*conf));
  const days=S.linkedAt?Math.floor((Date.now()-new Date(S.linkedAt))/864e5):null;
  return {score, sync, pos, topo, photo, conf, days, n};
}

/* ---------- 건물 모델 ---------- */
function floorsModel(){
  const fl=new Map();
  const get=k=>{ if(!fl.has(k)) fl.set(k,{floor:k, items:[], plans:[]}); return fl.get(k); };
  S.roster.forEach(r=>get(r.floor??null).items.push(r));
  S.plans.forEach(p=>{ if(p.floor!=null) get(p.floor).plans.push(p); });
  const arr=[...fl.values()];
  arr.sort((a,b)=>{ if(a.floor==null) return 1; if(b.floor==null) return -1; return b.floor-a.floor; });
  return arr;
}

function statusBar(items){
  const n=items.length||1; const cnt={match:0,field_new:0,mismatch:0,plan_only:0};

}
function legendHTML(){
  return `<div class="legend">${Object.entries(STATUS_META).map(([k,m])=>`<span><i style="background:${STATUS_COLOR[k]}"></i>${m.t}</span>`).join("")}<span>✔ 현장확인완료</span></div>`;
}

function renderBuilding(box){

  const above=fls.filter(f=>f.floor!=null && f.floor>0), below=fls.filter(f=>f.floor!=null && f.floor<=0), unk=fls.find(f=>f.floor==null);
  const row=f=>{
    const codes=[...new Set(f.items.map(r=>r.code))];
    const issues=f.items.filter(r=>r.status==="mismatch"||r.status==="plan_only").length;

      <div class="ground"></div>

    ${unk?`<div style="margin-top:10px">${row(unk)}</div><div class="hint">층미상 설비는 상세에서 층을 지정하면 건물 모델에 배치됩니다.</div>`:""}

function renderFloor(box){

  if(!plans.some(p=>p.id===TW.planId)) TW.planId=plans[0]?.id||null;
  const plan=S.plans.find(p=>p.id===TW.planId);
  const placingItem=TW.placing?byTid(TW.placing):null;

  box.innerHTML=`
    <div class="chips" style="margin-bottom:10px">${fls.map(f=>`<button class="chip ${f.floor===TW.floor?"on":""}" data-f="${f.floor==null?"null":f.floor}">
      <span class="k">${floorLabel(f.floor)}</span><span class="c">${f.items.length}</span></button>`).join("")}</div>
    ${plans.length>1?`<select class="inp" id="twPlan" style="margin-bottom:10px">${plans.map(p=>`<option value="${p.id}" ${p.id===TW.planId?"selected":""}>${esc(p.name)} ${p.floor!=null?`(${floorLabel(p.floor)})`:""}</option>`).join("")}</select>`:""}
    ${!cur.plans.length&&S.plans.length?`<div class="hint" style="margin:0 0 9px">이 층으로 지정된 도면이 없어 전체 도면을 표시합니다. 도면 상세에서 층을 지정하세요.</div>`:""}
    ${placingItem?`<div class="banner">📍 <span><b>${esc(placingItem.name)}</b> — 도면에서 위치를 탭하세요</span><button class="btn sm" id="twCancel">취소</button></div>`:""}
    <div id="twStage"></div>
    ${legendHTML()}
    <div class="divider"></div>
    <div style="font-size:12px;color:var(--ink-faint);font-weight:700;margin-bottom:7px">${floorLabel(TW.floor)} 설비 ${cur.items.length}건</div>
    <div id="twFloorList"></div>`;
  box.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{ const v=b.dataset.f; TW.floor=v==="null"?null:Number(v); TW.planId=null; TW.placing=null; renderTwin(); });
  box.querySelector("#twPlan")?.addEventListener("change",e=>{ TW.planId=e.target.value; renderTwin(); });
  box.querySelector("#twCancel")?.addEventListener("click",()=>{ TW.placing=null; renderTwin(); });

  const stageBox=box.querySelector("#twStage");
  if(!plan){ stageBox.innerHTML=`<div class="empty"><div class="ic">🗺️</div>도면이 없습니다. 수집 탭에서 도면을 촬영하세요.</div>`; }
  else {
    const stage=el("div","stage"+(placingItem?" placing":""));
    const img=el("img"); stage.appendChild(img);
    photoURL(plan.photoId).then(u=>img.src=u);
    S.roster.filter(r=>r.pos?.planId===plan.id && validPos(r.pos)).forEach(r=>{
      const pin=el("div","pin"+(TW.sel===r.tid?" sel":"")+(cur.items.length&&r.floor!==TW.floor&&cur.plans.length?" dim":""));
      pin.style.left=(r.pos.x*100)+"%"; pin.style.top=(r.pos.y*100)+"%";
      pin.innerHTML=`<span class="hd" style="background:${STATUS_COLOR[r.status]||"var(--brand)"}">${esc(r.code)}${r.verified?" ✔":""}</span><span class="tl"></span>`;
      pin.onclick=ev=>{ ev.stopPropagation(); if(TW.placing) return; TW.sel=r.tid; ui.openSheet("item", r.tid); };
      stage.appendChild(pin);
    });
    stage.addEventListener("click",ev=>{
      if(!TW.placing) return;
      const it=byTid(TW.placing); if(!it) return;
      const rc=stage.getBoundingClientRect();
      const x=+clamp01((ev.clientX-rc.left)/rc.width).toFixed(3), y=+clamp01((ev.clientY-rc.top)/rc.height).toFixed(3);
      const before=validPos(it.pos)?`${it.pos.x},${it.pos.y}`:"";
      it.pos={planId:plan.id, x, y, manual:true};
      if(it.floor==null && plan.floor!=null) it.floor=plan.floor;
      logEdit(it,[{field:"pos", from:before, to:`${x},${y}@${plan.name}`}]);
      TW.placing=null; TW.sel=it.tid; save(); renderTwin(); toast("배치 완료","good");
    });
    stageBox.appendChild(stage);
  }

  const lb=box.querySelector("#twFloorList");
  if(!cur.items.length){ lb.innerHTML=`<div class="empty faint">이 층의 설비가 없습니다</div>`; return; }
  cur.items.forEach(r=>{
    const placed=validPos(r.pos);
    const row=el("div","tn");
    row.innerHTML=`<span class="dt" style="background:${STATUS_COLOR[r.status]||"var(--ink-faint)"}"></span>
      <span class="cd">${esc(r.code)}</span><span class="nm">${esc(r.name)} ${r.verified?'<span class="ver">✔</span>':""}</span>
      <span class="fx">${esc(r.room||"")}</span>
      <button class="btn sm ${placed?"ghost":""}" style="padding:5px 9px">${placed?"재배치":"📍 배치"}</button>`;
    row.querySelector("button").onclick=ev=>{ ev.stopPropagation();
      if(!plan){ toast("도면이 없습니다","bad"); return; }
      TW.placing=r.tid; renderTwin(); window.scrollTo({top:$("#twStage").getBoundingClientRect().top+scrollY-90, behavior:"smooth"}); };
    row.onclick=()=>ui.openSheet("item", r.tid);
    lb.appendChild(row);
  });
}

function renderTopo(box){
  const {map, children}=topology();
  const R=S.roster;
  const roots=R.filter(r=>!map[r.tid].parent);
  const orphan=new Set(roots.filter(r=>TOPO_PARENTS[r.code]).map(r=>r.tid));
  const tier=c=>TOPO_PARENTS[c]?1:0;
  roots.sort((a,b)=>tier(a.code)-tier(b.code) || (EQUIP_CATS.indexOf(CAT_BY_CODE[a.code])-EQUIP_CATS.indexOf(CAT_BY_CODE[b.code])));
  const sel=TW.sel?byTid(TW.sel):null;
  const affected=new Set(sel?descendants(sel.tid, children):[]);

  let impactHTML="";
  if(sel){
    const aff=[...affected].map(byTid).filter(Boolean);
    const byFloor={}; aff.forEach(a=>{ const k=floorLabel(a.floor); byFloor[k]=(byFloor[k]||0)+1; });
    const up=[]; let cur=map[sel.tid]?.parent; while(cur && up.length<10){ const u=byTid(cur); if(!u) break; up.unshift(u); cur=map[cur]?.parent; }
    impactHTML=`<div class="note" style="margin-bottom:11px">
      <b>${esc(sel.name)}</b> <span class="faint">${esc(sel.code)} · ${floorLabel(sel.floor)}</span><br>
      ${up.length?`상위 경로: ${up.map(u=>esc(u.code)).join(" → ")} → <b>${esc(sel.code)}</b><br>`:""}
      장애 시 영향: <b style="color:${aff.length?"var(--warn)":"var(--good)"}">하위 ${aff.length}개 설비</b>
      ${aff.length?`<br><span class="mono" style="font-size:11.5px">${Object.entries(byFloor).map(([k,v])=>`${k}:${v}`).join("  ")}</span>`:""}
      <div class="row tight" style="margin-top:8px"><button class="btn sm" id="tpEdit">상세·상위 지정</button><button class="btn sm ghost" id="tpClr">선택 해제</button></div></div>`;
  }
  box.innerHTML=`${impactHTML}
    <div class="hint" style="margin:0 0 8px">설비를 탭하면 상·하위 경로와 장애 영향 범위를 분석합니다. <span class="inf">(추론)</span>은 규칙 기반 자동 연결이며, 상세에서 상위 설비를 직접 지정할 수 있습니다.</div>
    <div id="tpTree"></div>
    ${orphan.size?`<div class="note" style="margin-top:10px">🔌 <b>상위 연결 미확인 ${orphan.size}건</b> — 대장에 상위 설비(예: MDF, IDF, UPS)가 없거나 지정되지 않았습니다.</div>`:""}`;
  box.querySelector("#tpEdit")?.addEventListener("click",()=>ui.openSheet("item", sel.tid));
  box.querySelector("#tpClr")?.addEventListener("click",()=>{ TW.sel=null; renderTwin(); });

  const tree=box.querySelector("#tpTree");
  const draw=(r,depth)=>{
    const kids=(children[r.tid]||[]).map(byTid).filter(Boolean);
    const n=descendants(r.tid, children).length;
    const col=TW.collapsed[r.tid];
    const row=el("button","tn"+(TW.sel===r.tid?" sel":"")+(affected.has(r.tid)?" hit":""));
    row.style.paddingLeft=(8+depth*16)+"px";
    row.innerHTML=`<span class="tw">${kids.length?(col?"▸":"▾"):"·"}</span>
      <span class="dt" style="background:${STATUS_COLOR[r.status]||"var(--ink-faint)"}"></span>
      <span class="cd">${esc(r.code)}</span><span class="nm">${esc(r.name)}${r.verified?' <span class="ver">✔</span>':""}</span>
      ${map[r.tid].inferred?'<span class="inf">(추론)</span>':""}${orphan.has(r.tid)?'<span class="badge miss">미연결</span>':""}
      <span class="fx">${floorLabel(r.floor)}</span>${n?`<span class="imp">↓${n}</span>`:""}`;
    row.querySelector(".tw").onclick=ev=>{ if(!kids.length) return; ev.stopPropagation(); TW.collapsed[r.tid]=!col; renderTwin(); };
    row.onclick=()=>{ TW.sel = TW.sel===r.tid?null:r.tid; renderTwin(); };
    tree.appendChild(row);
    if(!col) kids.sort((a,b)=>(b.floor??-99)-(a.floor??-99)).forEach(k=>draw(k,depth+1));
  };
  roots.forEach(r=>draw(r,0));
}

/* ---------- 수동 설비 추가 ---------- */
function addManualItem(){
  const it=normItem({code:"ETC", name:"신규 설비", loc:"", status:"field_new", spec_final:"", confidence:1, manual:true, verified:true});
  S.roster.push(it);
  pushHistory({kind:"edit", source:"manual", changes:[{type:"added", tid:it.tid, name:it.name, to:""}]});
  save(); render(); ui.openSheet("item", it.tid);
}

/* ---------- 이력 렌더 ---------- */
function renderHistory(box){
  if(!S.history.length){ box.innerHTML=`<div class="empty faint">아직 현행화 이력이 없습니다</div>`; return; }
  const fl={spec_final:"규격",status:"상태",loc:"위치",name:"명칭",code:"분류",floor:"층",parent:"상위",verified:"현장확인",pos:"배치",memo:"메모"};
  const sv=v=>{ const s=STATUS_META[v]?.t; return s||v; };
  box.innerHTML=`<div class="hist">${S.history.slice(0,30).map(h=>{
    const ch=h.changes||[];
    const lines=ch.slice(0,8).map(c=> c.type==="added"?`+ ${esc(c.name)}`
      : c.type==="removed"?`− ${esc(c.name)}`
      : `~ ${esc(c.name)} · ${fl[c.field]||esc(c.field)}: ${esc(sv(c.from)||"∅")} → ${esc(sv(c.to)||"∅")}`).join("<br>");
    const title = h.kind==="link"
      ? `${h.source==="local"?"로컬 규칙":"AI"} 연동 · 대장 ${h.total??"-"}건 <span class="faint">(+${h.counts?.added||0} / −${h.counts?.removed||0} / ~${h.counts?.changed||0})</span>`
      : `수동 수정 · ${ch.length}건`;
    return `<div class="he ${h.kind}"><div class="t">${fmt(h.at)}</div><div class="d">${title}</div>
      ${lines?`<div class="cl">${lines}${ch.length>8?`<br>… 외 ${ch.length-8}건`:""}</div>`:""}</div>`;
  }).join("")}</div>`;
}

/* ---------- 트윈 JSON 내보내기 ---------- */
function exportTwin(){
  const {map}=topology(); const h=twinHealth();
  const twin={_repiqTwin:1, version:2, site:S.site, siteNote:S.siteNote, exportedAt:now(), linkedAt:S.linkedAt, health:h,
    building:{floors:floorsModel().map(f=>({floor:f.floor, label:floorLabel(f.floor), plans:f.plans.map(p=>({id:p.id,name:p.name})), assets:f.items.map(r=>r.tid)}))},
    assets:S.roster.map(r=>({tid:r.tid, code:r.code, category:CAT_BY_CODE[r.code]?.name||"", group:CAT_BY_CODE[r.code]?.group||"",
      name:r.name, floor:r.floor, room:r.room||"", loc:r.loc||"", spec:r.spec_final||"", spec_plan:r.spec_plan||"", spec_field:r.spec_field||"",
      status:r.status, verified:!!r.verified, confidence:r.confidence??null, position:validPos(r.pos)?r.pos:null, memo:r.memo||""})),
    edges:S.roster.filter(r=>map[r.tid]?.parent).map(r=>({from:map[r.tid].parent, to:r.tid, inferred:map[r.tid].inferred})),
    history:S.history};
  download(new Blob([JSON.stringify(twin,null,1)],{type:"application/json"}), `RepiQ_디지털트윈_${S.site||"현장"}_${dstamp()}.json`);
  toast("트윈 데이터 내보냄","good");
}
window.exportTwin=exportTwin; window.addManualItem=addManualItem;
