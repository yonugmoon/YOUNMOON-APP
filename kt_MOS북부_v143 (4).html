  /* ============================================================
     🏢 현장 건물 구조 — 점검 위치 자동 연동
     - 점검에서 입력한 위치 탭 데이터를 자동으로 건물구조에 반영
     - 층별 floor map 자동 생성
     - 설비별 위치 점검 현황 표시
  ============================================================ */

  // 위치명에서 층 번호 추출
  function extractFloor(name){
    if(!name) return null;
    const m = name.match(/(?:지하|B)(\d+)층?/i);
    if(m) return -parseInt(m[1]);
    // 1F, 3F 형식 추가
    const mF = name.match(/(\d+)F(?!\w)/i);
    if(mF) return parseInt(mF[1]);
    // B1F, B3F 형식 추가
    const mBF = name.match(/B(\d+)F/i);
    if(mBF) return -parseInt(mBF[1]);
    const m2 = name.match(/(\d+)층/);
    if(m2) return parseInt(m2[1]);
    if(/옥상|RF|PH/i.test(name)) return 999;
    return null;
  }

  // 위치명에서 실 유형 추출
  function extractRoomType(name){
    if(!name) return name;
    const types = ['방재실','통신실','전기실','TPS실','MDF실','EPS실','UPS실','기계실','서버실','감시반','발전기실','배전반'];
    for(const t of types){ if(name.includes(t)) return t; }
    return name;
  }

  // 위치명에서 건물명 추출 (층 표기 앞부분, 지상/지하 방향 표기는 제거)
  function extractBuilding(name){
    if(!name) return "";
    const m = name.match(/^(.*?)\s*(지하\s*\d+\s*층|B\s*\d+\s*층|B\d+F|\d+\s*층|\d+\s*F|옥상|RF|PH|지하)/i);
    if(m && m[1] && m[1].trim()){
      let b = m[1].trim();
      // 건물명 끝에 붙은 방향 표기(지상/지하) 제거 → 같은 동끼리 묶음
      b = b.replace(/\s*(지상|지하)\s*$/,'').trim();
      return b;
    }
    return "";
  }

  // 위치 진행률 계산
  function calcLocProgress(loc){
    const items = loc.items||[];
    if(!items.length) return {pct:0, status:'미점검'};
    const done = items.filter(it=>it.result).length;
    const bad  = items.filter(it=>it.result==='불량').length;
    if(done===0) return {pct:0, status:'미점검'};
    if(done<items.length) return {pct:Math.round(done/items.length*100), status:'진행중'};
    if(bad>0) return {pct:100, status:'불량포함', bad};
    return {pct:100, status:'완료'};
  }

  // 점검 위치 데이터로 건물구조 자동 생성
  function buildAutoStructure(){
    const locMap = {}; // locKey → {cat, loc, floor, roomType, progress}
    const floors  = new Set();
    const roomTypes = new Set();

    (current.categories||[]).forEach(cat=>{
      (cat.locations||[]).forEach(loc=>{
        if(!loc.name) return;
        const floor = extractFloor(loc.name);
        const rtype = extractRoomType(loc.name);
        const prog  = calcLocProgress(loc);
        const key   = `${cat.id}:${loc.id}`;
        locMap[key] = {cat, loc, floor, rtype, prog};
        if(floor!==null) floors.add(floor);
        roomTypes.add(rtype);
      });
    });

    return {locMap, floors:[...floors].sort((a,b)=>b-a), roomTypes:[...roomTypes]};
  }

  function openSiteStructureModal(){
    if(!current) return;
    renderSiteStructureSheet();
  }

    const ingLocs    = allLocs.filter(l=>l.prog.status==='진행중').length;

    // floor map 테이블 빌드

      const thStyle1 = 'background:#1A2540;color:#fff;padding:6px 10px;text-align:center;min-width:48px;border:1px solid #333;';
      const thStyle2 = 'background:#1A2540;color:#fff;padding:6px 10px;text-align:left;border:1px solid #333;';

      bldNames.forEach(bld=>{

        // 건물 헤더

          <span style="font-size:11px;color:#fff;font-weight:700;background:rgba(255,255,255,.2);border-radius:6px;padding:2px 8px;">${bldLocs}개소</span>
        </div>`;

        html += `<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:2px;">`;

          entries.forEach(({cat,loc,prog})=>{

            const bg = prog.status==='완료'?'var(--good-weak)':prog.status==='불량포함'?'#fff0ee':prog.status==='진행중'?'var(--warn-weak)':'var(--bg)';
            const border = prog.status==='완료'?'var(--good)':prog.status==='불량포함'?'var(--bad)':prog.status==='진행중'?'var(--warn)':'var(--border)';
            // 건물명은 헤더에 있으므로 위치명에서 접두 건물명 제거
            let dispName = loc.name;

    // 🏗 입체(아이소메트릭) 뷰 — 클립아트 스타일 SVG 건물 (buildFloorTable과 동일한 bldMap 사용)
    function buildIsoView(){
      const bldMap = {};
      Object.values(locMap).forEach(entry=>{
        const f = entry.floor;
        if(f===null) return;
        const bld = extractBuilding(entry.loc.name) || "(건물 미지정)";
        if(!bldMap[bld]) bldMap[bld] = {};
        if(!bldMap[bld][f]) bldMap[bld][f] = [];
        bldMap[bld][f].push(entry);
      });

      const bldNames = Object.keys(bldMap);
      if(!bldNames.length){
        return `<div style="text-align:center;padding:16px;color:var(--muted);font-size:12.5px;">
          층 정보가 있는 위치가 없습니다<br>
          <span style="font-size:11px;">위치명에 "1층", "B1층" 등 층수를 포함하면 자동 표시됩니다</span>
        </div>`;
      }
      bldNames.sort((a,b)=>{
        if(a==="(건물 미지정)") return 1;
        if(b==="(건물 미지정)") return -1;
        return a.localeCompare(b,'ko');
      });

      function floorSt(entries){
        if(entries.some(e=>e.prog.status==='불량포함')) return 'bad';
        if(entries.every(e=>e.prog.status==='완료')) return 'ok';
        if(entries.some(e=>e.prog.status==='완료'||e.prog.status==='진행중')) return 'ing';
        return 'wait';
      }
      const stKor = {ok:'완료', bad:'불량 포함', ing:'진행중', wait:'미점검'};
      const PAL = {
        ok:  {top:'#9FF0EA', front:'#35C7BF', side:'#1B9C95', win:'#E8FFFD', winS:'#C4F4F0'},
        bad: {top:'#FFC9CB', front:'#F2696E', side:'#C4444A', win:'#FFECED', winS:'#FFD6D8'},
        ing: {top:'#FFE6B0', front:'#F0B03E', side:'#C98F1E', win:'#FFF7E2', winS:'#FFEDC6'},
        wait:{top:'#E4E8F1', front:'#B2BACB', side:'#8B93A8', win:'#F7F9FC', winS:'#EAEEF6'}
      };
      const BW=120, BD=80, FH=32, ISO_C=0.866, ISO_S=0.5;
      const isoPx = (x,y,z)=>[ +((x-y)*ISO_C).toFixed(1), +((x+y)*ISO_S - z).toFixed(1) ];
      const isoPts = list=>list.map(p=>isoPx(p[0],p[1],p[2]).join(',')).join(' ');
      const fLabel = f=>f===999?'옥상':f>0?`${f}층`:`B${Math.abs(f)}층`;
      const fKey   = f=>f<0?('m'+Math.abs(f)):String(f);

      let html = `<div class="iso-legend">
        <span><i style="background:#35C7BF"></i>완료</span>
        <span><i style="background:#F2696E"></i>불량 포함</span>
        <span><i style="background:#F0B03E"></i>진행중</span>
        <span><i style="background:#B2BACB"></i>미점검</span>
      </div>`;

      bldNames.forEach((bld,bi)=>{
        const floorMap = bldMap[bld];
        const asc  = Object.keys(floorMap).map(Number).sort((a,b)=>a-b);  // 아래→위 (그리기)
        const desc = [...asc].reverse();                                   // 위→아래 (상세 목록)
        const bldLocs = asc.reduce((n,f)=>n+floorMap[f].length,0);
        const n = asc.length;
        const roofH=8, phW=34, phD=26, phH=14, antH=18;
        const topZ = n*FH + roofH + phH + antH;
        const minX=(0-BD)*ISO_C-16, maxX=BW*ISO_C+16;
        const minY=-topZ-8, maxY=(BW+BD)*ISO_S+26;

        // 건물 헤더
        html += `<div style="display:flex;align-items:center;gap:8px;margin:12px 0 0;background:linear-gradient(135deg,#1ABDB5,#128C86);border-radius:10px;padding:8px 12px;box-shadow:0 2px 6px rgba(26,189,181,.35);">
          <span style="font-size:14px;font-weight:800;color:#fff;">🏢 ${escapeHtml(bld)}</span>
          <span style="font-size:11px;color:#fff;font-weight:700;background:rgba(255,255,255,.2);border-radius:6px;padding:2px 8px;">${n}개층 · ${bldLocs}개소</span>
        </div>`;

        let svg = '';
        // 바닥 잔디
        const gC = isoPx(BW/2, BD/2, 0);
        svg += `<ellipse cx="${gC[0]}" cy="${gC[1]}" rx="${(BW+BD)*ISO_C/2+16}" ry="${(BW+BD)*ISO_S/2+14}" fill="#CBE8C4"/>`;
        svg += `<ellipse cx="${gC[0]}" cy="${gC[1]}" rx="${(BW+BD)*ISO_C/2+8}" ry="${(BW+BD)*ISO_S/2+7}" fill="#DDF2D7"/>`;

        // 층 (아래→위)
        asc.forEach((f,fi)=>{
          const entries = floorMap[f];
          const st = floorSt(entries);
          const p  = PAL[st];
          const badN  = entries.filter(e=>e.prog.status==='불량포함').length;
          const doneN = entries.filter(e=>e.prog.status==='완료'||e.prog.status==='불량포함').length;
          const z0 = fi*FH, z1 = z0+FH;

          svg += `<g class="iso-floor-g" data-bi="${bi}" data-fk="${fKey(f)}">`;
          svg += `<polygon points="${isoPts([[BW,0,z1],[BW,BD,z1],[BW,BD,z0],[BW,0,z0]])}" fill="${p.side}" stroke="#fff" stroke-width="1"/>`;
          svg += `<polygon points="${isoPts([[0,BD,z1],[BW,BD,z1],[BW,BD,z0],[0,BD,z0]])}" fill="${p.front}" stroke="#fff" stroke-width="1"/>`;
          svg += `<polygon points="${isoPts([[0,0,z1],[BW,0,z1],[BW,BD,z1],[0,BD,z1]])}" fill="${p.top}" stroke="#fff" stroke-width="1"/>`;
          // 앞면 창문 3개
          for(let w=0; w<3; w++){
            const xa=14+w*36, xb=xa+22, za=z0+9, zb=z0+23;
            svg += `<polygon points="${isoPts([[xa,BD,zb],[xb,BD,zb],[xb,BD,za],[xa,BD,za]])}" fill="${p.win}" stroke="${p.side}" stroke-width=".6"/>`;
          }
          // 옆면 창문 2개
          for(let w=0; w<2; w++){
            const ya=12+w*36, yb=ya+22, za=z0+9, zb=z0+23;
            svg += `<polygon points="${isoPts([[BW,ya,zb],[BW,yb,zb],[BW,yb,za],[BW,ya,za]])}" fill="${p.winS}" stroke="${p.side}" stroke-width=".6"/>`;
          }
          // 층 라벨 (앞면에 밀착)
          const lp = isoPx(4, BD, z0+FH-8);
          svg += `<text transform="matrix(0.866,0.5,0,1,${lp[0]},${lp[1]})" font-size="10.5" font-weight="800" fill="#fff" style="paint-order:stroke;stroke:${p.side};stroke-width:2.5">${fLabel(f)}</text>`;
          // 상태 뱃지
          const bp = isoPx(BW-4, BD, z0+FH-8);
          const badge = badN ? `⚠${badN}` : `${doneN}/${entries.length}`;
          svg += `<text transform="matrix(0.866,0.5,0,1,${bp[0]},${bp[1]})" text-anchor="end" font-size="9" font-weight="700" fill="#fff" style="paint-order:stroke;stroke:${p.side};stroke-width:2.2">${badge}</text>`;
          svg += `</g>`;
        });

        // 지붕 슬라브 + 옥탑 + 안테나
        const rz0=n*FH, rz1=rz0+roofH;
        svg += `<polygon points="${isoPts([[BW,0,rz1],[BW,BD,rz1],[BW,BD,rz0],[BW,0,rz0]])}" fill="#26334F" stroke="#fff" stroke-width="1"/>`;
        svg += `<polygon points="${isoPts([[0,BD,rz1],[BW,BD,rz1],[BW,BD,rz0],[0,BD,rz0]])}" fill="#324260" stroke="#fff" stroke-width="1"/>`;
        svg += `<polygon points="${isoPts([[0,0,rz1],[BW,0,rz1],[BW,BD,rz1],[0,BD,rz1]])}" fill="#42557C" stroke="#fff" stroke-width="1"/>`;
        const ox=BW-phW-10, oy=8, oz0=rz1, oz1=rz1+phH;
        svg += `<polygon points="${isoPts([[ox+phW,oy,oz1],[ox+phW,oy+phD,oz1],[ox+phW,oy+phD,oz0],[ox+phW,oy,oz0]])}" fill="#8B93A8"/>`;
        svg += `<polygon points="${isoPts([[ox,oy+phD,oz1],[ox+phW,oy+phD,oz1],[ox+phW,oy+phD,oz0],[ox,oy+phD,oz0]])}" fill="#B2BACB"/>`;
        svg += `<polygon points="${isoPts([[ox,oy,oz1],[ox+phW,oy,oz1],[ox+phW,oy+phD,oz1],[ox,oy+phD,oz1]])}" fill="#E4E8F1"/>`;
        const a1=isoPx(20,20,oz1), a2=isoPx(20,20,oz1+antH);
        svg += `<line x1="${a1[0]}" y1="${a1[1]}" x2="${a2[0]}" y2="${a2[1]}" stroke="#5B6478" stroke-width="2"/>`;
        svg += `<circle cx="${a2[0]}" cy="${a2[1]}" r="2.6" fill="#F2696E"/>`;

        html += `<div class="iso-svg-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${maxX-minX} ${maxY-minY}">${svg}</svg>
        </div>`;

        // 층별 상세 (위→아래 순서)
        desc.forEach(f=>{
          const entries = floorMap[f];
          const st = floorSt(entries);
          let chips = '';
          entries.forEach(({cat,loc,prog})=>{
            const icon = prog.status==='완료'?'✅':prog.status==='불량포함'?'⚠️':prog.status==='진행중'?'🔄':'⏳';
            const bg = prog.status==='완료'?'var(--good-weak)':prog.status==='불량포함'?'#fff0ee':prog.status==='진행중'?'var(--warn-weak)':'var(--bg)';
            const border = prog.status==='완료'?'var(--good)':prog.status==='불량포함'?'var(--bad)':prog.status==='진행중'?'var(--warn)':'var(--border)';
            let dispName = loc.name;
            if(bld!=="(건물 미지정)" && dispName.startsWith(bld)) dispName = dispName.slice(bld.length).trim();
            dispName = dispName.replace(/^지상\s+/,'').trim();
            chips += `<span class="floor-item-btn" data-catid="${cat.id}" data-locid="${loc.id}" style="background:${bg};border:1.5px solid ${border};border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;">
              ${icon} ${escapeHtml(dispName)} <span style="font-size:10px;opacity:.7;">${cat.name.slice(0,5)}</span>
            </span>`;
          });
          html += `<div class="iso-detail" id="isoDet-${bi}-${fKey(f)}">
            <h5>${fLabel(f)} 점검 위치 <span class="cnt">${entries.length}개소 · ${stKor[st]}</span></h5>
            <div style="display:flex;flex-wrap:wrap;gap:4px;">${chips}</div>
          </div>`;
        });
      });

      // 층 클릭 → 상세 펼침/접힘 + 하이라이트 (칩 클릭은 기존 floor-item-btn 핸들러가 처리)
      setTimeout(()=>{
        document.querySelectorAll('#struct-iso-view .iso-floor-g').forEach(g=>{
          g.addEventListener('click', ()=>{
            const bi = g.getAttribute('data-bi'), fk = g.getAttribute('data-fk');
            const det = document.getElementById(`isoDet-${bi}-${fk}`);
            const wasOpen = det && det.classList.contains('open');
            document.querySelectorAll('#struct-iso-view .iso-detail.open').forEach(d=>d.classList.remove('open'));
            document.querySelectorAll('#struct-iso-view .iso-floor-g.sel').forEach(s=>s.classList.remove('sel'));
            if(det && !wasOpen){
              det.classList.add('open');
              g.classList.add('sel');
              det.scrollIntoView({behavior:'smooth', block:'nearest'});
            }
          });
        });
      }, 60);

      return html;
    }

    // 설비별 위치 목록
    function buildCatList(){
      if(!Object.keys(catGroups).length){
        return `<div style="text-align:center;padding:16px;color:var(--muted);font-size:12.5px;">
          등록된 위치가 없습니다<br><span style="font-size:11px;">점검 화면에서 위치 탭을 추가해주세요</span>
        </div>`;
      }
      const html = Object.values(catGroups).map(({cat,locs})=>{
        const catDone = locs.filter(l=>l.prog.status==='완료'||l.prog.status==='불량포함').length;
        const catPct  = Math.round(catDone/locs.length*100);
        return `
        <div style="border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;">
          <div style="background:#1A2540;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;">

          </div>
          ${locs.map(({loc,prog})=>{
            const icon = prog.status==='완료'?'✅':prog.status==='불량포함'?'⚠️':prog.status==='진행중'?'🔄':'⏳';
            const items = loc.items||[];
            const done  = items.filter(it=>it.result).length;
            const bad   = items.filter(it=>it.result==='불량').length;
            return `
            <div class="cat-loc-item" data-catid="${cat.id}" data-locid="${loc.id}" style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--border);cursor:pointer;background:#fff;">
              <span style="font-size:18px;width:24px;text-align:center;">${icon}</span>
              <div style="flex:1;">
                <div style="font-size:13px;font-weight:700;">${escapeHtml(loc.name||'(위치명 없음)')}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:1px;">
                  ${done}/${items.length}항목 완료
                  ${bad?` · <span style="color:var(--bad);">부적합 ${bad}건</span>`:''}
                  ${(loc.photos||[]).length?` · 📷${(loc.photos||[]).length}장`:''}

                <div style="background:var(--bg);border-radius:4px;height:4px;margin-top:4px;overflow:hidden;">
                  <div style="width:${prog.pct}%;height:100%;background:${bad?'var(--bad)':prog.pct===100?'var(--good)':'var(--accent)'};border-radius:4px;"></div>
                </div>
              </div>
              <span style="font-size:12px;font-weight:800;color:var(--accent);">${prog.pct}%</span>
            </div>`;
          }).join('')}
        </div>`;
      }).join('');
      
      // addEventListener 방식으로 클릭 핸들러 추가
      setTimeout(()=>{
        document.querySelectorAll('.cat-loc-item').forEach(item=>{
          item.addEventListener('click', ()=>{
            const catId = item.getAttribute('data-catid');
            const locId = item.getAttribute('data-locid');
            const overlay = document.getElementById('site-struct-overlay');
            if(overlay) overlay.remove();
            // 부적합 모달 표시
            showDefectsModal(catId, locId);
          });
        });
      }, 50);
      
      return html;
    }

    const ov = document.createElement('div');
    ov.id = 'site-struct-overlay';
    ov.className = 'overlay';
    ov.style.cssText = 'overflow-y:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;';
    ov.innerHTML = `
      <!-- 헤더 (한 줄 고정 바) -->
      <div style="background:#1A2540;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;width:100%;">
        <button onclick="document.getElementById('site-struct-overlay').remove()" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">←</button>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14.5px;font-weight:800;white-space:nowrap;">🏢 현장 건물 구조</div>
          <div style="font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(current.siteName)} · 총 ${totalLocs}개 위치</div>
        </div>
        <button id="struct-xlsx-btn" style="background:var(--accent);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">📊 엑셀</button>
        <button id="struct-dash-btn" style="background:#2563EB;border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">📈 대시보드</button>
      </div>

      <div style="padding:12px;">
        <!-- 전체 요약 -->
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;">
          <div style="background:#fff;border-radius:10px;padding:10px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);">
            <div style="font-size:20px;font-weight:900;color:var(--accent);">${totalLocs}</div>
            <div style="font-size:10px;color:var(--muted);">전체</div>
          </div>
          <div style="background:#fff;border-radius:10px;padding:10px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);">
            <div style="font-size:20px;font-weight:900;color:var(--good);">${doneLocs}</div>
            <div style="font-size:10px;color:var(--muted);">완료</div>
          </div>
          <div style="background:#fff;border-radius:10px;padding:10px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);">
            <div style="font-size:20px;font-weight:900;color:var(--warn);">${ingLocs}</div>
            <div style="font-size:10px;color:var(--muted);">진행중</div>
          </div>
          <div style="background:#fff;border-radius:10px;padding:10px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);">
            <div style="font-size:20px;font-weight:900;color:var(--muted);">${waitLocs}</div>
            <div style="font-size:10px;color:var(--muted);">미점검</div>
          </div>
        </div>

        <!-- 전체 진행률 -->
        <div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:13px;font-weight:700;">전체 진행률</span>
            <span style="font-size:18px;font-weight:900;color:var(--accent);">${totalPct}%</span>
          </div>
          <div style="background:var(--bg);border-radius:8px;height:10px;overflow:hidden;">
            <div style="width:${totalPct}%;height:100%;background:${totalPct===100?'var(--good)':'var(--accent)'};border-radius:8px;transition:width .4s;"></div>
          </div>
        </div>

        <!-- 안내 배너 -->
        <div style="background:var(--accent-weak);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--accent);line-height:1.7;">
          💡 위치를 탭하면 해당 설비 점검 화면으로 이동합니다<br>
          위치명에 <b>"1층"</b>, <b>"B1층"</b> 등 층수를 포함하면 층별 지도에 자동 표시됩니다
        </div>

        <!-- 탭 전환 -->
        <div style="display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px;" id="struct-tab-wrap">
          <button id="stab-floor" style="flex:1;padding:8px 4px;border:none;border-radius:8px;background:#fff;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);">🗺 층별 지도</button>
          <button id="stab-iso" style="flex:1;padding:8px 4px;border:none;border-radius:8px;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;">🏗 입체 뷰</button>
          <button id="stab-cat" style="flex:1;padding:8px 4px;border:none;border-radius:8px;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;">📋 설비별 목록</button>
        </div>

        <!-- 층별 지도 -->
        <div id="struct-floor-view" style="background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px;">🗺 층별 점검 현황</div>
          ${buildFloorTable()}
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
            <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;">✅ 완료</span>
            <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;">⚠️ 불량포함</span>
            <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;">🔄 진행중</span>
            <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;">⏳ 미점검</span>
          </div>
        </div>

        <!-- 입체 뷰 -->
        <div id="struct-iso-view" style="display:none;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
          <div style="font-size:13px;font-weight:700;margin-bottom:2px;">🏗 건물 입체 점검 현황</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">층을 탭하면 해당 층 점검 위치가 펼쳐집니다 · 위치를 탭하면 점검 화면으로 이동합니다</div>
          ${buildIsoView()}
        </div>

        <!-- 설비별 목록 -->
        <div id="struct-cat-view" style="display:none;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px;">📋 설비별 위치 목록</div>
          ${buildCatList()}
        </div>
      </div>
    `;
    document.body.appendChild(ov);

    // 탭 버튼 이벤트 바인딩 (IIFE 내부 함수라 인라인 onclick은 동작하지 않음)
    document.getElementById('stab-floor').addEventListener('click', ()=>switchStructTab('floor'));
    document.getElementById('stab-iso').addEventListener('click', ()=>switchStructTab('iso'));
    document.getElementById('stab-cat').addEventListener('click', ()=>switchStructTab('cat'));
    document.getElementById('struct-xlsx-btn').addEventListener('click', exportStructureExcel);
    document.getElementById('struct-dash-btn').addEventListener('click', exportDashboardExcel);
  }

  function switchStructTab(tab){
    const views = {floor:'struct-floor-view', iso:'struct-iso-view', cat:'struct-cat-view'};
    const onCss  = 'flex:1;padding:8px 4px;border:none;border-radius:8px;background:#fff;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);';
    const offCss = 'flex:1;padding:8px 4px;border:none;border-radius:8px;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;';
    Object.keys(views).forEach(k=>{
      const v = document.getElementById(views[k]);
      if(v) v.style.display = (k===tab)?'block':'none';
      const b = document.getElementById('stab-'+k);
      if(b) b.style.cssText = (k===tab)?onCss:offCss;
    });
  }

  /* ============================================================
     📊 건물 구조 엑셀 내보내기 — 3시트 (층별 지도 / 입체 뷰 / 설비별 목록)
  ============================================================ */
  async function exportStructureExcel(){
    if(!current) return;
    if(typeof ExcelJS === 'undefined'){
      alert('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 새로고침해 주세요.');
      return;
    }
    const btn = document.getElementById('struct-xlsx-btn');
    if(btn){ btn.disabled = true; btn.textContent = '생성 중…'; }

    try{
      const {locMap} = buildAutoStructure();

      // 건물 → 층 → entries (층별지도/입체뷰와 동일한 그룹핑)
      const bldMap = {};
      Object.values(locMap).forEach(entry=>{
        const bld = (entry.floor!==null ? (extractBuilding(entry.loc.name)||"(건물 미지정)") : "(층 정보 없음)");
        if(!bldMap[bld]) bldMap[bld] = {};
        const f = entry.floor===null ? -9999 : entry.floor;
        if(!bldMap[bld][f]) bldMap[bld][f] = [];
        bldMap[bld][f].push(entry);
      });
      const bldNames = Object.keys(bldMap).sort((a,b)=>{
        if(a.startsWith("(")) return 1;
        if(b.startsWith("(")) return -1;
        return a.localeCompare(b,'ko');
      });

      const fLabel = f=>f===999?'옥상':f===-9999?'-':f>0?`${f}층`:`B${Math.abs(f)}층`;
      const COLORS = {
        '완료':    {fill:'FF2FBFB7', font:'FFFFFFFF'},
        '불량포함':{fill:'FFF2696E', font:'FFFFFFFF'},
        '진행중':  {fill:'FFF0B03E', font:'FFFFFFFF'},
        '미점검':  {fill:'FFB2BACB', font:'FFFFFFFF'}
      };
      const NAVY='FF1A2540', WHITE='FFFFFFFF', ROOF='FF26334F', GRASS='FFDDF2D7';
      const thinW = {style:'thin', color:{argb:WHITE}};
      const borderAll = {top:thinW,bottom:thinW,left:thinW,right:thinW};
      const center = {vertical:'middle', horizontal:'center', wrapText:true};

      function floorSt(entries){
        if(entries.some(e=>e.prog.status==='불량포함')) return '불량포함';
        if(entries.every(e=>e.prog.status==='완료')) return '완료';
        if(entries.some(e=>e.prog.status==='완료'||e.prog.status==='진행중')) return '진행중';
        return '미점검';
      }
      function headerRow(ws, r, texts, widths){
        texts.forEach((t,i)=>{
          const c = ws.getCell(r, i+1);
          c.value = t;
          c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};
          c.font = {bold:true,color:{argb:WHITE},size:11};
          c.alignment = center;
          c.border = borderAll;
          if(widths) ws.getColumn(i+1).width = widths[i];
        });
        ws.getRow(r).height = 22;
      }

      const wb = new ExcelJS.Workbook();
      wb.creator = 'kt MOS북부';

      /* ── 시트 1: 층별 지도 ── */
      const ws1 = wb.addWorksheet('층별 지도');
      // 제목
      ws1.mergeCells(1,1,1,8);
      const t1 = ws1.getCell(1,1);
      t1.value = `🏢 ${current.siteName} 층별 점검 현황 (${current.date||''})`;
      t1.font = {bold:true,size:13,color:{argb:NAVY}};
      ws1.getRow(1).height = 24;
      headerRow(ws1, 2, ['건물','층','점검 위치','설비','상태','항목 진행','불량','사진'], [16,8,34,20,11,11,7,7]);

      let r1 = 3;
      bldNames.forEach(bld=>{
        const floors = Object.keys(bldMap[bld]).map(Number).sort((a,b)=>b-a);
        const bldStart = r1;
        floors.forEach(f=>{
          const entries = bldMap[bld][f];
          const fStart = r1;
          entries.forEach(({cat,loc,prog})=>{
            const items = loc.items||[];
            const done = items.filter(it=>it.result).length;
            const bad  = items.filter(it=>it.result==='불량').length;
            const st = prog.status;
            const col = COLORS[st] || COLORS['미점검'];
            const vals = [bld, fLabel(f), loc.name, cat.name, st, `${done}/${items.length}`, bad||'', (loc.photos||[]).length||''];
            vals.forEach((v,i)=>{
              const c = ws1.getCell(r1, i+1);
              c.value = v;
              c.alignment = i===2||i===3 ? {vertical:'middle',wrapText:true} : center;
              c.border = {top:{style:'thin',color:{argb:'FFE3E6EE'}},bottom:{style:'thin',color:{argb:'FFE3E6EE'}},left:{style:'thin',color:{argb:'FFE3E6EE'}},right:{style:'thin',color:{argb:'FFE3E6EE'}}};
              if(i===4){ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:col.fill}}; c.font={bold:true,color:{argb:col.font},size:10}; }
            });
            r1++;
          });
          if(r1-1 > fStart) ws1.mergeCells(fStart,2,r1-1,2);
          ws1.getCell(fStart,2).alignment = center;
          ws1.getCell(fStart,2).font = {bold:true,size:11};
        });
        if(r1-1 > bldStart) ws1.mergeCells(bldStart,1,r1-1,1);
        ws1.getCell(bldStart,1).alignment = center;
        ws1.getCell(bldStart,1).font = {bold:true,size:11,color:{argb:'FF128C86'}};
        r1++; // 건물 사이 빈 줄
      });

      /* ── 시트 2: 입체 뷰 (층 블록 다이어그램) ── */
      const ws2 = wb.addWorksheet('입체 뷰', {views:[{showGridLines:false}]});

      t2.font = {bold:true,size:13,color:{argb:NAVY}};

      bldNames.filter(b=>!b.startsWith("(층")).forEach((bld,bi)=>{

        ws2.getColumn(col+1).width = 13;

        ws2.mergeCells(2,col,2,col+1);

        bc.font = {bold:true,color:{argb:WHITE},size:11};
        bc.alignment = center; bc.border = borderAll;
        ws2.getRow(2).height = 22;

        // 지붕
        ws2.mergeCells(3,col,3,col+1);

        rc.value = '▓▓ 옥탑 ▓▓';
        rc.fill = {type:'pattern',pattern:'solid',fgColor:{argb:ROOF}};
        rc.font = {color:{argb:'FF8FA0C4'},size:9};
        rc.alignment = center; rc.border = borderAll;
        ws2.getRow(3).height = 14;

        // 층 블록 (위→아래)
        floors.forEach((f,fi)=>{
          const entries = bldMap[bld][f];
          const st = floorSt(entries);
          const badN = entries.filter(e=>e.prog.status==='불량포함').length;
          const doneN = entries.filter(e=>e.prog.status==='완료'||e.prog.status==='불량포함').length;
          const row = 4+fi;
          const c1 = ws2.getCell(row,col), c2 = ws2.getCell(row,col+1);
          c1.value = fLabel(f);
          c2.value = badN ? `⚠ 부적합 ${badN}` : `${doneN}/${entries.length} 완료`;
          [c1,c2].forEach(c=>{
            c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:COLORS[st].fill}};
            c.font = {bold:true,color:{argb:WHITE},size:10};
            c.alignment = center; c.border = borderAll;
          });
          ws2.getRow(row).height = 24;
        });

        // 잔디
        const gr = 4+floors.length;
        ws2.mergeCells(gr,col,gr,col+1);
        const gc = ws2.getCell(gr,col);
        gc.fill = {type:'pattern',pattern:'solid',fgColor:{argb:GRASS}};
        gc.border = borderAll;
        ws2.getRow(gr).height = 10;
      });

      // 범례
      const legendRow = 6 + Math.max(...bldNames.filter(b=>!b.startsWith("(층")).map(b=>Object.keys(bldMap[b]).length), 0);
      Object.keys(COLORS).forEach((k,i)=>{
        const c = ws2.getCell(legendRow+i, 1);
        c.value = k;
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:COLORS[k].fill}};
        c.font = {bold:true,color:{argb:WHITE},size:10};
        c.alignment = center; c.border = borderAll;
      });

      /* ── 시트 3: 설비별 목록 ── */
      const ws3 = wb.addWorksheet('설비별 목록');
      ws3.mergeCells(1,1,1,5);
      const t3 = ws3.getCell(1,1);
      t3.value = `📋 ${current.siteName} 설비별 위치 목록 (${current.date||''})`;
      t3.font = {bold:true,size:13,color:{argb:NAVY}};
      ws3.getRow(1).height = 24;
      [34,12,12,8,8].forEach((w,i)=>ws3.getColumn(i+1).width=w);

      // 설비별 그룹
      const catGroups = {};
      Object.values(locMap).forEach(({cat,loc,prog})=>{
        if(!catGroups[cat.id]) catGroups[cat.id]={cat, locs:[]};
        catGroups[cat.id].locs.push({loc,prog});
      });

      let r3 = 3;
      Object.values(catGroups).forEach(({cat,locs})=>{
        const catDone = locs.filter(l=>l.prog.status==='완료'||l.prog.status==='불량포함').length;
        const catPct = Math.round(catDone/locs.length*100);
        ws3.mergeCells(r3,1,r3,5);
        const hc = ws3.getCell(r3,1);
        hc.value = `${cat.name}  (${locs.length}개 위치 · ${catPct}%)`;
        hc.fill = {type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};
        hc.font = {bold:true,color:{argb:WHITE},size:11};
        hc.alignment = {vertical:'middle'};
        ws3.getRow(r3).height = 20;
        r3++;
        headerRow(ws3, r3, ['점검 위치','상태','항목 진행','불량','사진']);
        // headerRow가 열 너비 인자 없이 호출되므로 스타일만 적용됨
        r3++;
        locs.forEach(({loc,prog})=>{
          const items = loc.items||[];
          const done = items.filter(it=>it.result).length;
          const bad  = items.filter(it=>it.result==='불량').length;
          const col = COLORS[prog.status] || COLORS['미점검'];
          const vals = [loc.name, prog.status, `${done}/${items.length}`, bad||'', (loc.photos||[]).length||''];
          vals.forEach((v,i)=>{
            const c = ws3.getCell(r3, i+1);
            c.value = v;
            c.alignment = i===0 ? {vertical:'middle',wrapText:true} : center;
            c.border = {top:{style:'thin',color:{argb:'FFE3E6EE'}},bottom:{style:'thin',color:{argb:'FFE3E6EE'}},left:{style:'thin',color:{argb:'FFE3E6EE'}},right:{style:'thin',color:{argb:'FFE3E6EE'}}};
            if(i===1){ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:col.fill}}; c.font={bold:true,color:{argb:col.font},size:10}; }
          });
          r3++;
        });
        r3++; // 설비 사이 빈 줄
      });

      /* ── 다운로드 ── */
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      await downloadFile(blob, `건물구조_${current.siteName}_${current.date||todayStr()}.xlsx`);
      showToast('엑셀 파일이 저장됩니다 (3개 시트)');
    }catch(e){
      alert('엑셀 생성 오류: ' + e.message);
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = '📊 엑셀'; }
    }
  }

  /* ============================================================
     📈 대시보드 엑셀 — 측정값 그래프 (canvas로 차트 그려 이미지 삽입)
     시트: ①대시보드(차트4종) ②측정값 데이터 ③적합율 데이터
  ============================================================ */
  // ── canvas 차트 헬퍼 (외부 라이브러리 없이 직접 렌더) ──
  function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
  const CH = {
    navy:'#1A2540', grid:'#E3E6EE', txt:'#333', muted:'#7A8299',
    good:'#22B573', bad:'#E5484D', warn:'#E8A317', blue:'#2563EB', teal:'#1ABDB5', red:'#E60012'
  };
  function drawAxes(ctx, x0,y0,w,h, title){
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
    ctx.fillStyle=CH.navy; ctx.font='bold 20px sans-serif'; ctx.textAlign='left';
    ctx.fillText(title, 20, 30);
    ctx.strokeStyle=CH.muted; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0,y0-h); ctx.moveTo(x0,y0); ctx.lineTo(x0+w,y0); ctx.stroke();
  }
  // 그룹 세로 막대 (건물별·층별 접지저항 등)
  function barChart(title, labels, series, opt){
    opt=opt||{};
    const W=760, H=420, x0=70, y0=350, plotW=W-x0-30, plotH=260;
    const c=makeCanvas(W,H), ctx=c.getContext('2d');
    drawAxes(ctx,x0,y0,plotW,title? title:'',title);
    const allVals=series.flatMap(s=>s.data).filter(v=>v!=null&&!isNaN(v));
    let dataMax=allVals.length?Math.max(...allVals):1;
    let dataMin=allVals.length?Math.min(...allVals):0;
    if(opt.threshold!=null){ dataMax=Math.max(dataMax,opt.threshold); dataMin=Math.min(dataMin,opt.threshold); }
    // 범위: 음수 데이터가 있으면 아래로도 확장, 아니면 0 기준
    let maxV=opt.max!=null?opt.max:(dataMax>0?dataMax*1.15:dataMax*0.85);
    let minV=opt.min!=null?opt.min:(dataMin<0?dataMin*1.15:0);
    if(maxV===minV){ maxV+=1; minV-=1; }
    const span=maxV-minV||1;
    const zeroY=y0 - plotH*(0-minV)/span; // 값 0의 y좌표 (막대 기준선)
    const baseY=(minV<0&&maxV>0)? zeroY : y0; // 음수 있으면 0선, 아니면 축 바닥
    // y 눈금
    ctx.fillStyle=CH.muted; ctx.font='12px sans-serif'; ctx.textAlign='right';
    for(let i=0;i<=4;i++){ const v=minV+span*i/4, yy=y0-plotH*i/4;
      ctx.strokeStyle=CH.grid; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0+plotW,yy); ctx.stroke();
      ctx.fillText(v.toFixed(opt.dec!=null?opt.dec:1), x0-6, yy+4); }
    // 기준선
    if(opt.threshold!=null){ const ty=y0-plotH*(opt.threshold-minV)/span;
      ctx.strokeStyle=CH.bad; ctx.lineWidth=2; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(x0,ty); ctx.lineTo(x0+plotW,ty); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=CH.bad; ctx.textAlign='left'; ctx.font='bold 12px sans-serif';
      ctx.fillText('기준 '+opt.threshold+(opt.unit||''), x0+plotW-100, ty-5); }
    const nG=labels.length, nS=series.length;
    const gW=plotW/nG, bW=Math.min(38, gW/(nS+1));
    labels.forEach((lb,gi)=>{
      series.forEach((s,si)=>{
        const v=s.data[gi]; if(v==null||isNaN(v)) return;
        const bx=x0+gi*gW+(gW-bW*nS)/2+si*bW;
        const vy=y0-plotH*(v-minV)/span;
        const over=opt.threshold!=null && (opt.lowerBad? v<opt.threshold : v>opt.threshold);
        ctx.fillStyle=over?CH.bad:(s.color||CH.teal);
        const top=Math.min(vy,baseY), hh=Math.abs(baseY-vy);
        ctx.fillRect(bx, top, bW-3, hh||1);
        ctx.fillStyle=CH.txt; ctx.font='10px sans-serif'; ctx.textAlign='center';
        ctx.fillText(v.toFixed(opt.dec!=null?opt.dec:1), bx+(bW-3)/2, vy-4);
      });
      ctx.fillStyle=CH.muted; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.save(); ctx.translate(x0+gi*gW+gW/2, y0+14);
      const lbl=String(lb); if(lbl.length>6){ctx.rotate(-0.5);} ctx.fillText(lbl,0,4); ctx.restore();
    });
    if(nS>1){ let lx=x0; series.forEach(s=>{ ctx.fillStyle=s.color||CH.teal; ctx.fillRect(lx,y0+30,12,12);
      ctx.fillStyle=CH.txt; ctx.font='12px sans-serif'; ctx.textAlign='left'; ctx.fillText(s.name,lx+16,y0+40); lx+=ctx.measureText(s.name).width+50; }); }
    return c;
  }
  // 100% 누적 가로 막대 (설비별 적합/부적합)
  function stackChart(title, rows){ // rows: [{label, good, bad, na}]
    const W=760, H=Math.max(300, 90+rows.length*46), x0=180, plotW=W-x0-90;
    const c=makeCanvas(W,H), ctx=c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=CH.navy; ctx.font='bold 20px sans-serif'; ctx.textAlign='left'; ctx.fillText(title,20,30);
    rows.forEach((r,i)=>{
      const y=64+i*46, tot=(r.good+r.bad+r.na)||1;
      ctx.fillStyle=CH.txt; ctx.font='13px sans-serif'; ctx.textAlign='right';
      ctx.fillText(r.label.length>13?r.label.slice(0,12)+'…':r.label, x0-10, y+18);
      let x=x0;
      [['good',CH.good],['bad',CH.bad],['na','#C4CADB']].forEach(([k,col])=>{
        const w=plotW*r[k]/tot; if(w<=0) return;
        ctx.fillStyle=col; ctx.fillRect(x,y,w,26);
        if(w>26){ ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText(r[k],x+w/2,y+18); }
        x+=w;
      });
      const pct=Math.round(r.good/tot*100);
      ctx.fillStyle=pct>=90?CH.good:pct>=70?CH.warn:CH.bad; ctx.font='bold 13px sans-serif'; ctx.textAlign='left';
      ctx.fillText(pct+'%', x+8, y+18);
    });
    // 범례
    let lx=x0; [['적합',CH.good],['부적합',CH.bad],['미점검','#C4CADB']].forEach(([n,col])=>{
      ctx.fillStyle=col; ctx.fillRect(lx,H-24,12,12); ctx.fillStyle=CH.txt; ctx.font='12px sans-serif'; ctx.textAlign='left'; ctx.fillText(n,lx+16,H-14); lx+=80; });
    return c;
  }
  // 도넛 (전체 진행률·통계)
  function donutChart(title, segs, centerText){ // segs:[{label,val,color}]
    const W=760,H=380,cx=230,cy=210,R=120,r=68;
    const c=makeCanvas(W,H), ctx=c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=CH.navy; ctx.font='bold 20px sans-serif'; ctx.textAlign='left'; ctx.fillText(title,20,30);
    const tot=segs.reduce((s,x)=>s+x.val,0)||1; let a=-Math.PI/2;
    segs.forEach(s=>{ const ang=Math.PI*2*s.val/tot;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a,a+ang); ctx.closePath(); ctx.fillStyle=s.color; ctx.fill();
      a+=ang; });
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.fillStyle=CH.navy; ctx.font='bold 34px sans-serif'; ctx.textAlign='center'; ctx.fillText(centerText,cx,cy+6);
    ctx.font='13px sans-serif'; ctx.fillStyle=CH.muted; ctx.fillText('완료율',cx,cy+28);
    // 범례
    let ly=90; segs.forEach(s=>{ ctx.fillStyle=s.color; ctx.fillRect(430,ly,16,16);
      ctx.fillStyle=CH.txt; ctx.font='14px sans-serif'; ctx.textAlign='left';
      ctx.fillText(`${s.label}  ${s.val}건 (${Math.round(s.val/tot*100)}%)`,454,ly+13); ly+=34; });
    return c;
  }
  function canvasToBuf(c){
    const b64=c.toDataURL('image/png').split(',')[1];
    const bin=atob(b64), arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return arr;
  }

  async function exportDashboardExcel(){
    if(!current) return;
    if(typeof ExcelJS === 'undefined'){ alert('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 새로고침해 주세요.'); return; }
    const btn = document.getElementById('struct-dash-btn');
    if(btn){ btn.disabled=true; btn.textContent='생성 중…'; }
    try{
      // ── 측정값 수집 ──
      // rows: {bld, floor, floorLabel, loc, catName, itemName, unit, value, std, result}
      const rows=[];
      current.categories.forEach(cat=>{
        cat.locations.forEach(loc=>{
          const bld = extractBuilding(loc.name)||'(건물 미지정)';
          const f = extractFloor(loc.name);
          const fLabel = f===null?'-':f===999?'옥상':f>0?`${f}층`:`B${Math.abs(f)}층`;
          (loc.items||[]).forEach(it=>{
            const fds=(Array.isArray(it.fields)&&it.fields.length)?it.fields:null;
            if(fds){   // 온·습도, 열화상 등 다중 측정값 → 항목별로 분리 집계
              const vv=it.vals||{};
              fds.forEach(fd=>{
                const raw=String(vv[fd.k]==null?'':vv[fd.k]).trim();
                if(!raw) return;
                const num=parseFloat(raw.replace(/[^0-9.\-]/g,''));
                rows.push({bld,floor:f,floorLabel:fLabel,loc:loc.name,catName:cat.name,itemName:it.name+' — '+fd.k,unit:fd.u||'',value:isNaN(num)?null:num,raw:raw,std:it.std||'',result:it.result||''});
              });
              return;
            }
            if(it.hasValue && it.value!=null && String(it.value).trim()!==''){
              const num=parseFloat(String(it.value).replace(/[^0-9.\-]/g,''));
              rows.push({bld,floor:f,floorLabel:fLabel,loc:loc.name,catName:cat.name,itemName:it.name,unit:it.unit||'',value:isNaN(num)?null:num,raw:it.value,std:it.std||'',result:it.result||''});
            }
          });
        });
      });

      const wb=new ExcelJS.Workbook(); wb.creator='kt MOS북부';
      const ws=wb.addWorksheet('대시보드',{views:[{showGridLines:false}]});
      ws.getColumn(1).width=3;
      ws.mergeCells(1,2,1,12);
      const tt=ws.getCell(1,2); tt.value=`📈 ${current.siteName} 측정 대시보드 (${current.date||todayStr()})`;
      tt.font={bold:true,size:16,color:{argb:'FF1A2540'}}; ws.getRow(1).height=28;

      let anchorRow=2;
      const addChart=async (canvas)=>{
        const buf=canvasToBuf(canvas);
        const imgId=wb.addImage({buffer:buf, extension:'png'});
        const wCols=canvas.width/64, hRows=canvas.height/20;
        ws.addImage(imgId,{ tl:{col:1,row:anchorRow}, ext:{width:canvas.width, height:canvas.height} });
        anchorRow += Math.ceil(hRows)+2;
      };

      // ① 건물별·층별 접지저항 비교
      const groundRows=rows.filter(r=>/접지저항/.test(r.itemName) && r.value!=null && r.floor!==null);
      if(groundRows.length){
        const blds=[...new Set(groundRows.map(r=>r.bld))];
        const floors=[...new Set(groundRows.map(r=>r.floor))].sort((a,b)=>a-b);
        const fLabels=floors.map(f=>f===999?'옥상':f>0?`${f}층`:`B${Math.abs(f)}층`);
        const palette=[CH.teal,CH.blue,CH.warn,CH.good,'#9333EA','#DB2777'];
        const series=blds.map((b,i)=>({name:b,color:palette[i%palette.length],
          data:floors.map(f=>{ const m=groundRows.filter(r=>r.bld===b&&r.floor===f); return m.length? m.reduce((s,x)=>s+x.value,0)/m.length : null; })}));
        await addChart(barChart('① 건물별·층별 접지저항 (Ω)', fLabels, series, {threshold:10, unit:'Ω', dec:1}));
      }

      // ② 층별 측정값 분포 (항목별 기준선) — 가장 데이터 많은 측정항목 자동 선택
      const byItem={}; rows.forEach(r=>{ if(r.value!=null&&r.floor!==null){ (byItem[r.itemName]=byItem[r.itemName]||[]).push(r); }});
      const topItem=Object.keys(byItem).filter(k=>!/접지저항/.test(k)).sort((a,b)=>byItem[b].length-byItem[a].length)[0];
      if(topItem && byItem[topItem].length>=2){
        const d=byItem[topItem];
        const floors=[...new Set(d.map(r=>r.floor))].sort((a,b)=>a-b);
        const fLabels=floors.map(f=>f===999?'옥상':f>0?`${f}층`:`B${Math.abs(f)}층`);
        const unit=d[0].unit;
        // 기준값 파싱 (예: "10Ω 이하", "-70dBm 이상")
        let thr=null, lowerBad=false; const sm=(d[0].std||'').match(/(-?\d+\.?\d*)/);
        if(sm){ thr=parseFloat(sm[1]); lowerBad=/이상/.test(d[0].std); }
        const series=[{name:topItem.slice(0,14),color:CH.blue,
          data:floors.map(f=>{ const m=d.filter(r=>r.floor===f); return m.length? m.reduce((s,x)=>s+x.value,0)/m.length : null; })}];
        await addChart(barChart(`② 층별 측정값 분포 — ${topItem.slice(0,18)} (${unit})`, fLabels, series, {threshold:thr, unit, lowerBad, dec:1}));
      }

      // ③ 설비 종류별 적합/부적합 비율
      const catStat=current.categories.map(cat=>{
        let good=0,bad=0,na=0;
        cat.locations.forEach(loc=>(loc.items||[]).forEach(it=>{
          if(it.result==='양호'||it.result==='적합'||it.result==='정상') good++;
          else if(it.result==='불량') bad++;
          else na++;
        }));
        return {label:cat.name, good, bad, na};
      }).filter(r=>r.good+r.bad+r.na>0);
      if(catStat.length){ await addChart(stackChart('③ 설비 종류별 적합 / 부적합', catStat)); }

      // ④ 전체 진행률·통계 도넛
      let tGood=0,tBad=0,tNa=0;
      current.categories.forEach(cat=>cat.locations.forEach(loc=>(loc.items||[]).forEach(it=>{
        if(it.result==='양호'||it.result==='적합'||it.result==='정상') tGood++;
        else if(it.result==='불량') tBad++; else tNa++;
      })));
      const totItems=tGood+tBad+tNa||1;
      const pct=Math.round((tGood+tBad)/totItems*100);
      await addChart(donutChart('④ 전체 점검 통계', [
        {label:'적합',val:tGood,color:CH.good},{label:'부적합',val:tBad,color:CH.bad},{label:'미점검',val:tNa,color:'#C4CADB'}
      ], pct+'%'));

      /* ── 시트2: 측정값 데이터 ── */
      const wd=wb.addWorksheet('측정값 데이터');
      const hdr=['건물','층','점검 위치','설비','측정 항목','측정값','단위','기준','판정'];
      const widths=[16,8,26,18,30,12,8,18,10];
      hdr.forEach((h,i)=>{ const c=wd.getCell(1,i+1); c.value=h; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A2540'}};
        c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.alignment={horizontal:'center',vertical:'middle'}; wd.getColumn(i+1).width=widths[i]; });
      wd.getRow(1).height=20;
      rows.forEach((r,ri)=>{
        const vals=[r.bld,r.floorLabel,r.loc,r.catName,r.itemName,r.raw,r.unit,r.std,r.result||'-'];
        vals.forEach((v,i)=>{ const c=wd.getCell(ri+2,i+1); c.value=v;
          c.alignment=(i>=2&&i<=4)?{wrapText:true,vertical:'middle'}:{horizontal:'center',vertical:'middle'};
          c.border={top:{style:'thin',color:{argb:'FFE3E6EE'}},bottom:{style:'thin',color:{argb:'FFE3E6EE'}},left:{style:'thin',color:{argb:'FFE3E6EE'}},right:{style:'thin',color:{argb:'FFE3E6EE'}}};
          if(i===8 && r.result==='불량'){ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF2696E'}}; c.font={bold:true,color:{argb:'FFFFFFFF'}}; }
        });
      });
      if(rows.length===0) wd.getCell(2,1).value='측정값이 입력된 항목이 없습니다.';

      /* ── 시트3: 설비별 적합율 ── */
      const wr=wb.addWorksheet('설비별 적합율');
      ['설비','적합','부적합','미점검','적합율'].forEach((h,i)=>{ const c=wr.getCell(1,i+1); c.value=h;
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A2540'}}; c.font={bold:true,color:{argb:'FFFFFFFF'}};
        c.alignment={horizontal:'center'}; wr.getColumn(i+1).width=i===0?26:11; });
      catStat.forEach((r,ri)=>{ const tot=r.good+r.bad+r.na||1; const p=Math.round(r.good/tot*100);
        [r.label,r.good,r.bad,r.na,p+'%'].forEach((v,i)=>{ const c=wr.getCell(ri+2,i+1); c.value=v;
          c.alignment={horizontal:i===0?'left':'center'}; });
      });

      const buf=await wb.xlsx.writeBuffer();
      const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      await downloadFile(blob, `측정대시보드_${current.siteName}_${current.date||todayStr()}.xlsx`);
      showToast('대시보드 엑셀이 저장됩니다 (차트 4종 + 데이터)');
    }catch(e){
      alert('대시보드 생성 오류: '+e.message);
    }finally{
      if(btn){ btn.disabled=false; btn.textContent='📈 대시보드'; }
    }
  }

  // ══════════ 설비 카테고리 그룹 (통신/방송/정보/기타) ══════════
  const CAT_GROUPS = [
    { key:"통신", label:"통신 설비",  color:"#155EEF", bg:"#EEF3FF", ids:["c1","c2","c3","c4","c5","c6","c7","c8"] },
    { key:"방송", label:"방송 설비",  color:"#7C3AED", bg:"#F3EEFF", ids:["c9"] },
    { key:"정보", label:"정보 설비",  color:"#1A8754", bg:"#E9F7EF", ids:["c10","c11","c12","c13","c14","c15","c16","c17","c18","c19","c20","c21","c22","c23","c24","c25","c26","c27","c28","c29","c30","c31","c32"] },
    { key:"기타", label:"기타 설비",  color:"#D97706", bg:"#FEF3E2", ids:["c33","c34"] },
  ];
  function groupOfCat(catId){
    const g = CAT_GROUPS.find(g=> g.ids.includes(catId));
    return g || CAT_GROUPS[CAT_GROUPS.length-1];
  }
  // 아코디언 그룹 키 (미분류=사용자 추가 설비는 "추가" 그룹)
  function groupKeyOfCat(catId){
    const g = CAT_GROUPS.find(g=> g.ids.includes(catId));
    return g ? g.key : "추가";
  }
  // 설비들을 그룹 헤더와 함께 cat-list 에 붙인다. (평평한 목록 → 접이식 아코디언)
  function appendCatsGrouped(catList, cats){
    // 그룹 하나를 [클릭 토글 헤더 + ▽화살표 + 접이식 body] 로 붙이는 헬퍼
    const addGroup = (key, label, color, bg, borderCol, groupCats, extraBadgeHtml="")=>{
      const isOpen = openGroupKeys.has(key);
      const hdr = document.createElement("div");
      hdr.className = "cat-group-head" + (isOpen ? " open" : "");
      hdr.style.cssText = `background:${bg};border-left:4px solid ${borderCol};`;
      hdr.innerHTML =
        `<span class="cgh-label" style="color:${color};">${label}</span>`+
        `<span class="cgh-count">${groupCats.length}종</span>`+
        extraBadgeHtml+
        `<span class="cgh-arrow">▽</span>`;
      const body = document.createElement("div");
      body.className = "cat-group-body" + (isOpen ? " open" : "");
      const grid = document.createElement("div");
      grid.className = "cat-grid";
      groupCats.forEach(c=> grid.appendChild(buildCatTile(c)));
      body.appendChild(grid);
      hdr.onclick = ()=>{
        const nowOpen = !openGroupKeys.has(key);
        if(nowOpen) openGroupKeys.add(key); else openGroupKeys.delete(key);
        hdr.classList.toggle("open", nowOpen);
        body.classList.toggle("open", nowOpen);
      };
      catList.appendChild(hdr);
      catList.appendChild(body);
    };
    // 현재 점검에 실제로 있는 설비만, CAT_GROUPS 순서(통신/방송/정보/기타)로 묶는다
    CAT_GROUPS.forEach(g=>{
      const inThis = cats.filter(c=> g.ids.includes(c.id));
      if(!inThis.length) return;
      // 그룹 전체 양호(적합) 여부
      const allItems = inThis.reduce((arr,c)=> arr.concat(c.locations.reduce((a,l)=>a.concat(l.items||[]),[])), []);
      const allGood = allItems.length>0 && allItems.every(it=> it.result==="양호");
      addGroup(g.key, g.label, g.color, g.bg, g.color, inThis,
        allGood ? `<span class="cgh-allgood">모두 적합</span>` : "");
    });
    // 그룹에 없는(사용자 추가) 설비는 맨 끝에
    const extra = cats.filter(c=> !CAT_GROUPS.some(g=> g.ids.includes(c.id)));
    if(extra.length){
      addGroup("추가", "추가 설비", "#4B5563", "#F1F3F6", "#9AA3B5", extra);
    }
  }

  // 펼친 그룹 안의 설비 1개 = 아이콘 타일(진입점). 탭하면 점검 항목 화면으로 드릴인.
  function buildCatTile(cat){
    const cp = categoryProgress(cat);
    const progCls = cp.total===0 ? "" : (cp.done===0 ? "" : (cp.done===cp.total ? "done" : "partial"));
    const photoCount = cat.locations.reduce((s,l)=> s+(l.photos||[]).length, 0);
    const badCount = cat.locations.reduce((s,l)=> s+((l.items||[]).filter(it=>it.result==="불량").length), 0);
    const tile = document.createElement("div");
    tile.className = "cat-tile";
    tile.dataset.catid = cat.id;
    const badges =
      (photoCount>0?`<span class="ct-badge photo">📷${photoCount}</span>`:"")+
      (badCount>0?`<span class="ct-badge bad">${badCount}</span>`:"");
    tile.innerHTML =
      (badges?`<div class="cat-tile-badges">${badges}</div>`:"")+
      (EQUIP_ICONS[cat.id]
        ? `<img class="cat-tile-ic" src="${EQUIP_ICONS[cat.id]}" alt="">`
        : `<div class="cat-tile-ic ph">🔧</div>`)+
      `<div class="cat-tile-name">${escapeHtml(cat.name)}</div>`+
      `<div class="cat-tile-sub">${cat.locations.length}개소</div>`+
      `<div class="cat-tile-prog ${progCls}">${cp.done}/${cp.total}<span class="tchev">▼</span></div>`;
    tile.onclick = ()=>{
      activeCatId = cat.id;
      openCategoryIds.add(cat.id);
      renderDetail();
      window.scrollTo({top:0, behavior:"auto"});
    };
    return tile;
  }

  // 드릴인 화면: 뒤로가기 + 큰 아이콘 헤더 + 해당 설비 점검 항목 본문(buildCategoryBody 재사용)
  function buildDrillInView(cat){
    const cp = categoryProgress(cat);
    const progCls = cp.total===0 ? "" : (cp.done===0 ? "" : (cp.done===cp.total ? "done" : "partial"));
    const wrap = document.createElement("div");
    wrap.className = "cat drillin open";
    wrap.dataset.catid = cat.id;

    const back = document.createElement("div");
    back.className = "drillin-back";
    back.innerHTML = `<span class="di-arw">‹</span> 설비 목록`;
    back.onclick = ()=>{ activeCatId=null; renderDetail(); window.scrollTo({top:0, behavior:"auto"}); };
    wrap.appendChild(back);

    const hd = document.createElement("div");
    hd.className = "drillin-head";
    hd.innerHTML =
      (EQUIP_ICONS[cat.id]?`<img class="di-ic" src="${EQUIP_ICONS[cat.id]}" alt="">`:"")+
      `<div class="di-title">${escapeHtml(cat.name)}<span class="di-sub">${cat.locations.length}개소</span></div>`+
      `<span class="cat-badge ${progCls}">${cp.done}/${cp.total}</span>`;
    wrap.appendChild(hd);

    const body = document.createElement("div");
    body.className = "cat-body";
    buildCategoryBody(cat, body);
    wrap.appendChild(body);
    return wrap;
  }

  function buildCategoryEl(cat){
    const wrap = document.createElement("div");
    wrap.className = "cat" + (openCategoryIds.has(cat.id) ? " open" : "");
    wrap.dataset.catid = cat.id;
    const cp = categoryProgress(cat);
    const badgeClass = cp.total===0 ? "" : (cp.done===0 ? "" : (cp.done===cp.total ? "done" : "partial"));
    const photoCount = cat.locations.reduce((s,l)=> s+(l.photos||[]).length, 0);
    const badPhotoCount = cat.locations.reduce((s,l)=> s+(l.badPhotos||[]).length, 0);

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `
      <div class="cat-head-left">
        <div class="cat-name">${EQUIP_ICONS[cat.id]?`<img class="cat-ic" src="${EQUIP_ICONS[cat.id]}" alt="">`:""}${escapeHtml(cat.name)} <span style="font-size:11px;color:var(--muted);font-weight:600;">${cat.locations.length}개소</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        ${photoCount>0?`<span class="photo-cnt" style="font-size:11px;color:var(--good);font-weight:700;">📷${photoCount}${(()=>{const sc=cat.locations.reduce((a,l)=>a+selCount(l),0);return sc?"·✅"+sc:"";})()}</span>`:""}
        ${badPhotoCount>0?`<span class="cat-bad-cnt" style="font-size:11px;color:#fff;background:#E5484D;font-weight:800;border-radius:6px;padding:1px 6px;">⚠️${badPhotoCount}</span>`:""}
        <span class="cat-badge ${badgeClass}">${cp.done}/${cp.total}</span>
        <span class="cat-chev">▾</span>
      </div>
    `;

    head.onclick = (ev)=>{
      if(openCategoryIds.has(cat.id)) openCategoryIds.delete(cat.id);
      else openCategoryIds.add(cat.id);
      wrap.classList.toggle("open");
    };
    wrap.appendChild(head);

    const body = document.createElement("div");
    body.className = "cat-body";
    buildCategoryBody(cat, body);
    wrap.appendChild(body);

    return wrap;
  }

  /* 위치 카드 1개 (A안)
     기본: 위치명 · 📷n·✅m · 양호 n/n · 불량 n/n (점 표시)
     활성: + 전체 양호/불량 일괄 버튼 + 사진 선택 안내  */
  function locStats(loc){
    const items = loc.items||[];
    const total = items.length;
    const good  = items.filter(it=>it.result==="양호").length;
    const bad   = items.filter(it=>it.result==="불량").length;
    return {total, good, bad};
  }
  function dotsHtml(n, total, cls){
    const cap = Math.min(total, 14);
    let h = "";
    for(let i=0;i<cap;i++) h += `<span class="loc-dot${i<Math.min(n,cap)?" "+cls:""}"></span>`;
    if(total > cap) h += `<span style="font-size:10px;color:var(--muted);margin-left:2px;">+${total-cap}</span>`;
    return h;
  }
  /* 가로 슬라이더: 마우스 드래그 + 휠 스크롤 지원
     (브라우저는 마우스 드래그로 overflow 컨테이너를 스크롤해주지 않는다.
      터치는 브라우저 기본 스크롤이 이미 동작하므로 마우스만 처리한다.) */
  /* 카테고리 카드 DOM (catEls 는 refreshCatPhotoCount 지역변수라 여기서 쓸 수 없다) */
  function catElOf(cat){
    return document.querySelector('.cat[data-catid="'+cat.id+'"]');
  }
  /* 현재 카테고리의 (새로 그려진) 슬라이더 DOM */
  function sliderOf(cat){
    const el = catElOf(cat);
    return el ? el.querySelector(".loc-slider") : null;
  }
  /* 하단 리스트 → 상단 슬라이더의 해당 카드로 이동 */
  function scrollSliderTo(cat, locId){
    requestAnimationFrame(()=>{
      const sl = sliderOf(cat);
      if(!sl) return;
      const c = sl.querySelector(`.loc-card[data-locid="${locId}"]`);
      if(c) sl.scrollTo({left: Math.max(0, c.offsetLeft - sl.offsetLeft), behavior:"smooth"});
    });
  }
  /* 상단 슬라이더 → 멈춘 카드에 맞춰 하단 리스트 하이라이트만 갱신
     (주의: 여기서 rerenderCategoryBody 를 부르면 슬라이더가 새로 그려지면서
      scrollLeft 가 0으로 리셋돼 "밀어도 안 움직이는" 현상이 생긴다.
      따라서 재렌더 없이 클래스 토글만 한다.) */
  function bindSliderSync(cat, sl){
    let t = null;
    sl.addEventListener("scroll", ()=>{
      clearTimeout(t);
      t = setTimeout(()=>{
        const cards = Array.from(sl.querySelectorAll(".loc-card"));
        if(!cards.length) return;
        const x = sl.scrollLeft;
        let best = cards[0], bd = Infinity;
        cards.forEach(c=>{
          const d = Math.abs((c.offsetLeft - sl.offsetLeft) - x);
          if(d < bd){ bd = d; best = c; }
        });
        const id = best.dataset.locid;
        if(!id) return;
        // 재렌더 없이 "지금 보고 있는 위치" 표시만 하단 리스트에 반영
        const root = sl.closest(".cat") || document;
        root.querySelectorAll(".loc-row").forEach(r=> r.classList.toggle("viewing", r.dataset.locid===id));
        const row = root.querySelector(`.loc-row[data-locid="${id}"]`);
        if(row) row.scrollIntoView({block:"nearest"});
      }, 120);
    });
  }


  function enableDragScroll(el){
    if(el.__dragBound) return;
    el.__dragBound = true;
    let down=false, sx=0, sl=0, moved=0;
    el.addEventListener("pointerdown", (e)=>{
      if(e.pointerType !== "mouse" || e.button !== 0) return;
      down=true; moved=0; sx=e.clientX; sl=el.scrollLeft;
    });
    el.addEventListener("pointermove", (e)=>{
      if(!down) return;
      const d = e.clientX - sx;
      if(!moved && Math.abs(d) > 4){ moved = 1; el.classList.add("dragging"); }
      if(moved){ el.scrollLeft = sl - d; e.preventDefault(); }
    });
    const end = ()=>{
      if(!down) return;
      down=false;
      if(moved){ setTimeout(()=> el.classList.remove("dragging"), 0); }
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("pointerleave", end);
    // 드래그 직후의 click 이 카드 버튼을 누르지 않도록 차단
    el.addEventListener("click", (e)=>{
      if(moved){ e.stopPropagation(); e.preventDefault(); moved=0; }
    }, true);
    // 세로 휠 → 가로 스크롤
    el.addEventListener("wheel", (e)=>{
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ el.scrollLeft += e.deltaY; e.preventDefault(); }
    }, {passive:false});
  }

  function buildLocCard(cat, loc, isActive){
    const st = locStats(loc);
    const hasBad = st.bad > 0;
    const pCnt = (loc.photos||[]).length;
    const sCnt = selCount(loc);
    const allGood = st.total>0 && st.good===st.total;
    const allBad  = st.total>0 && st.bad===st.total;
    const card = document.createElement("div");
    card.className = "loc-card" + (isActive?" active":"") + (hasBad?" bad":"");
    card.dataset.locid = loc.id;
    card.innerHTML =
      `<div class="loc-card-top">`+
        `<span class="loc-card-name">${hasBad?"⚠️ ":""}${escapeHtml(loc.name||"위치 입력")}</span>`+
        (pCnt?`<span class="loc-card-pic">📷${pCnt}</span>`:"")+
        (sCnt?`<span class="loc-card-sel">✅${sCnt}</span>`:"")+
      `</div>`+
      `<div class="loc-seg">`+
        `<button class="g${allGood?" on":""}" data-set="양호">적합</button>`+
        `<button class="b${allBad?" on":""}" data-set="불량">부적합</button>`+
      `</div>`+
      `<div class="loc-stat g">적합 ${st.good}/${st.total}</div>`+
      `<div class="loc-dots">${dotsHtml(st.good, st.total, "g")}</div>`+
      `<div class="loc-stat b">부적합 ${st.bad}/${st.total}</div>`+
      `<div class="loc-dots">${dotsHtml(st.bad, st.total, "b")}</div>`+
      `<div class="loc-sel-hint">사진 ${sCnt}장 선택${sCnt<4?" (4장 이상)":""}</div>`+
      `<div class="loc-slots"></div>`;

    // 위치 이름/카드 탭 → 활성 위치 전환
    card.querySelector(".loc-card-top").addEventListener("click", ()=>{
      if(loc.id!==activeLocIds[cat.id]){ activeLocIds[cat.id]=loc.id; rerenderCategoryBody(cat); }
    });
    // 양호/불량 일괄
    card.querySelectorAll(".loc-seg button").forEach(btn=>{
      btn.addEventListener("click", (ev)=>{
        ev.stopPropagation();
        const val = btn.dataset.set;
        const already = (val==="양호" ? allGood : allBad);
        (loc.items||[]).forEach(it=>{ it.result = already ? "" : val; });
        scheduleSave();
        activeLocIds[cat.id]=loc.id;
        rerenderCategoryBody(cat);
      });
    });
    // 사진 4칸 슬롯 — 선택된 사진 우선 표시, 비면 + (탭하면 해당 위치로 이동)
    const slots = card.querySelector(".loc-slots");
    const sel = (loc.selectedPhotos||[]).filter(k=>(loc.photos||[]).includes(k));
    const keys = sel.concat((loc.photos||[]).filter(k=>!sel.includes(k))).slice(0,4);
    for(let n=0;n<4;n++){
      const b = document.createElement("button");
      b.className = "loc-slot" + (keys[n]?" filled":"");
      b.textContent = keys[n] ? "" : "+";
      b.addEventListener("click", ()=>{
        activeLocIds[cat.id]=loc.id;
        rerenderCategoryBody(cat);
      });
      if(keys[n]){
        sGet(keys[n]).then(d=>{ if(d){ const im=document.createElement("img"); im.src=d; b.textContent=""; b.appendChild(im); } });
      }
      slots.appendChild(b);
    }
    return card;
  }


  /* ───────────── 자동 비고 (설비별) ─────────────
     ① PC 관련 보안 항목(5개)의 '해당없음' 패턴
          · 전부 해당없음   → 설비별 '분리/제외 관리' 문구 (전자출입·네트워크·영상·주차관제 개별 문구)
          · 1~4개 해당없음  → 폐쇄망 PC 문구
     ② 접지저항 측정 항목이 '해당없음'  → 접지 측정 포인트 확인 불가 문구(2줄)
     ①과 ②는 동시에 들어갈 수 있으며, 워드에서는 측정값 요약 뒤에 함께 출력된다.
     사용자가 직접 입력한 비고는 절대 덮어쓰지 않는다(빈 값이거나
     이전에 자동으로 넣은 문구일 때만 갱신·교체·삭제한다). */
  const SEC_ITEM_NAMES = [
    "사용자 인증(비밀번호) 설정 여부 확인",
    "최신 보안 패치 설치 여부 확인",
    "최신 펌웨어 설치 여부 확인",
    "백신 설치 여부 및 정상작동 상태 확인",
    "바이러스 및 악성코드 경고 이벤트 확인"
  ];
  // 설비별 '전부 해당없음' 문구 — 설비명 부분 일치로 매칭
  const SEC_MEMO_BY_CAT = [
    {m:"전자출입",     t:"출입 관리 단말의 백신 및 사용자 인증은 상위 운영 서버/소프트웨어 제어 영역에 해당하므로, 하부 전자출입 물리 설비단 점검 대상에서 분리 관리함."},
    {m:"영상정보처리", t:"본 설비는 현장 영상 전송 계층으로, 상위 단말의 보안 패치 및 인증은 시스템 관리 정책상 서버 제어 영역에 해당하므로 영상 설비 점검 항목에서 분리하여 자체 지침에 따라 관리 중임."},
    {m:"주차관제",     t:"운영 PC 백신 및 인증 관리는 상위 주차 제어 서버/소프트웨어 영역에 해당하므로, 하부 주차관제 물리 설비 점검 대상에서 분리 관리함."}
  ];
  // 네트워크 설비 및 그 외 설비 기본 문구
  const SEC_MEMO_DEFAULT = "본 설비는 네트워크 인프라 계층으로, 상위 단말(PC)의 백신 및 사용자 인증은 보안 정책상 단말(서버) 제어 영역에 해당하므로, 인프라 설비 점검 항목에서는 제외 관리함.";
  const AUTO_MEMO_CLOSED = "외부망이 차단된 물리적 폐쇄망 장비로, 자체 정보보안 지침 및 유지보수 계획에 의거하여 주기적인 수동 패치와 보안 점검으로 안전하게 관리 중임.";
  // 접지 측정 포인트 확인 불가 (케이블·배관·단자함 등)
  const GND_LINE2 = "- 추가 접지 포인트 재확인 후 접지저항 값 측정 예정";
  const gndLine1  = (cat)=> `○ ${(cat && cat.name) || "해당 설비"} 접지 측정 포인트 확인 불가`;
  const GND_L1_RE = /^○ .*접지 측정 포인트 확인 불가$/;

  function isSecurityItem(item){ return item && SEC_ITEM_NAMES.includes(item.name); }
  // 접지저항 '측정' 항목만 대상 ('접지 상태 확인' 같은 육안 항목은 제외)
  function isGroundMeasureItem(item){ return !!(item && item.name && item.name.indexOf("접지저항") >= 0); }
  function isAutoMemoItem(item){ return isSecurityItem(item) || isGroundMeasureItem(item); }

  function secMemoFor(cat){
    const nm = (cat && cat.name) || "";
    const hit = SEC_MEMO_BY_CAT.find(o=> nm.indexOf(o.m) >= 0);
    return hit ? hit.t : SEC_MEMO_DEFAULT;
  }

  // 자동 비고 문단들을 계산 (배열)
  function autoMemoParts(cat, loc){
    const parts = [];
    const sec = (loc.items||[]).filter(isSecurityItem);
    if(sec.length){
      const na = sec.filter(it=> it.result === "해당없음").length;
      if(na === sec.length)  parts.push(secMemoFor(cat));   // 전부 → 설비별 분리 관리 문구
      else if(na >= 1)       parts.push(AUTO_MEMO_CLOSED);  // 일부 → 폐쇄망 PC 문구
    }
    const gnd = (loc.items||[]).filter(isGroundMeasureItem);
    if(gnd.length && gnd.some(it=> it.result === "해당없음")){
      parts.push(gndLine1(cat) + "\n" + GND_LINE2);
    }
    return parts;
  }

  // 자동 비고 대상 위치인지 (보안 항목 또는 접지저항 항목 보유)
  function hasAutoMemoTarget(loc){ return (loc.items||[]).some(isAutoMemoItem); }

  // 현재 비고가 '자동으로 넣은 것'인지 판정 — 사용자 수동 입력 보호용
  function isAutoMemoText(s){
    if(!s) return true;
    const known = new Set([AUTO_MEMO_CLOSED, SEC_MEMO_DEFAULT, GND_LINE2].concat(SEC_MEMO_BY_CAT.map(o=>o.t)));
    return s.split("\n").map(x=>x.trim()).filter(Boolean)
            .every(l => known.has(l) || GND_L1_RE.test(l));
  }

  // 계산된 자동 비고를 loc.memo에 반영. 사용자 수동 입력은 보존.
  //  반환: 실제로 memo가 바뀌었으면 true
  function applyAutoMemo(cat, loc){
    if(!hasAutoMemoTarget(loc)) return false;
    const cur = loc.memo || "";
    if(!isAutoMemoText(cur)) return false;   // 사용자가 직접 쓴 비고 → 건드리지 않음
    const desired = autoMemoParts(cat, loc).join("\n");
    if(cur === desired) return false;        // 변화 없음
    loc.memo = desired;
    return true;
  }

  // 화면의 비고 textarea/버튼을 loc.memo 값으로 즉시 동기화
  function syncMemoUI(cat, loc){
    const ta  = document.getElementById("cat-memo-"+cat.id);
    const btn = document.getElementById("cat-memobtn-"+cat.id);
    if(ta){
      ta.value = loc.memo || "";
      if(loc.memo) ta.style.display = "block";
    }
    if(btn) btn.textContent = loc.memo ? "📝 메모 보기/수정" : "+ 메모 추가";
  }


  function buildCategoryBody(cat, body){
    body.innerHTML = "";

    // Determine active location
    if(!activeLocIds[cat.id] || !cat.locations.find(l=>l.id===activeLocIds[cat.id])){
      activeLocIds[cat.id] = cat.locations[0]?.id;
    }
    const activeLoc = cat.locations.find(l=>l.id===activeLocIds[cat.id]) || cat.locations[0];

    // ── 위치 목록(내비게이션) ──
    //   상단 가로 스크롤 카드 슬라이더는 화면이 너무 꽉 차서 제거함.
    //   개별 양호/불량 입력은 아래 각 점검 항목의 세그먼트 버튼에서 그대로 가능하다.
    //   위치가 1개일 때도 첫 위치가 보이도록 항상 목록을 표시한다.
    if(cat.locations.length >= 1){
      const list = document.createElement("div");
      list.className = "loc-list";
      cat.locations.forEach(loc=>{
        const locItems = loc.items||[];
        const hasBad = locItems.some(it=>it.result==="불량");
        const locAllGood = locItems.length>0 && locItems.every(it=>it.result==="양호");
        const pCnt = (loc.photos||[]).length, sCnt = selCount(loc);
        // 버튼(전체 양호)을 안에 넣으므로 button 중첩을 피하려고 div[role=button] 사용
        const row = document.createElement("div");
        row.setAttribute("role","button");
        row.tabIndex = 0;
        row.className = "loc-row" + (loc===activeLoc?" active":"") + (hasBad?" bad":"");
        row.innerHTML = `<span class="loc-row-name">${hasBad?"⚠️ ":""}${escapeHtml(loc.name||"위치 입력")}</span>`+
          (pCnt?`<span class="loc-row-pic">📷${pCnt}</span>`:"")+
          (sCnt?`<span class="loc-row-sel">✅${sCnt}</span>`:"")+
          `<button class="loc-good-btn ${locAllGood?'active':''}" data-locid="${loc.id}" title="이 위치의 모든 항목 적합 설정/해제">${locAllGood?'✅ 해제':'전체 적합'}</button>`;
        row.dataset.locid = loc.id;
        // 행 클릭 → 활성 위치 전환 (전체 양호 버튼 클릭은 제외)
        row.addEventListener("click", (ev)=>{
          if(ev.target.closest(".loc-good-btn")) return;
          activeLocIds[cat.id] = loc.id;
          rerenderCategoryBody(cat);
        });
        row.addEventListener("keydown", (ev)=>{
          if(ev.key==="Enter" || ev.key===" "){
            ev.preventDefault();
            activeLocIds[cat.id] = loc.id;
            rerenderCategoryBody(cat);
          }
        });
        // ── 이 위치만 전체 양호 토글 (다른 위치는 영향 없음) ──
        row.querySelector(".loc-good-btn").addEventListener("click", (ev)=>{
          ev.stopPropagation();
          const curItems = loc.items||[];
          const curAllGood = curItems.length>0 && curItems.every(it=>it.result==="양호");
          const willSet = !curAllGood;
          curItems.forEach(it=>{ it.result = willSet ? "양호" : ""; });
          applyAutoMemo(cat, loc);   // 해당없음이 사라지면 자동 비고도 정리
          scheduleSave();
          activeLocIds[cat.id] = loc.id;
          rerenderCategoryBody(cat);
        });
        list.appendChild(row);
      });
      body.appendChild(list);
    }

    // + 위치 추가 (슬라이더 제거로 카드의 + 버튼을 여기로 이동 · 항상 표시)
    if(addingLocationFor !== cat.id){
      const addLocBtn = document.createElement("button");
