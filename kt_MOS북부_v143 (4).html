<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>kt MOS북부</title>
<meta name="apple-mobile-web-app-title" content="kt MOS북부">
<meta name="application-name" content="kt MOS북부">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --ink:#10172A;
    --muted:#64708A;
    --muted-weak:#9AA3B5;
    --accent:#155EEF;
    --accent-weak:#E8F0FF;
    --good:#1A8754;
    --good-weak:#E7F6EE;
    --bad:#D7263D;
    --bad-weak:#FDEAEC;
    --na:#B07A14;
    --na-weak:#FBF1DD;
    --border:#E3E6EC;
    --header:#10172A;
    --signal-on:#36D399;
    --signal-off:rgba(255,255,255,0.22);
    --radius:12px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{padding-bottom: env(safe-area-inset-bottom);}
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}

  /* ---- Header ---- */
  .topbar{
    position:sticky;top:0;z-index:20;color:#fff;
    padding:0 18px;padding-top:env(safe-area-inset-top);
    /* 남색 계열 대각 그라데이션 — 밋밋한 단색보다 깊이감을 준다 */
    background:linear-gradient(120deg,#0B1220 0%,#111A2E 48%,#16213B 100%);
    box-shadow:0 2px 10px rgba(8,12,22,.28);
    /* 하단에 얇은 KT 레드 액센트 라인 */
    border-bottom:2px solid transparent;
    border-image:linear-gradient(90deg,#E60012 0%,#E60012 42%,rgba(230,0,18,.25) 100%) 1;
  }
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;
    background:linear-gradient(90deg,#E60012 0%,#ff4d5e 40%,transparent 92%);opacity:.9;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:58px;padding:9px 0;position:relative;}
  .brand{
    font-size:16.5px;font-weight:800;letter-spacing:-.2px;line-height:1.25;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .brand small{font-size:10.5px;font-weight:500;letter-spacing:.4px;color:rgba(255,255,255,.62);}
  /* 홈 버튼: 유리 질감 */
  #home-btn{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.16)!important;
    backdrop-filter:blur(6px);transition:background .15s,transform .1s;}
  #home-btn:hover{background:rgba(255,255,255,.22)!important;}
  #home-btn:active{transform:scale(.94);}
  .brand small{display:block;font-weight:400;color:rgba(255,255,255,.6);font-size:11.5px;margin-top:1px;}
  .back-btn{background:none;border:none;color:#fff;font-size:20px;padding:4px 8px 4px 0;line-height:1;}
  .site-line{font-size:13px;color:rgba(255,255,255,.85);margin-top:2px;}
  .site-line b{color:#fff;font-weight:600;}

  .signal{display:flex;align-items:flex-end;gap:2px;height:22px;}
  .signal i{display:block;width:4px;border-radius:1px;background:var(--signal-off);}
  .signal i:nth-child(1){height:6px;} .signal i:nth-child(2){height:10px;}
  .signal i:nth-child(3){height:14px;} .signal i:nth-child(4){height:18px;}
  .signal i:nth-child(5){height:22px;}
  .signal i.on{background:var(--signal-on);}
  .progress-wrap{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .progress-text{font-size:12px;font-family:var(--mono);color:rgba(255,255,255,.85);}

  /* ---- Generic ---- */
  .container{padding:14px 14px 100px;}
  .info-banner{background:var(--accent-weak);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:14px;}
  .warn-banner{background:var(--bad-weak);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:14px;font-weight:600;}
  .primary-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;width:100%;}
  .primary-btn:disabled{background:#AEC3F2;}
  .outline-btn{background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;}
  .ghost-btn{background:none;border:none;color:var(--muted);font-size:13px;}
  .dashed-btn{width:100%;background:#fff;border:1.5px dashed var(--border);color:var(--muted);border-radius:10px;padding:11px;font-size:13.5px;font-weight:500;margin-top:10px;}
  .field-label{font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 6px;}
  .field-label:first-child{margin-top:0;}
  .text-input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;background:#fff;color:var(--ink);}
  .text-input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  /* ---- List view ---- */
  .empty-state{text-align:center;padding:48px 20px;color:var(--muted);font-size:13.5px;}
  .insp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;position:relative;}
  .insp-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .insp-name{font-size:16px;font-weight:700;}
  .insp-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .insp-bar-track{height:5px;background:var(--border);border-radius:3px;margin-top:12px;overflow:hidden;}
  .insp-bar-fill{height:100%;background:var(--accent);border-radius:3px;}
  .insp-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .insp-pct{font-size:11.5px;font-family:var(--mono);color:var(--muted);}
  .del-btn{background:none;border:none;color:var(--muted-weak);font-size:12px;padding:4px 6px;}
  .del-btn.confirm{color:var(--bad);font-weight:600;}
  .equip-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px;}
  .equip-item{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;transition:border-color .12s,background .12s;}
  .equip-item.checked{border-color:var(--accent);background:var(--accent-weak);}
  .equip-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;}
  .equip-item label{font-size:11.5px;font-weight:500;color:var(--ink);cursor:pointer;line-height:1.35;}
  .equip-item.checked label{color:var(--accent);font-weight:600;}
  .equip-select-all{display:flex;gap:8px;margin-bottom:8px;}
  .equip-select-all button{flex:1;background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px;font-size:12px;font-weight:600;color:var(--muted);}
  .step-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:20px;font-size:11px;font-weight:700;padding:2px 9px;margin-right:6px;}
  .step-count{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .form-row-btns{display:flex;gap:8px;margin-top:16px;}
  .form-row-btns .primary-btn{flex:1;}

  /* ---- Category accordion ---- */
  .cat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;}
  .cat-head-left{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .cat-name{font-size:14.5px;font-weight:700;}
  .cat-badge{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);white-space:nowrap;}
  .cat-badge.done{background:var(--good-weak);color:var(--good);}
  .cat-badge.partial{background:var(--accent-weak);color:var(--accent);}
  .cat-chev{color:var(--muted);font-size:20px;transition:transform .18s ease;line-height:1;}
  .bulk-good-btn{background:#fff;border:1.5px solid var(--border);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .12s;}
  .bulk-good-btn.active{background:var(--good-weak);border-color:var(--good);color:var(--good);}
  /* AI 동산보드 인식 */
  .ai-result-card{border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .ai-card-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);}
  .ai-thumb{width:56px;height:56px;object-fit:cover;border-radius:7px;flex-shrink:0;}
  .ai-card-info{flex:1;min-width:0;}
  .ai-card-title{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ai-card-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .ai-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;}
  .ai-ok{background:var(--good-weak);color:var(--good);}
  .ai-fail{background:#fff0ee;color:var(--bad);}
  .ai-wait{background:var(--bg);color:var(--muted);}
  .ai-detail{padding:8px 12px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  .ai-field{font-size:11.5px;}<br>  .ai-field span{font-weight:700;color:var(--ink);}
  .ai-match{padding:6px 12px;border-top:1px solid var(--border);background:var(--accent-weak);font-size:12px;color:var(--accent);font-weight:600;}
  .ai-no-match{padding:6px 12px;border-top:1px solid var(--border);background:#fff8ee;font-size:12px;color:var(--warn);font-weight:600;}
  .ai-progress{text-align:center;padding:20px;color:var(--muted);font-size:13px;}
  .ai-spin{display:inline-block;animation:spin 1s linear infinite;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .struct-bld-card{border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .struct-bld-header{background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;}
  .struct-bld-name{font-size:14px;font-weight:800;flex:1;}
  .struct-bld-meta{font-size:11.5px;opacity:.7;}
  .floor-map{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .floor-map table{border-collapse:collapse;min-width:100%;font-size:11.5px;}
  .floor-map th{background:#f0f2f6;padding:5px 8px;text-align:center;font-weight:700;font-size:11px;color:var(--muted);border:1px solid var(--border);white-space:nowrap;}
  .floor-map td{padding:4px 6px;border:1px solid var(--border);text-align:center;min-width:44px;}
  .floor-map .floor-label{font-weight:700;font-size:12px;color:var(--muted);background:#fafafa;}
  /* ── 건물구조 입체(아이소메트릭) 뷰 — 클립아트 스타일 SVG ── */
  .iso-svg-wrap{display:flex;justify-content:center;padding:4px 0 0;}
  .iso-svg-wrap svg{width:min(56vw,210px);height:auto;}
  .iso-floor-g{cursor:pointer;}
  .iso-floor-g:hover polygon{filter:brightness(1.05);}
  .iso-floor-g.sel polygon{stroke:#1A2540;stroke-width:1.8;}
  .iso-detail{display:none;background:#fff;border:1.5px solid var(--border);border-radius:11px;margin:4px 0 12px;padding:10px;box-shadow:0 4px 14px rgba(26,37,64,.12);}
  .iso-detail.open{display:block;}
  .iso-detail h5{font-size:12.5px;font-weight:800;color:#1A2540;margin:0 0 7px;display:flex;justify-content:space-between;align-items:center;}
  .iso-detail h5 .cnt{font-size:10.5px;color:var(--muted);font-weight:600;}
  .iso-legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:10.5px;color:var(--muted);padding:4px 0 8px;}
  .iso-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:3px;vertical-align:-1px;}
  .room-cell{border-radius:5px;padding:3px 5px;font-size:10.5px;font-weight:700;cursor:pointer;display:inline-block;min-width:36px;text-align:center;}
  .rc-done{background:var(--good-weak);color:var(--good);}
  .rc-inprog{background:#fff8ee;color:var(--warn);}
  .rc-wait{background:#f0f2f6;color:var(--muted);}
  .rc-none{color:#ddd;font-size:10px;}
  .struct-legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;background:#fafafa;border-top:1px solid var(--border);}
  .legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
  .legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .cat-del-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);}
  .cat-del-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .cat-del-btn:active{background:var(--bad-weak);color:var(--bad);border-color:var(--bad);}
  .cat-del-confirm-btn{background:var(--bad);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .cat-del-cancel-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;}
  .toggle-switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
  .toggle-switch input{opacity:0;width:0;height:0;}
  .toggle-track{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:26px;transition:.2s;}
  .toggle-track::before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
  .toggle-switch input:checked + .toggle-track{background:var(--accent);}
  .toggle-switch input:checked + .toggle-track::before{transform:translateX(18px);}
  .cat.open .cat-chev{transform:rotate(180deg);}
  .cat.open .cat-head{background:var(--accent-weak);border-left:4px solid var(--accent);padding-left:10px;}
  .cat-body{display:none;border-top:1px solid var(--border);}
  .cat.open .cat-body{display:block;}

  /* ---- Item ---- */
  .item{padding:13px 14px;border-bottom:1px solid var(--border);}
  .loc-head{display:flex;align-items:center;justify-content:space-between;background:var(--accent-weak);padding:9px 14px;border-bottom:1px solid var(--border);gap:8px;}
  .loc-name{font-size:13px;font-weight:700;color:var(--accent);}
  .loc-actions{display:flex;gap:6px;flex-shrink:0;}
  .loc-actions button{background:none;border:none;font-size:11.5px;color:var(--accent);font-weight:600;padding:3px 4px;}
  .loc-actions button.loc-del-btn{color:var(--muted);}
  .loc-actions button.loc-del-btn.confirm{color:var(--bad);}
  .loc-head .loc-rename-input{flex:1;padding:7px 10px;font-size:13px;}
  .loc-head .loc-rename-go{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;flex-shrink:0;}
  .item:last-of-type{border-bottom:none;}
  .item-name{font-size:14px;font-weight:600;}
  .item-std{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45;}
  .seg{display:flex;margin-top:10px;border-radius:9px;overflow:hidden;border:1px solid var(--border);}
  .seg button{flex:1;border:none;background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;padding:9px 4px;border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.active.good{background:var(--good-weak);color:var(--good);}
  .seg button.active.bad{background:var(--bad-weak);color:var(--bad);}
  .seg button.active.na{background:var(--na-weak);color:var(--na);}
  .value-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .value-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#fff;}
  .value-unit{font-size:12.5px;color:var(--muted);min-width:fit-content;}
  .value-row.multi{flex-wrap:wrap;gap:6px;}
  .vfield{display:flex;align-items:center;gap:5px;flex:1 1 128px;border:1px solid var(--border);border-radius:8px;padding:3px 8px;background:#fff;}
  .vfield-k{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:700;}
  .vfield .value-input{border:none;padding:6px 0;flex:1;min-width:0;background:transparent;border-radius:0;}
  .vfield .value-input:focus{outline:none;}
  .vdelta{font-size:11.5px;color:var(--muted);flex-basis:100%;padding:1px 2px 0;}
  .item-row-bottom{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;}
  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .photo-thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;border:1px solid var(--border);display:block;}
  .photo-thumb-wrap{position:relative;width:54px;height:54px;}
  .photo-corner{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#8A92A8;color:#fff;border:2px solid #fff;font-size:12px;line-height:15px;text-align:center;padding:0;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .photo-corner.bad{width:23px;height:23px;top:-7px;right:-7px;background:#E5484D;font-size:12px;line-height:18px;box-shadow:0 0 0 2px #E5484D,0 2px 6px rgba(229,72,77,.55);animation:badPulse 1.6s ease-in-out infinite;}
  .photo-pick{position:absolute;bottom:-6px;right:-6px;width:20px;height:20px;border-radius:6px;background:#fff;color:transparent;border:2px solid #cbd2dd;font-size:12px;font-weight:900;line-height:16px;text-align:center;padding:0;cursor:pointer;}
  .photo-pick.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .photo-thumb-wrap.picked .photo-thumb{border:2.5px solid var(--accent);}
  .photo-thumb-wrap.bad .photo-thumb{border:3px solid #E5484D;}
  .photo-bad-tag{position:absolute;left:0;bottom:0;background:#E5484D;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:0 6px 0 6px;letter-spacing:.3px;}
  @keyframes badPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .photo-add{width:54px;height:54px;border-radius:8px;border:1.5px dashed var(--border);background:#fff;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .photo-add span{font-size:15px;line-height:1;}
  .insp-type-sel{display:flex;gap:10px;margin-bottom:4px;}
  .insp-type-btn{flex:1;background:#f7f8fa;border:2px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;line-height:1.3;}
  .insp-type-btn span{display:block;font-size:11px;font-weight:400;margin-top:4px;color:var(--muted);}
  .insp-type-btn.active{border-color:var(--accent);background:var(--accent-weak);color:var(--accent);}
  .insp-type-btn.active span{color:var(--accent);}
  .insp-type-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;display:inline-block;}
  /* Firebase 실시간 연동 */
  .sync-badge{display:none;align-items:center;gap:5px;background:#1a8754;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;cursor:pointer;}
  .sync-badge.offline{background:#888;}
  .sync-badge .sync-dot{width:7px;height:7px;border-radius:50%;background:#7dffc4;animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  .fb-setup-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;
    font-size:11.5px;font-weight:600;border-radius:9px;padding:6px 10px;cursor:pointer;
    backdrop-filter:blur(6px);transition:background .15s,transform .1s;}
  .fb-setup-btn:hover{background:rgba(255,255,255,.18);}
  .fb-setup-btn:active{transform:scale(.95);}
  /* 좁은 화면(모바일): 중앙 절대배치 제목이 버튼과 겹치므로 흐름 배치로 되돌린다 */
  @media (max-width:640px){
    .brand{position:static;transform:none;left:auto;top:auto;align-items:flex-start;
      flex:1;min-width:0;text-align:left;}
    .brand span,.brand{overflow:hidden;text-overflow:ellipsis;}
    .topbar-row{min-height:52px;}
  }
  /* 상단바 안의 아웃라인 버튼(엑셀·가져오기 등)도 유리 질감으로 통일 */
  .topbar .outline-btn{background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.20)!important;
    color:#fff!important;border-radius:9px!important;backdrop-filter:blur(6px);
    transition:background .15s,transform .1s;}
  .topbar .outline-btn:hover{background:rgba(255,255,255,.18)!important;}
  .topbar .outline-btn:active{transform:scale(.96);}
  .fb-code-box{background:#1a2540;color:#7dffc4;font-size:22px;font-weight:900;letter-spacing:6px;text-align:center;border-radius:12px;padding:14px 0;margin:10px 0;font-family:monospace;}
  .sync-member{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .sync-pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1.5s infinite;}
  .loc-tabbar::-webkit-scrollbar{display:none;}
  /* ── 위치: 상단 가로 슬라이드 카드 + 하단 리스트 ── */
  .loc-slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding:4px 2px 10px;margin:2px 0 0;cursor:grab;touch-action:pan-x pinch-zoom;overscroll-behavior-x:contain;}
  .loc-slider.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto;}
  .loc-slider.dragging *{pointer-events:none;}
  .loc-slider::-webkit-scrollbar{height:0;}
  .loc-card{flex:0 0 82%;max-width:300px;scroll-snap-align:center;border:1.5px solid var(--border);border-radius:14px;background:#fff;padding:12px 13px;text-align:left;}
  @media(min-width:560px){ .loc-card{flex:0 0 46%;} }
  @media(min-width:900px){ .loc-card{flex:0 0 24%;} }
  .loc-card.active{border-color:var(--accent);border-width:2px;box-shadow:0 3px 12px rgba(37,99,235,.14);}
  .loc-card.bad{border-color:#F2B8BC;}
  .loc-card.bad.active{border-color:#E5484D;box-shadow:0 3px 12px rgba(229,72,77,.14);}
  .loc-card-top{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;}
  .loc-card-name{font-size:14px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .loc-card.active .loc-card-name{color:var(--accent);}
  .loc-card.bad .loc-card-name{color:#d7263d;}
  .loc-card-pic{font-size:12px;font-weight:700;color:var(--good);white-space:nowrap;}
  .loc-card-sel{font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap;}
  .loc-seg{display:flex;gap:8px;margin-bottom:11px;}
  .loc-seg button{flex:1;padding:8px 0;font-size:13px;font-weight:800;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--muted);}
  .loc-seg button.g.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .loc-seg button.b{border-color:#F2B8BC;color:#E5484D;}
  .loc-seg button.b.on{background:#E5484D;border-color:#E5484D;color:#fff;}
  .loc-stat{font-size:11.5px;font-weight:700;margin-bottom:5px;}
  .loc-stat.g{color:var(--accent);} .loc-stat.b{color:#E5484D;}
  .loc-dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .loc-dot{width:7px;height:7px;border-radius:50%;background:#D9DEE7;}
  .loc-dot.g{background:var(--accent);} .loc-dot.b{background:#E5484D;}
  .loc-sel-hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:7px;}
  .loc-slots{display:flex;gap:7px;}
  .loc-slot{flex:1;aspect-ratio:1/1;border-radius:9px;background:#F1F3F6;display:flex;align-items:center;justify-content:center;font-size:16px;color:#B6BDC8;overflow:hidden;}
  .loc-slot.filled{background:none;}
  .loc-slot img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
  /* 하단 리스트 */
  .loc-list{display:grid;grid-template-columns:1fr;gap:0 16px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:2px 12px;margin-bottom:10px;}
  @media(min-width:560px){ .loc-list{grid-template-columns:1fr 1fr;} }
  .loc-row{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--border);background:none;border-left:0;border-right:0;border-top:0;width:100%;cursor:pointer;text-align:left;}
  .loc-row:last-child{border-bottom:none;}
  .loc-row-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .loc-row.active .loc-row-name{color:var(--accent);font-weight:800;}
  .loc-row.viewing{background:var(--accent-weak);border-radius:7px;}
  .loc-row.bad .loc-row-name{color:#d7263d;}
  .loc-row-pic{font-size:12px;font-weight:700;color:var(--good);}
  .loc-row-sel{font-size:12px;font-weight:800;color:var(--accent);}
  .loc-good-btn{flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;
    border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;line-height:1;
    white-space:nowrap;font-family:inherit;transition:background .12s,color .12s,border-color .12s;}
  .loc-good-btn:hover{background:var(--accent-weak);}
  .loc-good-btn.active{background:var(--good,#16a34a);border-color:var(--good,#16a34a);color:#fff;}
  .loc-card-add{flex:0 0 56px;border:1.5px dashed var(--border);border-radius:14px;background:none;color:var(--muted);font-size:22px;font-weight:700;cursor:pointer;scroll-snap-align:center;}
  .loc-card-add:hover{border-color:var(--accent);color:var(--accent);}
  .loc-add-btn{display:block;width:100%;border:1.5px dashed var(--border);border-radius:12px;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:10px 0;margin-bottom:10px;cursor:pointer;}
  .loc-add-btn:hover{border-color:var(--accent);color:var(--accent);}
  .loc-tab{flex-shrink:0;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;}
  .loc-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .loc-tab.bad{color:#d7263d;}
  .loc-tab.bad.active{color:#d7263d;border-bottom-color:#d7263d;}
  .loc-tab-add{flex-shrink:0;padding:9px 12px;font-size:18px;color:var(--muted-weak);border:none;background:none;cursor:pointer;line-height:1;}
  .loc-name-edit{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--accent-weak);}
  .loc-name-edit input{flex:1;border:1px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:13.5px;font-weight:600;}
  .loc-name-edit button{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:700;}
  .note-toggle{font-size:12px;color:var(--accent);background:none;border:none;padding:0;font-weight:600;}
  .note-area{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px;resize:vertical;min-height:54px;color:var(--ink);}

  .add-item-form, .add-cat-form{background:var(--bg);border-top:1px solid var(--border);padding:13px 14px;}
  .add-item-form .text-input, .add-cat-form .text-input{margin-bottom:8px;}
  .checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .checkbox-row input{width:16px;height:16px;}
  .mini-form-btns{display:flex;gap:8px;}
  .mini-form-btns button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--muted);}
  .mini-form-btns button.go{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---- Bottom bar ---- */
  .bottombar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--border);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20;}
  .save-status{font-size:11.5px;color:var(--muted-weak);display:flex;align-items:center;gap:5px;}
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
  .save-dot.pending{background:var(--na);}

  /* ---- Mode tabs ---- */
  .mode-tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:19;}
  .mode-tab{flex:1;padding:11px 6px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;}
  .mode-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .mode-tab .tab-count{display:inline-block;background:var(--accent-weak);color:var(--accent);border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:700;}
  .mode-tab.active .tab-count{background:var(--accent);color:#fff;}
  /* ---- Photo mode item cards ---- */
  .pm-cat{margin-bottom:12px;}
  .pm-cat-head{font-size:13px;font-weight:700;color:var(--muted);padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .pm-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:8px;}
  .pm-item-name{font-size:13.5px;font-weight:600;margin-bottom:4px;}
  .pm-item-result{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:8px;}
  .pm-item-result.ok{background:var(--good-weak);color:var(--good);}
  .pm-item-result.bad{background:var(--bad-weak);color:var(--bad);}
  .pm-item-result.na{background:var(--na-weak);color:var(--na);}
  .pm-item-result.none{background:#f0f0f0;color:var(--muted);}
  .pm-empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px;line-height:1.6;}
  .overlay{position:fixed;inset:0;background:rgba(10,14,26,.78);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  /* ── 홈(점검 유형 선택) 화면 — KT 레드 테마 ── */
  .home-wrap{min-height:100vh;background:#F4F5F7;display:flex;flex-direction:column;padding:0 18px 30px;}
  .home-brand{background:#fff;margin:0 -18px;padding:26px 22px 16px;border-bottom:1px solid #eceef1;}
  /* kt MOS 북부 로고 — kt는 실제 로고를 벡터(SVG)로 재현, 폰트 영향 없음 */
  .home-logo{--kt-h:23px;font-size:26px;font-weight:800;color:#F89496;letter-spacing:0;line-height:1.1;display:flex;align-items:baseline;}
  .home-logo .kt-mark{height:var(--kt-h);width:calc(var(--kt-h)*82/69);flex:none;margin-right:calc(var(--kt-h)*.19);}
  .home-logo em{font-style:normal;font-size:15px;color:#F89496;font-weight:800;margin-left:2px;letter-spacing:-.3px;position:relative;top:calc(var(--kt-h)*-.13);}
  .home-sub{font-size:15px;font-weight:800;color:#111;margin-top:6px;padding-bottom:8px;border-bottom:3px solid #E60012;display:inline-block;}
  .home-guide{font-size:13px;color:#6B7280;font-weight:600;margin:22px 2px 4px;}
  .home-mode-card{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 14px;margin-top:12px;cursor:pointer;text-align:left;box-shadow:0 1px 4px rgba(17,24,39,.06);transition:transform .12s;font-family:inherit;}
  .home-mode-card:active{transform:scale(.98);}
  .hm-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .hm-body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .hm-title{font-size:15.5px;font-weight:800;}
  .hm-desc{font-size:11.5px;color:#6B7280;}
  .hm-cnt{color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;flex-shrink:0;}
  .home-foot{text-align:center;font-size:10.5px;color:#9CA3AF;margin-top:auto;padding-top:26px;}
  .overlay.top-layer{z-index:200;}
  .overlay.center{align-items:center;padding:20px;}
  .sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
  .overlay.center .sheet{border-radius:14px;max-height:90vh;}
  .sheet-title{font-size:15.5px;font-weight:700;margin-bottom:10px;}
  .sheet textarea.summary{width:100%;min-height:300px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px;font-family:var(--mono);line-height:1.55;color:var(--ink);}
  .sheet-btn-row{display:flex;gap:8px;margin-top:12px;}
  .sheet-btn-row button{flex:1;}
  .photo-view{max-width:100%;max-height:100%;border-radius:8px;}
  .photo-view-overlay{padding:16px;}
  .copy-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;z-index:60;}

  /* ══════════════════════════════════════════════════════════
     화면모드 — 단말기(기본) / 태블릿(html.tab-mode) / PC(html.pc-mode)
     기존 모바일 규칙은 그대로 두고 필요한 값만 덮어씁니다.

     ── 폭 설계 원칙 ────────────────────────────────────────
     실제 차지하는 가로폭 = max-width × zoom 이므로,
     화면 크기별로 max-width 를 나눠 가로 스크롤을 막습니다.

       [PC · zoom 1.15]            [태블릿 · zoom 1.08]
        1280 →  980 × 1.15 = 1127   ~1023 → 100% (화면 가득, 확대 없음)
        1440 → 1180 × 1.15 = 1357    1024 →  930 × 1.08 = 1004
        1680 → 1320 × 1.15 = 1518    1180 → 1060 × 1.08 = 1145
        1920 → 1560 × 1.15 = 1794    1366 → 1200 × 1.08 = 1296
     ══════════════════════════════════════════════════════════ */

  /* ── PC · 태블릿 공통 ── */
  html.pc-mode #app,          html.tab-mode #app          { box-shadow:0 0 0 1px var(--border); }
  html.pc-mode .sheet,        html.tab-mode .sheet        { max-width:760px; border-radius:16px; }
  html.pc-mode .container,    html.tab-mode .container    { padding:18px 22px 110px; }
  html.pc-mode .home-wrap,    html.tab-mode .home-wrap    { padding:0 26px 30px; }
  html.pc-mode .home-brand,   html.tab-mode .home-brand   { margin:0 -26px; }
  html.pc-mode .home-guide,   html.tab-mode .home-guide   { margin-top:26px; }
  /* 가로로 늘어지면 어색한 요소는 폭 제한 */
  html.pc-mode .primary-btn,  html.tab-mode .primary-btn  { max-width:520px; margin-left:auto; margin-right:auto; display:block; }
  html.pc-mode .info-banner,  html.tab-mode .info-banner,
  html.pc-mode .warn-banner,  html.tab-mode .warn-banner  { max-width:900px; }

  /* 점검 유형 카드 3장을 가로 배치 (768px 이상에서만) */
  @media (min-width:768px){
    html.pc-mode .home-modes,     html.tab-mode .home-modes     { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:12px; align-items:stretch; }
    html.pc-mode .home-mode-card, html.tab-mode .home-mode-card { margin-top:0; flex-direction:column; align-items:flex-start; gap:10px; padding:20px 18px; height:100%; }
    html.pc-mode .hm-cnt,         html.tab-mode .hm-cnt         { align-self:flex-start; }
  }

  /* ── PC 모드 ── */
  html.pc-mode body{ zoom:1.15; }
  html.pc-mode #app, html.pc-mode .bottombar{ max-width:980px; }
  html.pc-mode #app, html.pc-mode .home-wrap{ min-height:calc(100vh / 1.15); }  /* zoom 으로 100vh 가 커져 생기는 세로 스크롤 보정 */
  @media (min-width:1440px){ html.pc-mode #app, html.pc-mode .bottombar{ max-width:1180px; } }
  @media (min-width:1680px){ html.pc-mode #app, html.pc-mode .bottombar{ max-width:1320px; } }
  @media (min-width:1920px){ html.pc-mode #app, html.pc-mode .bottombar{ max-width:1560px; } }
  /* 창이 좁은데 PC 모드가 켜져 있으면 확대를 끄고 폭만 넓게 → 가로 스크롤 방지 */
  @media (max-width:1279px){
    html.pc-mode body{ zoom:1; }
    html.pc-mode #app, html.pc-mode .bottombar{ max-width:100%; }
    html.pc-mode #app, html.pc-mode .home-wrap{ min-height:100vh; }
  }

  /* ── 태블릿 모드 ── */
  /* 세로 태블릿(1023px 이하)은 확대 없이 화면을 가득 채웁니다 — 터치 크기는 이미 적정 */
  html.tab-mode #app, html.tab-mode .bottombar{ max-width:100%; }
  @media (min-width:1024px){
    html.tab-mode body{ zoom:1.08; }
    html.tab-mode #app, html.tab-mode .bottombar{ max-width:930px; }
    html.tab-mode #app, html.tab-mode .home-wrap{ min-height:calc(100vh / 1.08); }
  }
  @media (min-width:1180px){ html.tab-mode #app, html.tab-mode .bottombar{ max-width:1060px; } }
  @media (min-width:1366px){ html.tab-mode #app, html.tab-mode .bottombar{ max-width:1200px; } }
  /* 태블릿 모드를 스마트폰에서 켠 경우 — 확대 끄고 원래 여백으로 */
  @media (max-width:767px){
    html.tab-mode body{ zoom:1; }
    html.tab-mode .container{ padding:14px 14px 100px; }
    html.tab-mode .home-wrap{ padding:0 18px 30px; }
    html.tab-mode .home-brand{ margin:0 -18px; }
  }

  /* ── 홈 화면 모드 전환 세그먼트 ── */
  .vm-seg{ display:flex; background:#EDEFF2; border:1px solid #E0E3E8; border-radius:10px; padding:3px; margin:16px 0 0; width:fit-content; max-width:100%; }
  .vm-seg button{ background:none; border:none; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700; white-space:nowrap;
                  color:#6B7280; font-family:inherit; display:flex; align-items:center; gap:5px; transition:background .12s,color .12s; }
  .vm-seg button.on{ background:#fff; color:#E60012; box-shadow:0 1px 3px rgba(17,24,39,.12); }
  .vm-hint{ font-size:10.5px; color:#9CA3AF; margin:6px 2px 0; }

  /* ══ 점검 목록 · 작업 큐(표형) — 태블릿/PC 모드 전용 ══ */
  .q-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:2px 0 16px;}
  .q-head h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--ink);}
  .q-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
  .q-new{background:#E60012;color:#fff;border:0;border-radius:9px;padding:11px 20px;
         font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .q-new:hover{background:#C4000F;}
  .q-wrap{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden;}
  table.q-table{width:100%;border-collapse:collapse;}
  table.q-table th{font-size:11px;font-weight:700;color:var(--muted-weak);text-align:left;
    padding:11px 12px;border-bottom:1.5px solid var(--border);letter-spacing:.3px;background:#FAFBFC;white-space:nowrap;}
  table.q-table td{padding:13px 12px;border-bottom:1px solid #F0F2F5;font-size:13px;vertical-align:middle;}

(function(){
  var KEY = "ktmos-viewmode";
  var OK  = { mobile:1, tablet:1, pc:1 };
  var v = null;
  try { v = localStorage.getItem(KEY); } catch(e){}
  if(!OK[v]){
    /* 최초 실행 시 화면폭으로 자동 판단 */
    var w = window.innerWidth;
    v = (w >= 1280) ? "pc" : (w >= 768) ? "tablet" : "mobile";
    try { localStorage.setItem(KEY, v); } catch(e){}
  }
  var de = document.documentElement;
  de.classList.toggle("pc-mode",  v === "pc");
  de.classList.toggle("tab-mode", v === "tablet");
  window.KTMOS_VIEWMODE_KEY = KEY;
})();
</script>

  /* ============================================================
     🔥 Firebase 실시간 연동 모듈
     - Firebase Realtime Database 기반 실시간 다중 사용자 동기화
     - Firebase 미설정 시 기존 로컬 모드로 동작 (하위 호환)
  ============================================================ */
  const MY_DEVICE_ID = 'dev_' + Math.random().toString(36).slice(2, 10);
  let fbApp = null, fbDB = null, fbSyncRef = null;
  let fbSyncActive = false, fbSyncTimer = null, fbIgnoreMs = 0;
  let fbOnlineCount = 1; // 현재 연동 중인 인원 수

  /* Firebase 설정 로드/저장 */
  function getFbConfig(){ try{ return JSON.parse(localStorage.getItem('fb_cfg')||'null'); }catch{ return null; } }
  function setFbConfig(c){ localStorage.setItem('fb_cfg', JSON.stringify(c)); }

  /* Firebase 초기화 */
  function initFirebase(cfg){
    try{
      // 기존 앱이 있으면 삭제
      if(fbApp){ try{ fbApp.delete(); }catch{} fbApp=null; fbDB=null; }
      const appName = 'ktinsp_' + Date.now();
      fbApp = firebase.initializeApp(cfg, appName);
      fbDB  = firebase.database(fbApp);
      setFbConfig(cfg);
      return true;
    }catch(e){
      console.error('Firebase 초기화 실패:', e);
      return false;
    }
  }

  /* 실시간 동기화 시작 */
  function startFirebaseSync(insp){
    if(!fbDB || !insp){ showToast("Firebase 설정 먼저 해주세요 (상단 🔥 버튼)"); return; }
    stopFirebaseSync();
    fbSyncActive = true;

    // 공유코드 = ID 앞 6자 대문자
    if(!insp.shareCode) insp.shareCode = insp.id.slice(0,6).toUpperCase();

    const path = 'inspections/' + insp.id;
    fbSyncRef = fbDB.ref(path);

    // 온라인 프레즌스 등록
    const presenceRef = fbDB.ref(path + '/presence/' + MY_DEVICE_ID);
    presenceRef.set({ name: insp.inspector||'점검자', joinedAt: Date.now() });
    presenceRef.onDisconnect().remove();

    // 온라인 인원 감지
    fbDB.ref(path + '/presence').on('value', snap=>{
      fbOnlineCount = snap.numChildren ? snap.numChildren() : 1;
      updateSyncBadge();
    });

    // 원격 변경 수신
    fbSyncRef.child('data').on('value', snap=>{
      const remote = snap.val();
      if(!remote) return;
      if(remote._deviceId === MY_DEVICE_ID) return;
      if(Date.now() < fbIgnoreMs) return;
      mergeFromRemote(remote);
    });

    // 현재 데이터 즉시 업로드
    pushToFirebase(true);
    updateSyncBadge();
    showToast(`🔥 실시간 연동 시작 — 공유코드: ${insp.shareCode}`);
  }

  /* 실시간 동기화 중지 */
  function stopFirebaseSync(){
    if(fbSyncRef){ fbSyncRef.off(); fbSyncRef=null; }
    if(current && fbDB){

  /* Firebase에 데이터 푸시 (디바운스 800ms) */
  function pushToFirebase(immediate=false){
    if(!fbDB || !fbSyncRef || !current || !fbSyncActive) return;
    if(fbSyncTimer) clearTimeout(fbSyncTimer);
    const delay = immediate ? 0 : 800;
    fbSyncTimer = setTimeout(()=>{
      try{
        // 사진 key 목록만 포함 (base64 제외 — Firebase용량 절약)
        const payload = JSON.parse(JSON.stringify(current));
        payload.categories.forEach(cat=>
          cat.locations.forEach(loc=>{ loc.photos = (loc.photos||[]); })
        );
        payload._deviceId  = MY_DEVICE_ID;
        payload._pushedAt  = Date.now();
        fbIgnoreMs = Date.now() + 3000; // 3초간 원격수신 무시
        fbSyncRef.child('data').set(payload).catch(e=> console.error('Firebase push error:', e));
        fbIgnoreMs = 0;
      }catch(e){ console.error('Firebase push error:', e); }
    }, delay);
  }

  /* 원격 데이터 병합 */
  function mergeFromRemote(remote){
    if(!current || !remote) return;
    let changed = false;
    const clone = o => JSON.parse(JSON.stringify(o));

    (remote.categories||[]).forEach(rCat=>{
      let myCat = current.categories.find(c=>c.id===rCat.id);
      if(!myCat){
        // 동료가 추가한 새 설비 → 추가
        current.categories.push(clone(rCat)); changed=true; return;
      }
      (rCat.locations||[]).forEach(rLoc=>{
        let myLoc = myCat.locations.find(l=>l.id===rLoc.id);
        if(!myLoc){
          // 동료가 추가한 새 위치 → 추가
          myCat.locations.push(clone(rLoc)); changed=true; return;
        }
        // 위치명 병합
        if(!myLoc.name && rLoc.name){ myLoc.name = rLoc.name; changed=true; }
        // 메모 병합
        if(!myLoc.memo && rLoc.memo){ myLoc.memo = rLoc.memo; changed=true; }
        // 항목 결과 병합 (빈 항목에만 적용, 없는 항목은 추가)
        (rLoc.items||[]).forEach(rIt=>{
          const myIt = myLoc.items.find(i=>i.id===rIt.id);
          if(!myIt){ myLoc.items.push(clone(rIt)); changed=true; return; }
          if(!myIt.result && rIt.result){ myIt.result=rIt.result; changed=true; }
          if(!myIt.value  && rIt.value ){ myIt.value =rIt.value;  changed=true; }
          if(!myIt.note   && rIt.note  ){ myIt.note  =rIt.note;   changed=true; }
        });
        // 사진 키 병합
        (rLoc.photos||[]).forEach(key=>{
          if(!(myLoc.photos||[]).includes(key)){ (myLoc.photos=myLoc.photos||[]).push(key); changed=true; }
        });
        // 동산보드 메타 병합
        if(rLoc.photoMeta){
          if(!myLoc.photoMeta) myLoc.photoMeta = {};
          Object.keys(rLoc.photoMeta).forEach(k=>{
            if(!myLoc.photoMeta[k]){ myLoc.photoMeta[k]=rLoc.photoMeta[k]; changed=true; }
          });
        }
      });
    });

    if(changed){
      scheduleSave();
      renderDetail();
      showToast(`👥 동료 업데이트 반영됨`);
    }
  }

  /* 공유코드로 점검 참여 */
  async function joinByFirebaseCode(code){
    if(!fbDB) return false;
    try{
      const snap = await fbDB.ref('inspections')
        .orderByChild('data/shareCode').equalTo(code.toUpperCase()).once('value');
      if(!snap.exists()) return false;

      let found = null;
      snap.forEach(child=>{ found = child.val()?.data; });
      if(!found) return false;

      const insp = migrateInspection(found);
      await sSet('inspection:'+insp.id, JSON.stringify(insp));
      updateIndexEntry(insp); await saveIndex();
      return insp.id;
    }catch(e){ console.error('Firebase join error:', e); return false; }
  }

  /* ============ Storage helpers ============
     이 앱은 두 가지 환경에서 모두 동작합니다:
     1) Claude 안에서 미리보기로 열었을 때 -> window.storage 사용
     2) 다운로드 후 휴대폰에서 단독 파일로 열었을 때 -> 브라우저 내장 IndexedDB 사용 (완전 오프라인 동작)
     둘 다 사용 불가하면 메모리에만 저장(앱은 정상 동작하되, 완전히 닫으면 데이터는 사라짐). */
  let backend = "mem";
  const memStore = new Map();
  let idbPromise = null;

  function getIDB(){
    if(idbPromise) return idbPromise;
    idbPromise = new Promise((resolve, reject)=>{
      if(!window.indexedDB){ reject(new Error("no indexedDB")); return; }
      const req = indexedDB.open("telecom-inspect-db", 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore("kv");
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return idbPromise;
  }

  let storageWarning = false;
  async function detectBackend(){
    if(window.storage && typeof window.storage.set === "function"){
      backend = "native";
      return;
    }
    try{ await getIDB(); backend = "idb"; }
    catch(e){ backend = "mem"; storageWarning = true; }
  }

  async function sGet(key){
    try{
      if(backend === "native"){
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }
      if(backend === "idb"){
        const db = await getIDB();
        return await new Promise((resolve,reject)=>{
          const tx = db.transaction("kv","readonly");
          const req = tx.objectStore("kv").get(key);
          req.onsuccess = ()=> resolve(req.result !== undefined ? req.result : null);
          req.onerror = ()=> reject(req.error);
        });
      }
      return memStore.has(key) ? memStore.get(key) : null;
    }catch(e){ return null; }
  }

  async function sSet(key, value){
    try{
      if(backend === "native"){ return await window.storage.set(key, value, false); }
      if(backend === "idb"){
        const db = await getIDB();
        return await new Promise((resolve,reject)=>{
          const tx = db.transaction("kv","readwrite");
          tx.objectStore("kv").put(value, key);
          tx.oncomplete = ()=> resolve(true);
          tx.onerror = ()=> reject(tx.error);
        });
      }
      memStore.set(key, value);
      return true;
    }catch(e){ console.error("storage set failed", e); return null; }
  }

  async function sDelete(key){
    try{
      if(backend === "native"){ return await window.storage.delete(key, false); }
      if(backend === "idb"){
        const db = await getIDB();
        return await new Promise((resolve,reject)=>{
          const tx = db.transaction("kv","readwrite");
          tx.objectStore("kv").delete(key);
          tx.oncomplete = ()=> resolve(true);
          tx.onerror = ()=> reject(tx.error);
        });
      }
      memStore.delete(key);
      return true;
    }catch(e){ return null; }
  }

  async function sList(prefix){
    try{
      if(backend === "native"){
        const r = await window.storage.list(prefix, false);
        return r ? r.keys : [];
      }
      if(backend === "idb"){
        const db = await getIDB();
        return await new Promise((resolve,reject)=>{
          const tx = db.transaction("kv","readonly");
          const store = tx.objectStore("kv");
          const range = prefix ? IDBKeyRange.bound(prefix, prefix + "\uffff") : undefined;
          const keys = [];
          const req = store.openKeyCursor(range);
          req.onsuccess = (e)=>{
            const cur = e.target.result;
            if(cur){ keys.push(cur.key); cur.continue(); }
            else resolve(keys);
          };
          req.onerror = ()=> reject(req.error);
        });
      }
      const keys = [];
      memStore.forEach((v,k)=>{ if(!prefix || k.indexOf(prefix)===0) keys.push(k); });
      return keys;
    }catch(e){ return []; }
  }

  function computeProgress(insp){
    let done = 0, total = 0;
    insp.categories.forEach(cat=>{
      cat.locations.forEach(loc=>{
        loc.items.forEach(it=>{
          total++;
          if(it.result) done++;
        });
      });
    });
    return {done, total, pct: total ? Math.round(done/total*100) : 0};
  }

  function categoryProgress(cat){
    let done=0, total=0;
    cat.locations.forEach(loc=>{
      loc.items.forEach(it=>{ total++; if(it.result) done++; });
    });
    return {done, total};
  }

  function updateIndexEntry(insp){

    const entry = {id:insp.id, siteName:insp.siteName, date:insp.date, endDate:insp.endDate||insp.date, inspector:insp.inspector, done:p.done, total:p.total, createdAt: insp.createdAt, inspType: insp.inspType||"성능"};
    if(idx>=0) indexList[idx] = entry; else indexList.unshift(entry);
  }

  // 동료 사진 병합 (내게 없는 사진 키 추가)
  function mergePhotos(mine, theirs){
    theirs.categories.forEach(theirCat=>{
      const myCat = mine.categories.find(c=>c.id===theirCat.id);
      if(!myCat) return;
      theirCat.locations.forEach(theirLoc=>{
        const myLoc = myCat.locations.find(l=>l.id===theirLoc.id);
        if(!myLoc) return;
        // 위치 사진 병합
        (theirLoc.photos||[]).forEach(key=>{
          if(!(myLoc.photos||[]).includes(key)){
            if(!myLoc.photos) myLoc.photos = [];
            myLoc.photos.push(key);
          }
        });
      });
    });
  }

  // 동료 데이터 병합: 내게 없는 설비/위치/항목은 추가, 있으면 빈 값 채우기
  function mergeInspectionData(mine, theirs){
    const clone = o => JSON.parse(JSON.stringify(o));
    theirs.categories.forEach(theirCat=>{
      let myCat = mine.categories.find(c=>c.id===theirCat.id);
      if(!myCat){
        // 내게 없는 설비 → 통째로 추가
        mine.categories.push(clone(theirCat));
        return;
      }
      theirCat.locations.forEach(theirLoc=>{
        let myLoc = myCat.locations.find(l=>l.id===theirLoc.id);
        if(!myLoc){
          // 내게 없는 위치 → 통째로 추가 (사진 키 포함)
          myCat.locations.push(clone(theirLoc));
          return;
        }
        // 항목 병합
        (theirLoc.items||[]).forEach(theirIt=>{
          const myIt = myLoc.items.find(i=>i.id===theirIt.id);
          if(!myIt){
            // 내게 없는 항목 → 추가
            myLoc.items.push(clone(theirIt));
            return;
          }
          if(!myIt.result && theirIt.result) myIt.result = theirIt.result;
          if(!myIt.value  && theirIt.value)  myIt.value  = theirIt.value;
          if(!myIt.note   && theirIt.note)   myIt.note   = theirIt.note;
        });
        // 위치 사진 병합
        (theirLoc.photos||[]).forEach(key=>{
          if(!myLoc.photos) myLoc.photos = [];
          if(!myLoc.photos.includes(key)) myLoc.photos.push(key);
        });
        // 동산보드 재합성 메타 병합
        if(theirLoc.photoMeta){
          if(!myLoc.photoMeta) myLoc.photoMeta = {};
          Object.keys(theirLoc.photoMeta).forEach(k=>{
            if(!myLoc.photoMeta[k]) myLoc.photoMeta[k] = theirLoc.photoMeta[k];
          });
        }
      });
    });
    // 건물 구조 정보도 병합 (있으면)
    if(theirs.siteStructure && theirs.siteStructure.buildings){
      if(!mine.siteStructure) mine.siteStructure = { buildings: [] };
      if(!mine.siteStructure.buildings) mine.siteStructure.buildings = [];
      theirs.siteStructure.buildings.forEach(b=>{
        if(!mine.siteStructure.buildings.some(mb=> JSON.stringify(mb)===JSON.stringify(b))){
          mine.siteStructure.buildings.push(JSON.parse(JSON.stringify(b)));
        }
      });
    }
  }

  /* ============================================================
     📊 엑셀 유지보수점검결과표 → 앱 자동입력 모듈
     - 첨부하신 "유지보수점검결과표" 양식(시트별 설비 1종)을 그대로 읽어
       카테고리(설비) / 위치 / 점검항목 / 점검결과(O·X·-) / 비고 / 특이사항 자동 생성
     - 시트 안에 좌·우 2개 블록(점검표 2장)이 있으면 위치 2개로 분리
     - ExcelJS(이미 로드됨) 사용, 서버 전송 없음(전부 브라우저에서 처리)
  ============================================================ */

  /* 셀 값 → 문자열 */
  function xlText(v){
    if(v===null || v===undefined) return "";
    if(typeof v === "string") return v.trim();
    if(typeof v === "number") return String(v);
    if(typeof v === "boolean") return v ? "O" : "";
    if(v instanceof Date) return v.toISOString().slice(0,10);
    if(typeof v === "object"){
      if(Array.isArray(v.richText)) return v.richText.map(t=>t.text||"").join("").trim();
      if(v.result !== undefined) return xlText(v.result);
      if(v.text !== undefined) return String(v.text).trim();
      if(v.formula !== undefined) return "";
      if(v.hyperlink !== undefined) return String(v.hyperlink).trim();
    }
    return String(v).trim();
  }
  /* 비교용 정규화(공백·가운뎃점 제거) */
  function xlNorm(s){ return String(s||"").replace(/\(추가\)/g,"").replace(/[\s·∙・.,]/g,"").toLowerCase(); }
  function xlClean(s){ return String(s||"").replace(/\s*\r?\n\s*/g," ").replace(/\s{2,}/g," ").trim(); }

  /* 점검결과 기호 → 앱 값 */
  function xlResult(s){
    const t = String(s||"").trim().toUpperCase();
    if(!t) return "";
    if(["O","0","○","◯","ㅇ","V","√","적합","양호"].indexOf(t)>=0) return "양호";
    if(["X","×","✕","✖","부적합","불량"].indexOf(t)>=0) return "불량";
    if(["-","–","—","N/A","NA","해당없음"].indexOf(t)>=0) return "해당없음";
    return "";
  }

  /* 템플릿(유지보수·성능)에서 판정기준/측정값 여부 가져오기 */
  let _xlStdMap = null;
  function xlStdMap(){
    if(_xlStdMap) return _xlStdMap;
    const m = new Map();
    [].concat(tplMaint(), tpl()).forEach(c=>{
      (c.items||[]).forEach(it=>{
        const k1 = xlNorm(c.name)+"|"+xlNorm(it.name);
        if(!m.has(k1)) m.set(k1, it);
        const k2 = "*|"+xlNorm(it.name);
        if(!m.has(k2)) m.set(k2, it);
      });
    });
    _xlStdMap = m;
    return m;
  }
  function xlInferStd(name){
    if(/접지저항/.test(name))            return {std:"10Ω 이하", hasValue:true, unit:"Ω"};
    if(/산소|가스\s*발생/.test(name))     return {std:"산소 18% 이상", hasValue:true, unit:"%"};
    if(/전원\s*측정|입력\s*전원/.test(name)) return {std:"AC 220V±10%, DC 정격±1%", hasValue:true, unit:"V"};
    if(/전계강도/.test(name))            return {std:"65dBμV/m 이상", hasValue:true, unit:"dBµV/m"};
    if(/레벨/.test(name))                return {std:"57~80dBμV", hasValue:true, unit:"dBµV"};
    if(/수신감도|RSRP/i.test(name))      return {std:"-95dBm 이상", hasValue:true, unit:"dBm"};
    if(/측정/.test(name))                return {std:"", hasValue:true, unit:""};
    return {std:"이상 없음", hasValue:false, unit:""};
  }
  function xlItemMeta(catName, itemName){
    const m = xlStdMap();
    const hit = m.get(xlNorm(catName)+"|"+xlNorm(itemName)) || m.get("*|"+xlNorm(itemName));
    if(hit) return {std: hit.std||"", hasValue: !!hit.hasValue, unit: hit.unit||""};
    return xlInferStd(itemName);
  }

  /* 워크북 파싱 → [{id,name,locations:[{name,memo,items:[…]}]}] */
  function xlParseWorkbook(wb){
    const tplAll = tplMaint();
    const cats = [];
    let extraSeq = 0;
    let firstInspector = "";
    const skipped = [];

    wb.eachSheet(function(ws){
      const maxC = Math.max(ws.columnCount || 0, 13);
      const maxR = Math.max(ws.rowCount || 0, 90);

      /* 1) 머리글 행 + 블록 시작열 찾기 ("점검항목") */
      let headerRow = 0; const starts = [];
      for(let r=1; r<=Math.min(maxR,25) && !headerRow; r++){
        for(let c=1; c<=maxC; c++){
          if(xlText(ws.getCell(r,c).value) === "점검항목"){ headerRow = r; starts.push(c); }
        }
      }
      if(!headerRow || !starts.length){ skipped.push(ws.name); return; }

      /* 2) 설비명(제목행) */
      let title = "";
      for(let r=1; r<headerRow; r++){
        const t = xlText(ws.getCell(r, starts[0]).value);
        if(t.indexOf("점검표") >= 0){ title = t; break; }
      }
      let catName = xlClean(title.replace(/유지보수[\s\S]*$/, "")) || xlClean(ws.name);
      const hit = tplAll.find(c => xlNorm(c.name) === xlNorm(catName));
      const catId   = hit ? hit.id : ("x" + (++extraSeq) + "_" + xlNorm(catName).slice(0,8));
      const catDisp = hit ? hit.name : catName;

      const locations = [];

      /* 3) 블록별 파싱 */
      starts.forEach(function(s, bi){
        const e = (bi+1 < starts.length) ? starts[bi+1]-1 : maxC;

        let contentCol=0, resultCol=0, noteCol=0;
        for(let c=s+1; c<=e; c++){
          const t = xlText(ws.getCell(headerRow, c).value);
          if(!contentCol && t.indexOf("점검내용") >= 0) contentCol = c;
          if(!resultCol  && t.indexOf("점검결과") >= 0) resultCol  = c;
          if(!noteCol    && t.indexOf("비고")     >= 0) noteCol    = c;
        }
        if(!contentCol) return;

        /* 점검자 / 설치위치 / 설치업체 */
        let inspector="", locName="", vendor="";
        for(let r=1; r<headerRow; r++){
          for(let c=s; c<=e; c++){
            const t = xlText(ws.getCell(r,c).value);
            if(t==="점검자"   && !inspector) inspector = xlText(ws.getCell(r,c+1).value);
            if(t==="설치위치" && !locName)   locName   = xlText(ws.getCell(r,c+1).value);
            if(t==="설치업체" && !vendor)    vendor    = xlText(ws.getCell(r,c+1).value);
          }
        }
        if(inspector && !firstInspector) firstInspector = inspector;

        /* 점검항목 행 */
        const items = [];
        for(let r=headerRow+1; r<=maxR; r++){
          const g = xlText(ws.getCell(r,s).value);
          if(g==="작성방법" || g==="특이사항" || g.indexOf("점검사진")>=0) break;
          const nm = xlClean(xlText(ws.getCell(r,contentCol).value));
          if(!nm || nm==="점검내용") continue;
          const note = xlClean(noteCol ? xlText(ws.getCell(r,noteCol).value) : "");
          const res  = xlResult(resultCol ? xlText(ws.getCell(r,resultCol).value) : "");
          const meta = xlItemMeta(catDisp, nm);
          let val = "";
          if(meta.hasValue && note){
            let mm = null;
            if(meta.unit){
              const u = meta.unit.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              mm = note.match(new RegExp("(-?\\d+(?:\\.\\d+)?)\\s*" + u));
            }
            if(!mm) mm = note.match(/(-?\d+(?:\.\d+)?)/);
            if(mm) val = mm[1];
          }
          items.push({
            id: uid(), name: nm, std: meta.std, hasValue: meta.hasValue, unit: meta.unit,
            result: res, value: val, note: note, photos: []
          });
        }
        if(!items.length) return;

        /* 특이사항 → 위치 메모 */
        let memo = "";
        for(let r=headerRow+1; r<=maxR; r++){
          if(xlText(ws.getCell(r,s).value) === "특이사항"){
            for(let rr=r+1; rr<=Math.min(maxR, r+4); rr++){
              const t = xlText(ws.getCell(rr,s).value);
              if(t){ memo = t; break; }
            }
            break;
          }
        }

        const vendorOk = vendor && !/확인불가|미상|해당없음|없음/.test(vendor);
        locations.push({
          id: uid(),
          name: xlClean(locName) + (vendorOk ? " / " + xlClean(vendor) : ""),
          memo: memo, photos: [], selectedPhotos: [], items: items,
          _block: bi, _imgIds: []
        });
      });

      if(!locations.length){ skipped.push(ws.name); return; }

      /* 4) 시트에 삽입된 점검사진 → 좌/우 블록별 위치에 배분 (행→열 순서 유지) */
      let sheetImgs = [];
      try{ sheetImgs = (typeof ws.getImages === "function") ? (ws.getImages() || []) : []; }catch(e){ sheetImgs = []; }
      sheetImgs.map(function(im){
        const tl = (im.range && im.range.tl) ? im.range.tl : null;
        return {
          id: im.imageId,
          row: tl ? (tl.nativeRow|0) : 0,
          col: tl ? ((tl.nativeCol|0) + 1) : 1
        };
      }).sort(function(a,b){ return (a.row-b.row) || (a.col-b.col); })
        .forEach(function(g){
          let bi = 0;
          for(let k=0; k<starts.length; k++){ if(g.col >= starts[k]) bi = k; }
          const loc = locations.find(l=>l._block===bi) || locations[0];
          if(loc) loc._imgIds.push(g.id);
        });

      cats.push({ id: catId, name: catDisp, locations: locations, _sheet: ws.name, _matched: !!hit });
    });

    return { categories: cats, inspector: firstInspector, skipped: skipped };
  }

  /* ── 엑셀 가져오기 시트(UI) ── */
  function openExcelImportSheet(){

        <label style="display:block;width:100%;background:var(--accent-weak);border:2px dashed var(--accent);border-radius:10px;padding:20px;text-align:center;font-size:15px;color:var(--accent);font-weight:700;cursor:pointer;margin-bottom:14px;">
          📂 엑셀 파일 선택
          <input type="file" id="xl-file" accept=".xlsx,.xlsm,.xltx,.xltm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12" style="display:none;">
        </label>
        <div id="xl-stage2" style="display:none;">
          <div id="xl-summary" style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;max-height:34vh;overflow:auto;font-size:12.5px;line-height:1.7;"></div>
          <label class="field-label">현장명</label>
          <input class="text-input" id="xl-site" placeholder="예) 신송식품">
          <label class="field-label" style="margin-top:8px;">건물명</label>
          <input class="text-input" id="xl-building" placeholder="예) 센터빌딩">
          <label class="field-label" style="margin-top:8px;">점검일</label>
          <input class="text-input" type="date" id="xl-date">
          <label class="field-label" style="margin-top:8px;">점검자</label>
          <input class="text-input" id="xl-inspector" placeholder="점검자명">
          <button class="primary-btn" id="xl-create" style="width:100%;margin-top:14px;">✅ 점검 생성하기</button>
        </div>
        <button class="outline-btn" id="xl-cancel" style="width:100%;margin-top:8px;">닫기</button>
      </div>`;
    document.body.appendChild(ov);
    ov.addEventListener("click", e=>{ if(e.target===ov) ov.remove(); });
    document.getElementById("xl-cancel").addEventListener("click", ()=> ov.remove());

    const prog = document.getElementById("xl-prog");
    let parsed = null, parsedWb = null;

    document.getElementById("xl-file").addEventListener("change", async (ev)=>{
      const file = ev.target.files[0];
      if(!file) return;
      const fname = (file.name||"").toLowerCase();
      if(/\.xlsb$/.test(fname)){
        prog.textContent = "⚠ .xlsb(바이너리)는 읽을 수 없습니다. 엑셀에서 .xlsm 또는 .xlsx로 저장 후 다시 시도하세요.";
        return;
      }
      if(/\.(xls|csv)$/.test(fname)){
        prog.textContent = "⚠ 구버전 .xls / .csv는 지원되지 않습니다. .xlsx 또는 .xlsm으로 저장 후 시도하세요.";
        return;
      }
      const isMacro = /\.(xlsm|xltm)$/.test(fname);
      prog.textContent = isMacro ? "매크로 통합문서 읽는 중… (매크로는 실행하지 않습니다)" : "엑셀 읽는 중…";
      try{
        if(!window.ExcelJS) throw new Error("ExcelJS 로드 실패 (인터넷 연결 확인)");
        const buf = await file.arrayBuffer();
        const wb = new ExcelJS.Workbook();
        try{
          await wb.xlsx.load(buf);
        }catch(le){
          throw new Error("엑셀 파일을 열 수 없습니다 (" + (le.message||"형식 오류") + "). 엑셀에서 [다른 이름으로 저장 → .xlsx]로 다시 저장 후 시도해 보세요.");
        }
        let shTotal = 0; wb.eachSheet(()=>{ shTotal++; });
        if(!shTotal) throw new Error("시트를 찾을 수 없습니다.");
        parsed = xlParseWorkbook(wb);
        parsedWb = wb;
        if(!parsed.categories.length){
          prog.textContent = `인식 가능한 점검표 시트가 없습니다. (시트 ${shTotal}개 확인) — "점검항목" 머리글이 있는 양식인지 확인해 주세요.`;
          return;
        }

        let itemCnt = 0, badCnt = 0, imgCnt = 0;
        parsed.categories.forEach(c=> c.locations.forEach(l=>{
          imgCnt += (l._imgIds||[]).length;
          l.items.forEach(it=>{ itemCnt++; if(it.result==="불량") badCnt++; });
        }));
        prog.textContent = `설비 ${parsed.categories.length}종 · 항목 ${itemCnt}개 · 사진 ${imgCnt}장 인식 (부적합 ${badCnt}건)`;

        document.getElementById("xl-summary").innerHTML = parsed.categories.map(c=>{
          const n = c.locations.reduce((a,l)=>a+l.items.length,0);
          const b = c.locations.reduce((a,l)=>a+l.items.filter(i=>i.result==="불량").length,0);
          const p = c.locations.reduce((a,l)=>a+(l._imgIds||[]).length,0);
          return `<div style="padding:4px 0;border-bottom:1px dashed var(--border);">
            <b>${c._matched?"✅":"➕"} ${c.name}</b>
            <span style="color:var(--muted);"> · 위치 ${c.locations.length} · 항목 ${n} · 📷 ${p}</span>
            ${b?`<span style="color:#CC0000;font-weight:700;"> · 부적합 ${b}</span>`:""}
            <div style="color:var(--muted);font-size:11.5px;">${c.locations.map(l=>(l.name||"(위치 미상)")+" 📷"+(l._imgIds||[]).length).join(" / ")}</div>
          </div>`;
        }).join("") + (parsed.skipped.length ? `<div style="color:var(--muted);padding-top:6px;">건너뛴 시트: ${parsed.skipped.join(", ")}</div>` : "");

        // 파일명에서 현장/건물 추정
        const base = file.name.replace(/\.[^.]+$/,"");
        const guess = (base.match(/[가-힣A-Za-z0-9]{2,}/g)||[]).filter(t=>!/유지보수|점검결과표|송부본|본사|^v?\d+$/i.test(t));
        document.getElementById("xl-site").value = guess[0] || "";
        document.getElementById("xl-building").value = (guess.find(t=>/빌딩|동|타워|센터/.test(t)) || "");
        document.getElementById("xl-date").value = todayStr();
        document.getElementById("xl-inspector").value = parsed.inspector || (await sGet("last-inspector", false)) || "";
        document.getElementById("xl-stage2").style.display = "block";
      }catch(err){ prog.textContent = "오류: " + err.message; }
    });

    /* 엑셀 내장 이미지(Uint8Array) → 압축 dataURL */
    async function xlImgToDataUrl(media){
      const ext = (media.extension || "png").toLowerCase();
      const mime = (ext==="jpg" || ext==="jpeg") ? "image/jpeg"
                 : (ext==="png") ? "image/png"
                 : (ext==="gif") ? "image/gif" : "image/jpeg";
      const blob = new Blob([media.buffer], { type: mime });
      try{ return await compressImage(blob, 900, 0.6); }
      catch(e){ return await readAsDataURL(blob); }
    }

    document.getElementById("xl-create").addEventListener("click", async ()=>{
      if(!parsed) return;
      const site = document.getElementById("xl-site").value.trim();
      if(!site){ document.getElementById("xl-site").focus(); showToast("현장명을 입력해주세요."); return; }
      const btn = document.getElementById("xl-create");
      btn.disabled = true; btn.textContent = "처리 중…";
      const inspector = document.getElementById("xl-inspector").value.trim();
      if(inspector) await sSet("last-inspector", inspector);
      const insp = {
        id: uid(),
        siteName: site,
        buildingName: document.getElementById("xl-building").value.trim(),
        lastDetailLocation: "",
        date: document.getElementById("xl-date").value || todayStr(),
        inspector: inspector,
        inspType: (currentMode === "유지보수2") ? "유지보수2" : "유지보수",
        createdAt: Date.now(),
        siteStructure: { buildings: [] },
        categories: parsed.categories.map(c=>({ id:c.id, name:c.name, locations:c.locations }))
      };

      /* ── 시트에 삽입된 점검사진 저장 ── */
      let ptot = 0, pdone = 0, pfail = 0;
      insp.categories.forEach(c=> c.locations.forEach(l=> ptot += (l._imgIds||[]).length));
      if(ptot) prog.textContent = `사진 저장 중… (0/${ptot})`;
      for(const c of insp.categories){
        for(const l of c.locations){
          if(!l.photos) l.photos = [];
          for(const imgId of (l._imgIds||[])){
            try{
              const media = parsedWb ? parsedWb.getImage(Number(imgId)) : null;
              if(!media || !media.buffer){ pfail++; continue; }
              const dataUrl = await xlImgToDataUrl(media);
              if(!dataUrl){ pfail++; continue; }
              const key = "photo:"+insp.id+":cat:"+c.id+":loc:"+l.id+":"+uid();
              const saved = await sSet(key, dataUrl);
              if(!saved){ pfail++; continue; }
              const verify = await sGet(key);
              if(!verify){ await sDelete(key); pfail++; continue; }
              l.photos.push(key);
              pdone++;
            }catch(e){ pfail++; }
            prog.textContent = `사진 저장 중… (${pdone}/${ptot})`;
          }
          delete l._imgIds; delete l._block;
        }
        delete c._sheet; delete c._matched;
      }

      await sSet("inspection:"+insp.id, JSON.stringify(insp));
      updateIndexEntry(insp);
      await saveIndex();
      ov.remove();
      currentMode = insp.inspType;
      showNewForm = false; newFormStep = 1; newFormData = {};
      openInspection(insp.id);
      showToast(`엑셀 자동 입력 완료! 사진 ${pdone}장` + (pfail?` (실패 ${pfail}장)`:""));
    });
  }

  function buildEquipGrid(){
    const cats = tpl();   // 34종 (성능 기준 = 전체 목록)
    const cells = cats.map(c=>{
      const ic = EQUIP_ICONS[c.id] || "";
      return `<button class="eq-cell" data-eqid="${c.id}" type="button">
        <span class="eq-ic"><img src="${ic}" alt="" loading="lazy"></span>
        <span class="eq-nm">${escapeHtml(c.name)}</span>
      </button>`;
    }).join("");
    return `<div class="eq-wrap">
      <div class="eq-head"><h3>정보통신설비 34종</h3>
        <p>아이콘을 누르면 설명이 나옵니다</p></div>
      <div class="eq-grid">${cells}</div></div>`;
  }
  // 설비 설명 팝업
  function showEquipInfo(eqid){
    const cats = tpl();
    const cat = cats.find(c=>c.id===eqid);
    if(!cat) return;
    const ic = EQUIP_ICONS[eqid] || "";
    const desc = EQUIP_DESC[eqid] || "";
    const itemCount = (cat.items||[]).length;
    const idx = cats.findIndex(c=>c.id===eqid) + 1;
    const ov = document.createElement("div");
    ov.className = "eq-modal-ov";
    ov.innerHTML = `<div class="eq-modal">
      <button class="eq-modal-x" type="button">✕</button>
      <div class="eq-modal-ic"><img src="${ic}" alt=""></div>
      <div class="eq-modal-no">${idx} / 34</div>
      <div class="eq-modal-nm">${escapeHtml(cat.name)}</div>
      <div class="eq-modal-desc">${escapeHtml(desc)}</div>
      <div class="eq-modal-meta">점검 항목 ${itemCount}개</div>
    </div>`;
    document.body.appendChild(ov);
    const close = ()=> ov.remove();
    ov.addEventListener("click", e=>{ if(e.target===ov) close(); });
    ov.querySelector(".eq-modal-x").addEventListener("click", close);
  }

  function buildTimeline(list){
    if(!list || !list.length) return "";
    const YEAR = new Date().getFullYear();
    const today = new Date();
    // 하루를 연중 위치(0~100%)로 — 실제 일수 기준(윤년 무관, 366 상한)
    const dayPct = dt => {
      const start = new Date(dt.getFullYear(), 0, 1);
      const diff = (dt - start) / 86400000;         // 1월 1일부터의 경과 일수
      return Math.max(0, Math.min(100, diff / 366 * 100));
    };
    const rows = list
      .map(e=>{
        const sd = e.date ? new Date(e.date) : null;
        const ed = e.endDate ? new Date(e.endDate) : sd;   // 마감일 없으면 시작일과 동일(구버전 호환)
        return { e, sd, ed, valid: sd && !isNaN(sd) && sd.getFullYear()===YEAR };
      })
      .filter(r=>r.valid)
      .sort((a,b)=> a.sd - b.sd);
    if(!rows.length){
      return `<div class="tl-wrap"><div class="tl-head"><h4>\uD83D\uDCC5 점검 타임라인</h4>
        <p>올해(${YEAR}년) 점검일이 입력된 항목이 없습니다.</p></div></div>`;
    }
    const todayLeft = (today.getFullYear()===YEAR) ? dayPct(today) : null;
    const months = Array.from({length:12}, (_,i)=>`<span class="tl-m">${i+1}월</span>`).join("");
    const fmt = dt => `${dt.getMonth()+1}/${dt.getDate()}`;
    const bars = rows.map(({e,sd,ed})=>{
      const pct = e.total ? Math.round(e.done/e.total*100) : 0;
      const mi  = MODE_INFO[e.inspType] || MODE_INFO['성능'];
      const col = pct>=100 ? 'var(--good)' : pct>0 ? 'var(--accent)' : 'var(--muted-weak)';
      const endD = (ed && !isNaN(ed) && ed>=sd) ? ed : sd;
      const left = dayPct(sd);
      const right = dayPct(endD);
      const w = Math.max(2.2, right - left);          // 하루짜리도 보이도록 최소 폭
      const single = fmt(sd) === fmt(endD);
      const label  = single ? fmt(sd) : `${fmt(sd)} ~ ${fmt(endD)}`;
      return `<div class="tl-row">
        <div class="tl-site"><b>${escapeHtml(e.siteName)}</b>
          <small>${escapeHtml(e.inspector||"")} · ${mi.icon}</small></div>
        <div class="tl-lane">
          <div class="tl-bar" style="left:${left}%;width:${w}%;background:${col};" title="${escapeHtml(e.siteName)} · ${label} · ${pct}%"><span class="tl-barlabel">${pct}%</span></div>
          <div class="tl-daterange" style="left:${left}%;">${label}</div>
          ${todayLeft!==null ? `<div class="tl-today" style="left:${todayLeft}%;"></div>` : ""}
        </div></div>`;
    }).join("");
    return `<div class="tl-wrap">
      <div class="tl-head"><h4>\uD83D\uDCC5 점검 타임라인</h4>
        <p>${rows.length}개 현장 · ${YEAR}년 · 오늘 ${today.toISOString().slice(0,10)}</p></div>
      <div class="tl-grid">
        <div class="tl-months"><span class="tl-corner">현장</span>${months}</div>
        ${bars}
      </div></div>`;
  }

  async function onCreateInspection(){
    const site = newFormData.site || "";
    if(!site){ return; }
    const date = newFormData.date || todayStr();
    const endDate = newFormData.endDate || date;
    const building = newFormData.building || "";
    const inspector = newFormData.inspector || "";
    if(inspector) await sSet("last-inspector", inspector);

    const selected = newFormData.selectedEquip || new Set(tpl().map(c=>c.name));
    if(selected.size === 0){
      showToast("설비를 하나 이상 선택해주세요.");
      return;
    }

    const insp = {
      id: uid(),
      siteName: site,
      buildingName: building,
      lastDetailLocation: "",
      date: date,
      endDate: endDate,
      inspector: inspector,
      inspType: newFormData.inspType || "성능",
      createdAt: Date.now(),
      categories: tplByType(newFormData.inspType||"성능")
        .filter(c => selected.has(c.name))
        .map(c=>({
          id: c.id, name: c.name,
          locations: [{
            id: uid(), name: "", photos: [],
            items: c.items.map(it=>({
              id: uid(), name: it.name, std: it.std, hasValue: it.hasValue, unit: it.unit||"",
              fields: it.fields ? JSON.parse(JSON.stringify(it.fields)) : undefined, delta: it.delta,
              result: "", value: "", vals: {}, note: "", photos: []
            }))
          }]
        }))
    };
    await sSet("inspection:"+insp.id, JSON.stringify(insp));
    updateIndexEntry(insp);
    await saveIndex();
    showNewForm = false;
    newFormStep = 1;
    newFormData = {};
    openInspection(insp.id);
  }

  async function deleteInspection(id){
    const photoKeys = await sList("photo:"+id+":", false);
    for(const k of photoKeys){ await sDelete(k, false); }
    await sDelete("inspection:"+id, false);
    indexList = indexList.filter(e=>e.id!==id);
    await saveIndex();
    deleteConfirmId = null;
    renderList();
  }

  /* ============ Detail view ============ */
  let openCategoryIds = new Set();
  let openGroupKeys = new Set();   // 펼쳐진 설비 대분류(통신/방송/정보/기타). 비어있음 = 전체 접힘(기본)
  let activeCatId = null;          // 드릴인(설비 점검 항목 화면) 대상 설비 id. null = 목록(그리드) 화면
  let addingItemFor = null;
  let addingCategory = false;
  let addingLocationFor = null;
  let renamingLocId = null;
  let noteOpenItems = new Set();
  let detailMode = "check"; // "check" | "photo"
  const activeLocIds = {}; // catId → locId (which tab is active)

  function migrateInspection(insp){
    insp.categories.forEach(cat=>{
      if(!cat.locations){
        cat.locations = [{ id: uid(), name: "", items: cat.items || [], photos: [] }];
        delete cat.items;
      }
      // Migrate old cat-level photos to first location
      cat.locations.forEach((loc, idx)=>{
        if(!loc.photos){
          loc.photos = (idx===0 && cat.photos) ? cat.photos : [];
        }
      });
      delete cat.photos;
    });
    if(typeof insp.buildingName === "undefined") insp.buildingName = "";
    if(typeof insp.lastDetailLocation === "undefined") insp.lastDetailLocation = "";
    if(!insp.inspType) insp.inspType = "성능";
    if(!insp.siteStructure) insp.siteStructure = { buildings: [] };
    // 성능점검: 케이블·배관·단자함 환경 항목 명칭 변경 (기존 점검 데이터 반영)
    // 유지보수점검은 공식 점검표 표기이므로 건드리지 않는다.
    if(insp.inspType !== "유지보수" && insp.inspType !== "유지보수2"){
      insp.categories.forEach(cat=>{
        if(["c1","c2","c4"].indexOf(cat.id) < 0) return;
        (cat.locations||[]).forEach(loc=>{
          (loc.items||[]).forEach(it=>{
            if(it.name === "습도 및 온도 조절을 위한 환기 상태 확인"){
              it.name = "설치 환경 확인(습도, 온도)";
              if(it.std === "환기 정상, 온도 18~27℃, 습도 40~60%RH") it.std = "온도 18~27℃, 습도 40~60%RH";
            }
          });
        });
      });
      // 성능점검: 추가 점검항목에 (추가) 접두어 부여 + 접지저항 측정 바로 아래로 재배치
      // (원본 item 객체를 그대로 재정렬하므로 결과·사진·측정값은 보존됨. 재실행해도 안전)
      (function(){
        const _ADD = ["설치 환경 확인(습도, 온도)","설비 설치 공간의 조명설비 동작 여부 확인","이상 발열 상태 확인(열화상 카메라)","이상 소음 상태 확인(소음측정기)"];
        const _PFX = "(추가) ";
        const _base = n => (n && n.indexOf(_PFX)===0) ? n.slice(_PFX.length) : n;
        const _isAdd = it => it && _ADD.indexOf(_base(it.name)) >= 0;
        insp.categories.forEach(cat=>{
          (cat.locations||[]).forEach(loc=>{
            const its = loc.items || [];
            if(!its.length) return;
            // 1) 접두어 부여 (중복 방지)
            its.forEach(it=>{ if(_isAdd(it) && (it.name||"").indexOf(_PFX)!==0) it.name = _PFX + it.name; });
            // 2) 접지저항 측정 바로 아래로 재배치 (없으면 맨 끝)
            const added = _ADD.map(base => its.find(it => _base(it.name)===base)).filter(Boolean);
            if(added.length){
              const nonAdd = its.filter(it => !_isAdd(it));
              const gi = nonAdd.findIndex(it => (it.name||"").indexOf("접지저항")>=0);
              loc.items = gi>=0 ? nonAdd.slice(0,gi+1).concat(added, nonAdd.slice(gi+1)) : nonAdd.concat(added);
            }
          });
        });
      })();
    }
    return insp;
  }

  async function openInspection(id){
    const raw = await sGet("inspection:"+id, false);
    if(!raw) return;
    current = migrateInspection(JSON.parse(raw));
    openCategoryIds = new Set();
    openGroupKeys = new Set();
    activeCatId = null;
    addingItemFor = null; addingCategory = false; addingLocationFor = null; renamingLocId = null; noteOpenItems = new Set();
    deleteConfirmId = null;
