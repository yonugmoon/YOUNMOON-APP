<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AR 설비점검 · 1차 휴대폰형 AI안경</title>
<!-- 오프라인 동작을 위해 라이브러리를 저장소에 포함(lib/) -->
<script src="lib/jsQR.js"></script>
<script src="lib/qrcode.js"></script>
<style>
:root{
  --bg:#0b1220; --panel:#111a2e; --panel-2:#0e1626; --line:#1e2b45;
  --ink:#e8edf7; --ink-dim:#9fb0cc; --ink-faint:#64748b;
  --brand:#3bd6c6; --brand-2:#2a9df4; --warn:#f4b740; --bad:#f4685f; --good:#4ad991;
  --chip:#16233c; --shadow:0 8px 30px rgba(0,0,0,.35);
  --r:14px; --r-sm:10px;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.muted{color:var(--ink-dim)} .faint{color:var(--ink-faint)} .mono{font-family:var(--mono)}

header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0d1526,#0b1220);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo .dot{width:11px;height:11px;border-radius:3px;background:conic-gradient(from 210deg,var(--brand),var(--brand-2));box-shadow:0 0 14px var(--brand)}
.logo small{font-weight:600;color:var(--ink-dim);font-size:11px;letter-spacing:.06em}
.key-pill{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--chip);white-space:nowrap}
.key-pill.ok{color:var(--good);border-color:#1c3d33} .key-pill.no{color:var(--warn);border-color:#3d341c}

main{max-width:820px;margin:0 auto;padding:14px 16px 0}
.pages{display:none} .pages.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15.5px} .card-h .sub{margin-left:auto;font-size:12px;color:var(--ink-dim)}
.card-b{padding:14px 15px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.stat b{display:block;font-size:24px;font-family:var(--mono);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-dim)}
.bar-prog{height:8px;border-radius:8px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:var(--r-sm);background:var(--chip);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:44px}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04121a;border:none}
.btn.blue{background:#13325a;border-color:#1f4b80;color:#cfe5ff}
.btn.bad{background:#3a1a1a;border-color:#5a2626;color:#ffc9c4}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1}
.big-cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-cta .btn{min-height:76px;flex-direction:column;font-size:14px}
.big-cta .btn em{font-style:normal;font-size:24px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 15px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .ic{width:40px;height:40px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:20px;flex:none;overflow:hidden}
.item .ic img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.item .tx span{display:block;font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);border:1px solid var(--line);white-space:nowrap;flex:none}
.tag.good{color:var(--good);border-color:#1c3d33} .tag.warn{color:var(--warn);border-color:#3d341c} .tag.bad{color:var(--bad);border-color:#4a2222} .tag.blue{color:#8ec5ff;border-color:#1f4b80}
.empty{padding:28px 15px;text-align:center;color:var(--ink-faint);font-size:14px}

.inp{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);outline:none}
.inp:focus{border-color:var(--brand)}
label.f{display:block;margin-bottom:11px;font-size:12.5px;color:var(--ink-dim)}
label.f .inp{margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.note{font-size:13px;color:var(--ink-dim);background:var(--panel-2);border:1px dashed var(--line);padding:10px 12px;border-radius:var(--r-sm)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar .inp{flex:1}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--brand)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#0d1526;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 10px;font-size:11px;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:19px}
nav button.on{color:var(--brand)}
nav button.ar i{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04121a;width:44px;height:30px;border-radius:10px;display:grid;place-items:center}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:.2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;max-height:90vh;display:flex;flex-direction:column;transform:translateY(105%);transition:.25s;max-width:820px;margin:0 auto;border:1px solid var(--line)}
#sheet.on{transform:none}
#sheet .sh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
#sheet .sh h3{font-size:16px}
#sheet .sh button{margin-left:auto;font-size:22px;color:var(--ink-dim);width:40px;height:40px}
#sheetBody{overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#1a2742;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.good{border-color:#1c3d33;color:var(--good)} #toast.bad{border-color:#4a2222;color:var(--bad)}

/* ---------- 구조(트리) / 배치도 ---------- */
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-dim)}
.seg button.on{background:var(--chip);color:var(--brand)}
.tree details{border-top:1px solid var(--line)}
.tree summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 15px;cursor:pointer;font-weight:600;font-size:14.5px}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--ink-faint);transition:.15s;width:10px}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary .cnt{margin-left:auto;font-size:12px;color:var(--ink-dim);font-weight:500;display:flex;gap:6px;align-items:center}
.tree .lv1>summary{background:#0f1830}
.tree .lv2>summary{padding-left:30px;font-size:14px}
.tree .lv3>summary{padding-left:46px;font-size:13.5px}
.tree .tg{padding:6px 15px 2px 66px;font-size:12px;color:var(--ink-faint)}
.tree .item{padding-left:62px}
.mini-prog{width:46px;height:6px;border-radius:6px;background:var(--chip);overflow:hidden;display:inline-block}
.mini-prog i{display:block;height:100%;background:var(--good)}
.plan{position:relative;width:100%;aspect-ratio:4/3;background:#0a1222;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background-image:linear-gradient(#16233c 1px,transparent 1px),linear-gradient(90deg,#16233c 1px,transparent 1px);background-size:10% 10%;touch-action:none}
.plan .door{position:absolute;left:40%;width:20%;bottom:0;height:5px;background:var(--brand);border-radius:3px 3px 0 0}
.plan .door::after{content:"출입구 · 촬영 시작";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:10px;color:var(--brand);white-space:nowrap}
.pi{position:absolute;border:2px solid #4ad991;background:rgba(74,217,145,.14);border-radius:5px;font-size:9.5px;line-height:1.1;padding:1px 2px;letter-spacing:-.02em;overflow:hidden;
  color:#e8edf7;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all}
.pi.warn{border-color:#f4b740;background:rgba(244,183,64,.14)} .pi.bad{border-color:#f4685f;background:rgba(244,104,95,.16)}
.pi.new{border-style:dashed;border-color:#a78bfa;background:rgba(167,139,250,.16)} .pi.unk{border-color:#9fb0cc;background:rgba(159,176,204,.12)}
.pi.hl{box-shadow:0 0 0 3px #fff,0 0 18px #3bd6c6;z-index:3}
.pi.drag{opacity:.75;z-index:5}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);margin:8px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:2px solid}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .btn{min-height:32px;padding:4px 10px;font-size:12.5px}

/* ---------- 랙 실장도 ---------- */
.rk{border:2px solid #34425f;border-radius:8px;background:#0a1222;padding:4px;display:flex;flex-direction:column;gap:3px}
.rk .rkh{text-align:center;font-weight:800;font-size:13px;color:#cfd8ea;background:#1a2540;border-radius:5px;padding:4px}
.ru{border-radius:5px;padding:5px 8px;font-size:12.5px;line-height:1.3;background:#18233a;border:1px solid #2a3858;cursor:pointer;display:flex;gap:8px;align-items:center}
.ru .no{font-family:var(--mono);color:var(--ink-faint);font-size:11px;width:20px;flex:none}
.ru .tx{flex:1;min-width:0} .ru .tx b{font-size:12.5px} .ru .tx span{display:block;font-size:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ru.blank{background:repeating-linear-gradient(90deg,#141d30 0 6px,#101828 6px 12px);color:var(--ink-faint);border-style:dashed;cursor:default}
.ru.alarm{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.ru.add{box-shadow:inset 3px 0 0 var(--good)}
.ru .det{display:none;font-size:11.5px;color:var(--ink-dim);margin-top:4px}
.ru.open .det{display:block}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.thumbs img{height:64px;border-radius:6px;flex:none}

/* ---------- AR 화면 ---------- */
#ar{position:fixed;inset:0;z-index:100;background:#000;display:none;touch-action:manipulation}
#ar.on{display:block}
#arCanvas{position:absolute;inset:0;width:100%;height:100%}
#arVideo{display:none}
.ar-top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.ar-top .btn{white-space:nowrap;min-height:38px;padding:6px 11px;font-size:13px;background:rgba(17,26,46,.75);backdrop-filter:blur(6px)}
.ar-top .btn.on{border-color:var(--brand);color:var(--brand)}
.ar-top .sp{flex:1}
.ar-bottom{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);display:flex;flex-direction:column;gap:8px}
.ar-bottom .row .btn{background:rgba(17,26,46,.8);backdrop-filter:blur(6px);min-height:52px;font-size:15px}
.ar-bottom .row .btn.g{color:var(--good);border-color:#1c5a43}
.ar-bottom .row .btn.w{color:var(--warn);border-color:#5a4a1c}
.ar-bottom .row .btn.b{color:var(--bad);border-color:#5a2626}
.ar-bottom .row .btn.ai{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04121a;border:none}
#arExtra .btn{white-space:nowrap;font-size:13px;padding:6px 8px;min-height:44px}
#ar.glasses .ar-top, #ar.glasses .ar-bottom{display:none}
#ar.glasses.showctl .ar-top, #ar.glasses.showctl .ar-bottom{display:flex}
#ar.glasses .ar-top .hide-g{display:none}
#arHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--ink-dim);font-size:14px;text-align:center;pointer-events:none}

/* ---------- 인쇄(QR 라벨/보고서) ---------- */
#print{display:none}
@media print{
  @page{margin:8mm}
  body{background:#fff;color:#000;padding:0}
  header,main,nav,#sheet,#scrim,#toast,#ar{display:none!important}
  #print{display:block}
  .labels{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  .label{border:1px solid #000;border-radius:2mm;padding:3mm;display:flex;gap:3mm;align-items:center;break-inside:avoid;font-size:9pt}
  .label svg{width:26mm;height:26mm;flex:none}
  .label b{display:block;font-size:10pt}
  .rep h1{font-size:16pt;margin-bottom:4mm}
  .rep table{width:100%;border-collapse:collapse;font-size:10pt}
  .rep td,.rep th{border:1px solid #444;padding:2mm;text-align:left;vertical-align:top}
  .rep img{max-width:45mm;max-height:35mm}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo"><span class="dot"></span><div>AR 설비점검<br><small>1차 · 휴대폰형 AI안경</small></div></div>
    <button class="key-pill no" id="keyPill" onclick="ui.openSheet('settings')">API 키 없음</button>
  </div>
</header>

<main>
  <!-- 홈 -->
  <section class="pages on" id="page-home"></section>
  <!-- 설비(현행화) -->
  <section class="pages" id="page-equip"></section>
  <!-- 이력 -->
  <section class="pages" id="page-hist"></section>
  <!-- 설정 -->
  <section class="pages" id="page-set"></section>
</main>

<nav>
  <button data-tab="home" class="on" onclick="ui.tab('home')"><i>🏠</i>홈</button>
  <button data-tab="equip" onclick="ui.tab('equip')"><i>🗂️</i>설비 현행화</button>
  <button class="ar" onclick="AR.open()"><i>AR</i>AR 점검</button>
  <button data-tab="hist" onclick="ui.tab('hist')"><i>📋</i>점검 이력</button>
  <button data-tab="set" onclick="ui.tab('set')"><i>⚙️</i>설정</button>
</nav>

<div id="scrim" onclick="ui.closeSheet()"></div>
<div id="sheet"><div class="sh"><h3 id="sheetTitle"></h3><button onclick="ui.closeSheet()">×</button></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" capture="environment" hidden>
<input type="file" id="filePickAny" hidden>

<!-- AR 점검 화면 -->
<div id="ar">
  <video id="arVideo" playsinline muted autoplay></video>
  <canvas id="arCanvas"></canvas>
  <div id="arHint">카메라 준비 중…</div>
  <div class="ar-top">
    <button class="btn" onclick="AR.close()" title="닫기">✕</button>
    <button class="btn" id="btnSel" onclick="AR.toggleSel()">🎯 선택</button>
    <span class="sp"></span>
    <button class="btn" id="btnHere" onclick="ui.openSheet('here')">📍 위치</button>
    <button class="btn" id="btnLive" onclick="AR.toggleLive()">🧠 AI</button>
    <button class="btn" id="btnMic" onclick="AR.toggleVoice()">🎤</button>
    <button class="btn" id="btnTorch" onclick="AR.toggleTorch()">🔦</button>
    <button class="btn" id="btnGlasses" onclick="AR.toggleGlasses()">👓</button>
  </div>
  <div class="ar-bottom">
    <div class="row" id="arExtra"></div>
    <div class="row">
      <button class="btn" onclick="AR.prev()">◀</button>
      <button class="btn g" onclick="AR.mark('정상')">정상</button>
      <button class="btn w" onclick="AR.mark('주의')">주의</button>
      <button class="btn b" onclick="AR.mark('불량')">불량</button>
      <button class="btn" onclick="AR.next()">▶</button>
    </div>
    <div class="row">
      <button class="btn" onclick="AR.photo()">📷 촬영</button>
      <button class="btn blue" onclick="AR.survey()">📋 현황 등록</button>
      <button class="btn ai" onclick="AR.diagnose()">🤖 AI 진단</button>
    </div>
  </div>
</div>

<div id="print"></div>

<script>
"use strict";
/* ============================================================
   1. 설비 종류 / 기본 점검항목 (정보통신설비 기준)
   - 설정 > 점검항목 편집에서 종류별로 바꿀 수 있음
   ============================================================ */
const TYPES = {
  rack:      {name:"통신랙/서버랙",   ic:"🗄️", checks:["랙 외관·도어 잠금 상태","케이블 정리·라벨 부착","팬/환기 동작 및 이물질","장비 LED 경보 유무","접지선 체결 상태"]},
  transport: {name:"전송/광단국 장비", ic:"📡", checks:["전원·알람 LED 상태","광 커넥터 청결·체결","광 케이블 곡률·손상","포트 라벨 부착","팬 필터 오염"]},
  ups:       {name:"UPS",             ic:"🔋", checks:["운전상태 표시(정상/바이패스)","입력·출력 전압 및 부하율","배터리 상태·경보 이력","냉각팬 소음·발열","외함 청결·누유 여부"]},
  rectifier: {name:"정류기",          ic:"⚡", checks:["출력 전압·전류 표시","모듈 경보 LED","모듈 부하 분담 상태","차단기(MCCB) 상태","팬 동작·먼지"]},
  battery:   {name:"축전지",          ic:"🪫", checks:["외관 변형·누액·부풀음","단자 부식·체결 상태","셀 전압 편차","표면 온도","연결 케이블 상태"]},
  hvac:      {name:"항온항습기",      ic:"❄️", checks:["설정/실내 온도·습도 표시","경보 표시 유무","필터 오염","배수·누수","실외기 동작"]},

const DB = {

      r.onupgradeneeded=()=>r.result.createObjectStore("p");

  async put(id,blob){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("p","readwrite"); t.objectStore("p").put(blob,id); t.oncomplete=()=>res(id); t.onerror=()=>rej(t.error); }); },
  async get(id){ if(!id) return null; const db=await this.open(); return new Promise((res)=>{ const r=db.transaction("p").objectStore("p").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); },
  async clear(){ const db=await this.open(); return new Promise(res=>{ const t=db.transaction("p","readwrite"); t.objectStore("p").clear(); t.oncomplete=()=>res(); }); },
};

/* ---------- 위치 구조: 건물 > 층 > 실(공간) > 랙/세부 ---------- */
const NOLOC="(미지정)";
function floorNorm(f){
  f=String(f||"").trim(); if(!f) return "";
  let m=f.match(/^(?:지하|B)\s*(\d+)\s*(?:층|F)?$/i); if(m) return "B"+m[1];
  m=f.match(/^(\d+)\s*(?:층|F)?$/i); if(m) return m[1]+"F";
  if(/^(옥상|RF|PH)$/i.test(f)) return "RF";
  return f;
}
function floorOrder(f){ f=floorNorm(f); let m=f.match(/^B(\d+)/); if(m) return -parseInt(m[1]); m=f.match(/^(\d+)F/); if(m) return parseInt(m[1]); if(f==="RF") return 900; return f===NOLOC?9999:999; }
function composeLoc(e){ return [e.building,e.floor,e.room,e.rack].filter(Boolean).join(" "); }
function locOf(e){ return {b:e.building||NOLOC, f:e.floor||NOLOC, r:e.room||NOLOC}; }
function roomKey(b,f,r){ return [b||NOLOC,f||NOLOC,r||NOLOC].join("¦"); }
function roomName(k){ return k.split("¦").filter(x=>x!==NOLOC).join(" ")||"위치 미지정"; }
/* 예전 "3F 전송실 R-05" 같은 한 줄 위치를 층/실/랙으로 분리 */
function splitLoc(e){
  if(e.building||e.floor||e.room||!e.location) return;
  let t=e.location.trim();
  const m=t.match(/(지하\s*\d+\s*층?|B\d+\s*F?|\d+\s*(?:F|층))/i);
  if(m){ e.floor=floorNorm(m[0].replace(/\s/g,"")); t=t.replace(m[0]," ").trim(); }
  const parts=t.split(/\s+/).filter(Boolean);
  // 층 앞에 붙은 단어는 건물명으로 간주 (예: "본관 3F 전송실")
  if(m && e.location.indexOf(m[0])>0 && parts.length>1){ e.building=parts.shift(); }
  e.room=parts.shift()||""; e.rack=parts.join(" ");
  if(!e.building) e.building=S.settings.site||"";
}
function migrateLoc(){ let ch=false; S.equips.forEach(e=>{ if(!e.building&&!e.floor&&!e.room&&e.location){ splitLoc(e); e.location=composeLoc(e); ch=true; } }); if(ch) save(); }
function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort(); }
function parseQR(text){ text=(text||"").trim(); return text.startsWith(QR_PREFIX)? text.slice(QR_PREFIX.length) : text; }

/* 이미지 축소(전송량·저장공간 절약) */
function resizeImage(src, max=1280, q=0.82){
  return new Promise((res,rej)=>{
    const draw=(el,w,h)=>{ const s=Math.min(1,max/Math.max(w,h)); const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext("2d").drawImage(el,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error("이미지 변환 실패")),"image/jpeg",q); };
    if(src instanceof HTMLVideoElement){ draw(src,src.videoWidth,src.videoHeight); return; }
    const img=new Image(); img.onload=()=>{ draw(img,img.naturalWidth,img.naturalHeight); URL.revokeObjectURL(img.src); }; img.onerror=()=>rej(new Error("이미지 열기 실패")); img.src=URL.createObjectURL(src);
  });
}
function blobToBase64(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.readAsDataURL(b); }); }
function download(name, text, mime="text/plain"){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function pickFile(accept, capture){

    el.onchange=()=>res(el.files[0]||null); el.click(); });
}
function csvCell(v){ v=String(v??""); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(rows){ return "﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"); }
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false; text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(cell);cell="";} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=='\r') cell+=c; }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}

   4. AI (Gemini Vision) — 기존 RepiQ 앱과 같은 키/방식 사용

const GEMINI = "https://generativelanguage.googleapis.com/v1beta";
/* 이 키로 쓸 수 있는 모델 목록을 조회해 가장 적합한 모델을 고름
   (Google이 모델을 자주 교체/중단하므로 하드코딩하지 않고 자동 선택) */
async function listModels(){
  const r=await fetch(`${GEMINI}/models?pageSize=200&key=${encodeURIComponent(S.settings.apiKey)}`);
  if(!r.ok){ const t=await r.text(); throw new Error(r.status===400||r.status===403? "API 키가 올바르지 않습니다. 설정에서 키를 확인하세요." : `모델 목록 조회 실패 ${r.status}: ${t.slice(0,120)}`); }
  const j=await r.json();
  return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
}
function rankModel(n){
  if(!/gemini/.test(n) || /(image|tts|audio|live|embedding|aqa|robotics|computer|thinking-exp|learnlm|gemma)/.test(n)) return -1;
  let sc=0;
  const v=n.match(/gemini-(\d+(?:\.\d+)?)/); if(v) sc+=parseFloat(v[1])*100;
  if(/flash/.test(n)) sc+=50;            // 빠르고 저렴 → 현장용 우선
  if(/lite/.test(n)) sc-=30;
  if(/pro/.test(n)) sc+=10;
  if(/latest/.test(n)) sc+=5;
  if(/(preview|exp)/.test(n)) sc-=40;    // 미리보기 버전은 후순위
  return sc;
}
async function autoPickModel(){
  const names=await listModels();
  const best=names.map(n=>[n,rankModel(n)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1])[0];
  if(!best) throw new Error("이 키로 사용할 수 있는 Gemini 모델이 없습니다.");
  S.settings.model=best[0]; S.settings.models=names.filter(n=>rankModel(n)>=0); save();
  return best[0];
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 혼잡(503) 등일 때 쓸 대체 모델: 현재 모델을 뺀 나머지 중 순위 높은 것 */
async function altModel(cur){
  if(!S.settings.models||!S.settings.models.length){ try{ await autoPickModel(); S.settings.model=cur; save(); }catch(_){ return null; } }
  return (S.settings.models||[]).filter(m=>m!==cur && rankModel(m)>=0).sort((a,b)=>rankModel(b)-rankModel(a))[0]||null;
}
async function callGemini(prompt, imageBlobs, opts){
  opts=opts||{};
  if(!S.settings.apiKey) throw new Error("API 키가 없습니다. 설정에서 Gemini 키를 등록하세요.");
  if(!S.settings.model) await autoPickModel();
  const model=opts._model||S.settings.model, tries=opts._tries||0;
  if(!opts._parts){ opts._parts=[{text:prompt}]; for(const b of (imageBlobs||[])) opts._parts.push({inline_data:{mime_type:"image/jpeg", data:await blobToBase64(b)}}); }
  const url=`${GEMINI}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(S.settings.apiKey)}`;
  const gc={temperature:0.1, maxOutputTokens:opts.maxTokens||4096, responseMimeType:"application/json"};
  if(opts.fast && !S.settings.noThinkCfg) gc.thinkingConfig={thinkingBudget:0};   // 실시간용: 생각 단계 생략 → 빠른 응답
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(), opts.timeout||90000);
  let r;
  try{ r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:opts._parts}], generationConfig:gc}),signal:ctl.signal}); }
  catch(e){ clearTimeout(tm);
    if(e.name==="AbortError"){ if(tries<1) return callGemini(prompt,imageBlobs,{...opts,_tries:tries+1}); throw new Error("AI 응답 시간 초과 — 네트워크 상태를 확인하세요"); }
    throw new Error("네트워크 오류 — 인터넷 연결을 확인하세요"); }
  clearTimeout(tm);
  if(!r.ok){
    const t=await r.text();
    // thinkingConfig 미지원 모델 → 끄고 재시도
    if(r.status===400 && /thinking/i.test(t) && gc.thinkingConfig){ S.settings.noThinkCfg=true; save(); return callGemini(prompt,imageBlobs,opts); }
    // 모델 중단/미지원(404 등) → 사용 가능한 모델로 자동 교체
    if(!opts._retried && (r.status===404 || /no longer available|not found|not supported|deprecated/i.test(t))){
      const old=S.settings.model, m=await autoPickModel();
      if(m!==old){ toast(`AI 모델 자동 변경: ${m}`,"good"); return callGemini(prompt,imageBlobs,{...opts,_retried:true,_model:null}); }
    }
    // 서버 혼잡(503/500/overloaded) → 잠시 후 재시도, 그래도 안 되면 다른 모델로
    if(r.status===503||r.status===500||/overloaded|high demand|UNAVAILABLE/i.test(t)){
      if(tries<2){ if(opts.onWait) opts.onWait(`AI 서버 혼잡 — ${tries+1}차 재시도 중…`); await sleep(tries?4000:1500); return callGemini(prompt,imageBlobs,{...opts,_tries:tries+1}); }
      if(!opts._alt){ const a=await altModel(model); if(a){ if(opts.onWait) opts.onWait(`혼잡 — 대체 모델(${a})로 시도 중…`); return callGemini(prompt,imageBlobs,{...opts,_tries:0,_alt:true,_model:a}); } }
      throw new Error("AI 서버가 혼잡합니다(503). 1~2분 뒤 다시 시도하세요.");
    }
    if(r.status===429) throw new Error("AI 사용 한도 초과(429). 잠시 후 다시 시도하거나 결제 설정을 확인하세요.");
    throw new Error(`AI 오류 ${r.status}: ${t.slice(0,160)}`);
  }
  const j=await r.json();
  const txt=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||"").join("");
  return parseJSON(txt);
}
function parseJSON(txt){
  let t=(txt||"").trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  try{ return JSON.parse(t); }catch(e){ const m=t.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(_){} } throw new Error("AI 응답 파싱 실패"); }
}

const norm = v => String(v||"").toUpperCase().replace(/[^0-9A-Z가-힣]/g,"");
/* 시리얼 비교용: 흔한 오독(O↔0, I/L↔1, S↔5 아님 주의) 보정 */
const normSN = v => norm(v).replace(/O/g,"0").replace(/[IL]/g,"1");
/* 제조사·정격은 포함관계면 같은 값으로 봄 (LS ↔ LS ELECTRIC) */
const sameLoose = (a,b) => { a=norm(a); b=norm(b); return !!a && !!b && (a===b || (Math.min(a.length,b.length)>=2 && (a.startsWith(b)||b.startsWith(a)))); };
const LIVE_FIELDS = ["type","maker","model","serial","rating","name"];
/* 여러 프레임 결과를 필드별 다수결로 합침 */
function fuseObs(obs){
  const f={n:obs.length, agree:{}, votes:{}};
  for(const k of LIVE_FIELDS){
    const tally={};
    obs.forEach(o=>{ const v=(o[k]||"").trim(); if(!v) return; const key=k==="name"?v:k==="serial"?normSN(v):norm(v); (tally[key]=tally[key]||{v,c:0}).c++; });
    const best=Object.values(tally).sort((a,b)=>b.c-a.c)[0];
    if(best){ f[k]=best.v; f.agree[k]=best.c; }
  }
  obs.forEach(o=>{ const id=o.match&&o.match.id; if(id&&findEquip(id)) f.votes[id]=(f.votes[id]||0)+1+(o.match.confidence||0); });
  const last=obs[obs.length-1]||{}; f.box=last.box_2d; f.status=last.status; f.tip=last.tip; f.quality=last.quality;
  return f;
}
/* 설비대장과 대조해 점수 계산 (시리얼 일치가 가장 강한 근거) */
function matchLedger(f){
  const out=S.equips.map(e=>{
    let sc=0; const why=[];
    if(f.serial && norm(e.serial) && normSN(e.serial)===normSN(f.serial)){ sc+=6; why.push("시리얼 일치"); }
    if(f.model && norm(e.model)){ if(norm(e.model)===norm(f.model)){ sc+=2; why.push("모델 일치"); } else if(norm(f.model).length>=4 && (norm(e.model).includes(norm(f.model))||norm(f.model).includes(norm(e.model)))){ sc+=1; why.push("모델 유사"); } }
    if(f.maker && sameLoose(e.maker,f.maker)){ sc+=1; why.push("제조사"); }
    if(f.type && f.type===e.type) sc+=0.5;
    const v=f.votes[e.id]||0; if(v){ sc+=v*1.5; why.push(`AI ${v.toFixed(1)}표`); }
    return {e,sc,why};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  const top=out[0], second=out[1];
  let lock=false, ambiguous=false;
  if(top){
    const serialHit=top.why.includes("시리얼 일치");
    ambiguous = !serialHit && second && second.sc>=top.sc-0.5;
    lock = !ambiguous && (serialHit || (top.sc>=5 && f.n>=2));
  }
  return {top, second, lock, ambiguous, list:out};
}
/* 대장값과 현장(AI) 판독값 차이 */
function ledgerDiff(e,f){
  const L={maker:"제조사",model:"모델",serial:"시리얼",rating:"정격"}, d=[];
  for(const k in L){ const same = k==="serial"? normSN(f[k])===normSN(e[k]) : (k==="maker"||k==="rating")? sameLoose(f[k],e[k]) : norm(f[k])===norm(e[k]);
    if(f[k] && e[k] && !same && (f.agree[k]||0)>=Math.min(2,f.n)) d.push({k,label:L[k],ledger:e[k],field:f[k]}); }
  return d;
}

/* 동영상에서 n장 프레임을 고르게 추출 (영상 전체를 보내지 않아 빠르고 용량 제한에 안전) */
async function videoFrames(file, n=10, max=960){
  const url=URL.createObjectURL(file), v=document.createElement("video");
  v.muted=true; v.playsInline=true; v.preload="auto"; v.src=url;
  const once=(ev)=>new Promise((res,rej)=>{ const ok=()=>{cl();res();}, bad=()=>{cl();rej(new Error("동영상을 열 수 없습니다(형식 미지원)"));};
    const cl=()=>{v.removeEventListener(ev,ok);v.removeEventListener("error",bad);}; v.addEventListener(ev,ok); v.addEventListener("error",bad); });
  await once("loadedmetadata");
  if(!isFinite(v.duration)){ v.currentTime=1e7; await once("seeked"); }
  const d=v.duration; if(!d) throw new Error("동영상 길이를 알 수 없습니다");
  const sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement("canvas");
  c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
  const out=[];
  for(let i=0;i<n;i++){
    v.currentTime=Math.min(d-0.05, d*(i+0.5)/n); await once("seeked");
    c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.78)));
  }
  URL.revokeObjectURL(url);
  return {frames:out, duration:d};
}

const unitKey = u => norm(u.model||u.name||u.function);
function rackDiff(prev, cur){
  if(!prev) return {added:[],removed:[]};
  const cnt=a=>{ const m={}; a.filter(isGear).forEach(u=>{ const k=unitKey(u); if(k) m[k]=(m[k]||0)+1; }); return m; };
  const P=cnt(prev.units), C=cnt(cur.units), added=[], removed=[];
  cur.units.filter(isGear).forEach(u=>{ const k=unitKey(u); if(k && (P[k]||0)<=0) added.push(u); else if(k) P[k]--; });
  const C2=cnt(cur.units); prev.units.filter(isGear).forEach(u=>{ const k=unitKey(u); if(k && (C2[k]||0)<=0) removed.push(u); else if(k) C2[k]--; });
  return {added,removed};
}
function typeFromFunc(u){
  const t=[u.function,u.name,u.model].join(" ");
  if(/UPS/i.test(t)) return "ups"; if(/정류/.test(t)) return "rectifier"; if(/축전지|배터리|battery/i.test(t)) return "battery";
  if(/앰프|amp|방송|PA|스피커|speaker|monitor panel|CATV|변조|modulat|영상|video|DVD|모니터|문자|카메라|CCTV/i.test(t)) return "cctv";
  if(/광|전송|OLT|MUX|SDH|OTN|fiber|optic|스위치|switch|router|라우터/i.test(t)) return "transport";
  if(/분전|차단기|PDU|전원 ?분배|distributor/i.test(t)) return "panel";
  if(/단자|MDF|IDF|patch|패치/i.test(t)) return "mdf";
  return "etc";
}

    $("#ar").classList.add("on"); $("#arHint").textContent="카메라 준비 중…";
    this.video=$("#arVideo"); this.canvas=$("#arCanvas"); this.ctx=this.canvas.getContext("2d");
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}});
    }catch(e){
      $("#arHint").innerHTML="카메라를 열 수 없습니다.<br>· HTTPS 주소(GitHub Pages)로 접속했는지<br>· 브라우저 카메라 권한을 허용했는지 확인하세요.";
      return;
    }
    this.track=this.stream.getVideoTracks()[0];
    this.video.srcObject=this.stream; await this.video.play().catch(()=>{});
    $("#arHint").textContent="";
    if("BarcodeDetector" in window){ try{ this.detector=new BarcodeDetector({formats:["qr_code"]}); }catch(_){ this.detector=null; } }
    this.scanCv=document.createElement("canvas");
    this.live.on=!!S.settings.liveAI; this.liveReset(); this.sv.res=null; this.hereChip(); this.sel.tags=[]; this.sel.last=null; this.toggleSel(false); $("#btnLive").classList.toggle("on",this.live.on);
    if(equipId) this.setEquip(findEquip(equipId));
    else if(!this.equip) this.say(this.live.on&&S.settings.apiKey? "설비를 비추면 AI가 인식합니다" : "설비 QR 코드를 비춰 주세요");
    if(S.settings.voice && Voice.supported() && !Voice.on) this.toggleVoice(true);
    this.running=true; this.resize(); requestAnimationFrame(()=>this.loop());
    window.addEventListener("resize", this._rs=()=>this.resize());
    this.canvas.onclick=()=>{ if(this.glasses) $("#ar").classList.toggle("showctl"); };
    this.canvas.onpointerdown=ev=>{ if(!this.sel.on||this.glasses) return; ev.preventDefault(); this.canvas.setPointerCapture(ev.pointerId);
      const d=this.dpr(); this.sel.drag={x0:ev.clientX*d,y0:ev.clientY*d,x1:ev.clientX*d,y1:ev.clientY*d}; };
    this.canvas.onpointermove=ev=>{ const g=this.sel.drag; if(!g) return; const d=this.dpr(); g.x1=ev.clientX*d; g.y1=ev.clientY*d; };
    this.canvas.onpointerup=()=>{ const g=this.sel.drag; if(!g) return; this.sel.drag=null;
      const W=this.canvas.width,H=this.canvas.height; let x0=Math.min(g.x0,g.x1),x1=Math.max(g.x0,g.x1),y0=Math.min(g.y0,g.y1),y1=Math.max(g.y0,g.y1);
      if(x1-x0<30||y1-y0<30){ const r=Math.min(W,H)*0.16, cx=g.x0, cy=g.y0; x0=cx-r; x1=cx+r; y0=cy-r; y1=cy+r; }   // 탭 → 주변 영역
      this.identify(this.screenToVideo(x0,y0), this.screenToVideo(x1,y1)); };
    this.renderExtra();
  },
  close(){
    if(this.session && this.session.items.some(i=>i.result) && !confirm("진행 중인 점검을 저장하지 않고 닫을까요?\n(취소 → 계속 점검, '완료' 버튼/음성으로 저장)")) return;
    this.running=false; Voice.stop(); $("#btnMic").classList.remove("on");
    if(window.speechSynthesis) speechSynthesis.cancel();
    if(this.stream) this.stream.getTracks().forEach(t=>t.stop());
    this.stream=null; this.session=null; this.equip=null; this.lastAI=null; this.qr=null; this.torch=false;
    if(this.glasses) this.toggleGlasses();
    window.removeEventListener("resize", this._rs);
    $("#ar").classList.remove("on"); render();
  },
  dpr(){ return this.canvas.width/innerWidth; },
  /* 화면(캔버스 px) → 영상 좌표 (일반 모드, 화면 가득 cover) */
  screenToVideo(px,py){
    const v=this.video, vw=v.videoWidth, vh=v.videoHeight, W=this.canvas.width, H=this.canvas.height, ra=W/H;
    let sx=0,sy=0,sw=vw,sh=vh; if(vw/vh>ra){ sw=vh*ra; sx=(vw-sw)/2; } else { sh=vw/ra; sy=(vh-sh)/2; }
    const sc=W/sw; return {x:Math.max(0,Math.min(vw,sx+px/sc)), y:Math.max(0,Math.min(vh,sy+py/sc))};
  },
  resize(){ const d=Math.min(window.devicePixelRatio||1,2); this.canvas.width=innerWidth*d; this.canvas.height=innerHeight*d; },
  say(t){ Voice.say(t); this.toast(t); },
  toast(t){ this.msg=t; this.msgUntil=Date.now()+3500; },

  /* ---- 메인 루프 ---- */
  loop(){
    if(!this.running) return;
    const now=performance.now();
    if(now-this.lastScan>220 && this.video.readyState>=2){ this.lastScan=now; this.scan(); }
    const L=this.live;
    if(L.on && !this.equip && !L.busy && !this.sv.busy && !this.sv.res && !this.sel.busy && !this.sel.on && S.settings.apiKey && this.video.readyState>=2 && Date.now()>L.backoff
       && Date.now()-L.lastAt > Math.max(2,+S.settings.liveSec||4)*1000) this.liveTick();
    this.draw();
    requestAnimationFrame(()=>this.loop());
  },
  async scan(){
    const v=this.video; if(!v.videoWidth) return;
    let hit=null;
    try{
      if(this.detector){
        const r=await this.detector.detect(v);
        if(r[0]) hit={text:r[0].rawValue, pts:r[0].cornerPoints.map(p=>({x:p.x,y:p.y}))};
      }else if(window.jsQR){
        const s=Math.min(1,640/v.videoWidth), w=Math.round(v.videoWidth*s), h=Math.round(v.videoHeight*s);
        const c=this.scanCv; c.width=w; c.height=h; const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(v,0,0,w,h);
        const r=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});
        if(r){ const L=r.location; hit={text:r.data, pts:[L.topLeftCorner,L.topRightCorner,L.bottomRightCorner,L.bottomLeftCorner].map(p=>({x:p.x/s,y:p.y/s}))}; }
      }
    }catch(_){}
    if(hit){ hit.t=Date.now(); this.qr=hit; this.onQR(hit.text); }
  },
  onQR(text){
    const id=parseQR(text), eq=findEquip(id);
    if(eq){
      if(this.equip && this.equip.id===eq.id) return;
      if(this.session && this.session.items.some(i=>i.result)){ this.toast(`다른 설비(${eq.name}) 인식 — 현재 점검 완료 후 전환`); return; }
      this.setEquip(eq);
    }else{
      if(this._unk!==id){ this._unk=id; this.say("미등록 설비입니다. 등록 버튼을 누르세요"); this.renderExtra(); }
    }
  },
  setEquip(eq){
    if(!eq) return;
    this.equip=eq; this._unk=null; this.lastAI=null; this.step=0;
    this.liveDiff = this.live.fused? ledgerDiff(eq,this.live.fused) : [];
    const checks=checksOf(eq.type);
    this.session={ id:uid("IN"), equipId:eq.id, equipName:eq.name, type:eq.type, inspector:S.settings.inspector, site:S.settings.site,
                   startedAt:Date.now(), items:checks.map(c=>({label:c, result:null, note:"", photo:null, ai:null})) };
    this.flash=Date.now();
    Voice.say(`${eq.name||typeName(eq.type)} 인식. 점검항목 ${checks.length}개. 첫 번째, ${checks[0]}`);
    this.toast(`${eq.name} 인식됨`);
    this.renderExtra();
  },
  pickEquip(){
    if(!S.equips.length){ toast("등록된 설비가 없습니다. 먼저 설비를 등록하세요"); return; }
    ui.openSheet("pickEquip");
  },

  /* ---- 점검 진행 ---- */
  cur(){ return this.session? this.session.items[this.step] : null; },
  speakStep(){ const it=this.cur(); if(it) Voice.say(`${this.step+1}번. ${it.label}`); },
  next(){ if(!this.session) return; if(this.step<this.session.items.length-1){ this.step++; this.lastAI=null; this.speakStep(); } else this.askFinish(); },
  prev(){ if(!this.session) return; if(this.step>0){ this.step--; this.lastAI=this.cur().ai; this.speakStep(); } },
  mark(r){
    const it=this.cur(); if(!it){ this.say("먼저 설비 QR을 비춰 주세요"); return; }
    it.result=r; it.at=Date.now(); this.flash=Date.now();
    if(this.step<this.session.items.length-1){ this.step++; this.lastAI=null; const n=this.cur(); Voice.say(`${r}. 다음, ${n.label}`); }
    else this.askFinish(r);
  },
  askFinish(prefix){
    const left=this.session.items.filter(i=>!i.result).length;
    Voice.say(`${prefix?prefix+". ":""}${left? `미점검 ${left}개가 남았습니다.` : "모든 항목 점검 완료."} 완료라고 말하거나 완료 버튼을 누르세요`);
    this.renderExtra(true);
  },
  finish(){
    const s=this.session; if(!s){ return; }
    if(!s.items.some(i=>i.result)){ this.say("점검 결과가 없습니다"); return; }
    s.endedAt=Date.now();
    s.overall=s.items.reduce((m,i)=> i.result && RESULT_RANK[i.result]>RESULT_RANK[m]? i.result : m, "정상");
    S.inspections.unshift(s);
    const eq=findEquip(s.equipId); if(eq){ eq.lastInspected=s.endedAt; eq.health=s.overall; }
    save();
    this.say(`점검 저장 완료. 종합 판정 ${s.overall}`);
    this.session=null; this.equip=null; this.lastAI=null; this.qr=null; this.liveDiff=[]; this.liveReset(); this.renderExtra();
  },

  /* ---- 캡처 / 사진 / AI ---- */
  async capture(){ if(!this.video.videoWidth) throw new Error("카메라 영상 없음"); return resizeImage(this.video,1280,0.82); },
  async photo(){
    const it=this.cur();
    try{
      const b=await this.capture(); const id=uid("PH"); await DB.put(id,b);
      if(it){ it.photo=id; this.say("사진 저장"); }
      else if(this.equip){ this.equip.photo=id; save(); this.say("설비 사진 저장"); }
      else this.say("설비를 먼저 인식하세요");
      this.flash=Date.now();
    }catch(e){ toast(e.message,"bad"); }
  },
  async diagnose(){
    if(this.busy) return;
    if(!this.session){ this.say("먼저 설비 QR을 비춰 주세요"); return; }
    if(!S.settings.apiKey){ this.say("AI 키가 없습니다. 설정에서 등록하세요"); return; }
    this.busy=true; this.say("AI 진단 중");
    try{
      const b=await this.capture(); const id=uid("PH"); await DB.put(id,b);
      const checks=this.session.items.map(i=>i.label);
      const r=await callGemini(PROMPT_DIAG(this.equip,checks,this.step),[b]);
      r.photo=id; r.step=this.step; r.at=Date.now();
      const it=this.cur(); it.ai=r; if(!it.photo) it.photo=id;
      this.lastAI=r;
      Voice.say(`AI 판정 ${r.status||"판단불가"}. ${r.summary||""}. ${RESULT_RANK[r.status]!=null?"적용이라고 말하면 반영합니다":""}`);
    }catch(e){ this.say("AI 진단 실패"); toast(e.message,"bad"); }
    this.busy=false;
  },
  applyAI(){
    const r=this.lastAI; if(!r || RESULT_RANK[r.status]==null){ this.say("적용할 AI 판정이 없습니다"); return; }
    const it=this.cur(); if(it) it.note=[it.note, (r.findings||[]).join(" / ")].filter(Boolean).join(" | ");
    this.mark(r.status);
  },
  verify(){
    if(this.sv.res && this.sv.eq) return this.svConfirm();
    if(!this.equip){ this.say("설비를 먼저 인식하세요"); return; }
    const e=this.equip, d=this.liveDiff||[];
    e.verifiedAt=Date.now(); e.verifiedBy=S.settings.inspector;
    if(d.length){ e.sync="불일치"; e.memo=[e.memo, "현장확인 "+fmt(Date.now()).slice(0,10)+": "+d.map(x=>`${x.label} 대장=${x.ledger} 현장=${x.field}`).join(", ")].filter(Boolean).join(" / ");
      save(); this.say(`현행화 불일치 ${d.length}건 기록. 갱신이라고 말하면 대장을 현장값으로 고칩니다`); }
    else { e.sync="일치"; save(); this.say("현행화 확인 완료"); }
    this.flash=Date.now(); this.live.ver++;
  },
  applyDiff(){
    if(this.sv.res && this.sv.eq) return this.svUpdate();
    const e=this.equip, d=this.liveDiff||[]; if(!e||!d.length){ this.say("갱신할 차이가 없습니다"); return; }
    d.forEach(x=>e[x.k]=x.field); e.sync="일치"; e.verifiedAt=Date.now(); e.verifiedBy=S.settings.inspector; e.updatedAt=Date.now();
    e.memo=[e.memo,"대장 갱신 "+fmt(Date.now()).slice(0,10)+": "+d.map(x=>`${x.label} ${x.ledger}→${x.field}`).join(", ")].filter(Boolean).join(" / ");
    this.liveDiff=[]; save(); this.say("대장을 현장값으로 갱신했습니다"); this.live.ver++;
  },

  /* ---- 🎯 선택 인식: 화면에서 고른 부분이 무엇인지 ---- */
  toggleSel(force){
    this.sel.on = force!=null? force : !this.sel.on; $("#btnSel").classList.toggle("on",this.sel.on);
    if(this.sel.on){ if(this.glasses) this.selectCenter(); else this.toast("인식할 물체를 탭하거나, 손가락으로 끌어 범위를 그리세요"); }
    this.live.ver++;
  },
  selectCenter(){   // 음성/안경모드: 화면 가운데 영역
    const v=this.video, vw=v.videoWidth, vh=v.videoHeight, r=Math.min(vw,vh)*0.22;
    this.identify({x:vw/2-r,y:vh/2-r},{x:vw/2+r,y:vh/2+r});
  },
  async identify(a,b){
    if(this.sel.busy) return;
    if(!S.settings.apiKey){ this.say("AI 키가 없습니다. 설정에서 등록하세요"); return; }
    const v=this.video, vw=v.videoWidth, vh=v.videoHeight; if(!vw) return;
    const box={x0:a.x,y0:a.y,x1:b.x,y1:b.y};
    this.sel.busy=box; Voice.say("인식 중");
    try{
      // 1) 선택 영역 확대(여백 15%)  2) 전체 화면에 빨간 상자 표시
      const mx=(box.x1-box.x0)*0.15, my=(box.y1-box.y0)*0.15;
      const cx0=Math.max(0,box.x0-mx), cy0=Math.max(0,box.y0-my), cw=Math.min(vw,box.x1+mx)-cx0, ch=Math.min(vh,box.y1+my)-cy0;
      const k=Math.min(1,1024/Math.max(cw,ch)), c1=document.createElement("canvas"); c1.width=Math.round(cw*k); c1.height=Math.round(ch*k);
      c1.getContext("2d").drawImage(v,cx0,cy0,cw,ch,0,0,c1.width,c1.height);
      const k2=Math.min(1,960/Math.max(vw,vh)), c2=document.createElement("canvas"); c2.width=Math.round(vw*k2); c2.height=Math.round(vh*k2);
      const x2=c2.getContext("2d"); x2.drawImage(v,0,0,c2.width,c2.height); x2.strokeStyle="#ff2020"; x2.lineWidth=Math.max(3,c2.width/160);
      x2.strokeRect(box.x0*k2,box.y0*k2,(box.x1-box.x0)*k2,(box.y1-box.y0)*k2);
      const toBlob=c=>new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
      const crop=await toBlob(c1), full=await toBlob(c2);
      const cands=S.equips.slice(0,200).map(e=>[e.id,typeName(e.type),e.name,e.maker,e.model,e.serial,e.location].map(x=>String(x||"").replace(/\|/g,"/")).join("|"));
      const r=await callGemini(PROMPT_SELECT(cands),[crop,full],{fast:true,timeout:40000,onWait:t=>this.toast(t)});
      const eq=r.match&&r.match.id&&findEquip(r.match.id);
      const tag={box, r, eq, at:Date.now(), crop};
      this.sel.tags.unshift(tag); this.sel.tags=this.sel.tags.slice(0,4); this.sel.last=tag;
      Voice.say(`${r.what||"알 수 없는 물체"}. ${r.partOf?r.partOf+"의 일부. ":""}${(r.function||"").split(/[.。]/)[0]}`);
    }catch(e){ this.say("인식 실패"); toast(e.message,"bad"); }
    this.sel.busy=null; this.live.ver++;
  },
  /* 선택한 물체를 현황 조사(대장 등록/대조)로 넘김 */
  async selToSurvey(){
    const t=this.sel.last; if(!t) return;
    const r={...t.r, name:t.r.what, found:true, agree:{}, n:1, votes:{}};
    ["maker","model","serial"].forEach(k=>{ if(r[k]) r.agree[k]=1; });
    if(t.eq) r.votes[t.eq.id]=1.8;
    const m=matchLedger(r), sv=this.sv;
    sv.res=r; sv.blob=t.crop; sv.eq= t.eq || (m.top && (m.lock||m.top.why.includes("시리얼 일치")) && !m.ambiguous ? m.top.e : null);
    sv.cands=m.ambiguous? m.list.slice(0,3).map(x=>x.e):[]; sv.diff= sv.eq? ledgerDiff(sv.eq,r):[];
    this.toggleSel(false); this.live.ver++;
    Voice.say(sv.eq? `대장 설비 ${sv.eq.name||sv.eq.id}. 확인 또는 갱신이라고 말하세요` : "신규 설비. 등록이라고 말하면 저장합니다");
  },
  clearTags(){ this.sel.tags=[]; this.sel.last=null; this.live.ver++; },

  /* ---- 📋 현황 등록: 명판/설비를 비추고 한 번에 대장 등록·확인 ---- */
  hereChip(){ const h=S.here||{}; const t=[h.floor,h.room].filter(Boolean).join(" "); const el=$("#btnHere"); if(el) el.textContent="📍 "+(t||"위치"); },
  async survey(){
    if(this.sv.busy) return;
    if(!S.settings.apiKey){ this.say("AI 키가 없습니다. 설정에서 등록하세요"); return; }
    if(this.session && this.session.items.some(i=>i.result)){ this.say("점검 중입니다. 완료 후 현황 등록하세요"); return; }
    const sv=this.sv; sv.busy=true; sv.res=null; sv.status="명판 판독 중…"; this.flash=Date.now(); Voice.say("판독 중");
    try{
      const blob=await resizeImage(this.video,1600,0.88);
      const cands=S.equips.slice(0,200).map(e=>[e.id,typeName(e.type),e.name,e.maker,e.model,e.serial,e.location].map(v=>String(v||"").replace(/\|/g,"/")).join("|"));
      const r=await callGemini(PROMPT_SURVEY(cands),[blob],{fast:true,timeout:45000,onWait:t=>{sv.status=t;}});
      if(!r || r.found===false || !(r.maker||r.model||r.serial||r.name||r.type)){ sv.status=""; this.say(r&&r.tip? r.tip : "설비나 명판이 보이지 않습니다. 명판을 가까이 비춰 주세요"); sv.busy=false; this.live.ver++; return; }
      r.agree={}; ["maker","model","serial","rating"].forEach(k=>{ if(r[k]) r.agree[k]=1; }); r.n=1; r.votes={};
      if(r.match&&r.match.id&&findEquip(r.match.id)) r.votes[r.match.id]=1+(r.match.confidence||0);
      const m=matchLedger(r);
      sv.res=r; sv.blob=blob; sv.eq= m.top && (m.lock || m.top.why.includes("시리얼 일치") || (r.votes[m.top.e.id]||0)>=1.7) && !m.ambiguous ? m.top.e : null;
      sv.cands=m.ambiguous? m.list.slice(0,3).map(x=>x.e) : [];
      sv.diff= sv.eq? ledgerDiff(sv.eq,r) : [];
      sv.status="";
      if(sv.eq) Voice.say(`대장 설비 ${sv.eq.name||sv.eq.id}. ${sv.diff.length?`대장과 다른 항목 ${sv.diff.length}개. 갱신 또는 확인이라고 말하세요`:"대장과 일치. 확인이라고 말하세요"}`);
      else Voice.say(`신규 설비. ${r.maker||""} ${r.model||typeName(r.type)}. 등록이라고 말하면 저장합니다`);
    }catch(e){ sv.status=""; this.say("판독 실패"); toast(e.message,"bad"); }
    sv.busy=false; this.live.ver++;
  },
  async svSave(edit){
    const sv=this.sv, r=sv.res; if(!r){ this.survey(); return; }
    if(sv.eq){ return this.svConfirm(); }
    let photo=null; if(sv.blob){ photo=uid("PH"); await DB.put(photo,sv.blob); }
    const h=S.here||{};
    const rec={id:newEquipId(), type:TYPES[r.type]?r.type:"etc", name:r.name||[r.maker,r.model].filter(Boolean).join(" ")||typeName(r.type), maker:r.maker||"", model:r.model||"", serial:r.serial||"",

  frameSig(){
    const c=this.sigCv||(this.sigCv=document.createElement("canvas")); c.width=32; c.height=18;
    const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(this.video,0,0,32,18);
    const d=x.getImageData(0,0,32,18).data, a=new Uint8Array(576);
    for(let i=0;i<576;i++) a[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3; return a;
  },
  async liveTick(){
    const L=this.live; L.lastAt=Date.now();
    // 장면 변화 감지: 크게 바뀌면 새 설비로 보고 누적 초기화, 거의 같고 이미 충분히 판독했으면 호출 생략(사용량 절약)
    const sig=this.frameSig();
    if(L.sig){ let df=0; for(let i=0;i<576;i++) df+=Math.abs(sig[i]-L.sig[i]); df/=576;
      if(df>28){ L.obs=[]; L.fused=null; L.match=null; L.said=""; L.blob=null; }
      else if(df<5 && L.obs.length>=4){ L.status="같은 장면 — 충분히 판독됨 (다른 각도/명판을 비추면 재분석)"; L.sig=sig; return; } }
    L.sig=sig; L.busy=true; L.status=L.obs.length?`AI 판독 중… (${L.obs.length+1}번째 프레임)`:"AI 판독 중…";
    try{
      const blob=await resizeImage(this.video,1024,0.78);
      const cands=S.equips.slice(0,200).map(e=>[e.id,typeName(e.type),e.name,e.maker,e.model,e.serial,e.location].map(v=>String(v||"").replace(/\|/g,"/")).join("|"));
      const r=await callGemini(PROMPT_LIVE(cands),[blob],{fast:true,timeout:25000,onWait:t=>{L.status=t;}});
      if(this.equip){ L.busy=false; return; }               // 그 사이 QR로 잡혔으면 무시
      if(r && r.found!==false && (r.maker||r.model||r.serial||r.type||r.name)){
        r.at=Date.now(); L.obs.push(r); if(L.obs.length>6) L.obs.shift();
        if(r.quality==="좋음"||!L.blob) L.blob=blob;
        L.fused=fuseObs(L.obs); L.match=matchLedger(L.fused);
        const m=L.match;
        if(m.lock){ L.status=""; this.setEquip(m.top.e);
          Voice.say(`AI 인식: ${m.top.e.name||typeName(m.top.e.type)}. ${m.top.why.join(", ")}. ${this.liveDiff.length?`대장과 다른 항목 ${this.liveDiff.length}개`:""}`); }
        else if(m.ambiguous){ L.status=`후보 ${m.list.filter(x=>x.sc>=m.top.sc-0.5).length}대 — 시리얼/명판을 가까이 비추세요`; if(L.said!=="amb"){ L.said="amb"; Voice.say("같은 모델 후보가 여러 대입니다. 시리얼이 보이게 비춰 주세요"); } }
        else if(!m.top && L.obs.length>=2){ L.status="대장에 없는 설비 — 신규 등록 가능"; if(L.said!=="new"){ L.said="new"; Voice.say(`${L.fused.maker||""} ${typeName(L.fused.type)}. 대장에 없는 설비입니다. 신규 등록 버튼을 누르세요`); } }
        else L.status=r.tip? "💡 "+r.tip : "판독값 누적 중…";
      }else{ L.status = r&&r.tip? "💡 "+r.tip : "설비가 보이지 않습니다 — 설비/명판을 화면 중앙에"; }
    }catch(e){
      if(/429|한도/.test(e.message)){ L.backoff=Date.now()+30000; L.status="AI 사용 한도 — 30초 후 재시도"; }
      else { L.backoff=Date.now()+8000; L.status="AI 오류: "+e.message.slice(0,60); }
    }
    L.busy=false; L.ver++;
  },

  renderExtra(finishing){

  /* ---- 그리기 ---- */
  draw(){
    const c=this.canvas, x=this.ctx, W=c.width, H=c.height;
    x.fillStyle="#000"; x.fillRect(0,0,W,H);
    if(this.glasses){ this.view(x,0,0,W/2,H); this.view(x,W/2,0,W/2,H); x.fillStyle="#000"; x.fillRect(W/2-2,0,4,H); }
    else this.view(x,0,0,W,H);
    // AI 버튼 상태가 바뀌면 하단 버튼 갱신
    const k=(this.lastAI?this.lastAI.at:0)+":"+(this.session?this.session.items.filter(i=>i.result).length:-1)+":"+(this._unk||"")+":"+(this.equip?this.equip.id:"")+":"+this.live.ver+":"+this.sel.on+":"+this.sel.tags.length;
    if(k!==this._k){ this._k=k; this.renderExtra(); }
  },
  /* 한쪽 화면(일반모드는 전체, 안경모드는 좌/우 눈) */
  view(x,X,Y,W,H){
    const v=this.video, vw=v.videoWidth, vh=v.videoHeight;
    x.save(); x.beginPath(); x.rect(X,Y,W,H); x.clip();
    let sx=0,sy=0,sw=vw,sh=vh,sc=1;
    if(vw){ const ra=W/H; if(vw/vh>ra){ sw=vh*ra; sx=(vw-sw)/2; } else { sh=vw/ra; sy=(vh-sh)/2; } sc=W/sw; x.drawImage(v,sx,sy,sw,sh,X,Y,W,H); }
    const u=Math.max(1, Math.min(W,H)/360)*(this.glasses?0.72:1);   // 글자 크기 기준
    const map=p=>({x:X+(p.x-sx)*sc, y:Y+(p.y-sy)*sc});

    // 조준선
    const L=this.live, F=L.fused, liveOn=L.on&&S.settings.apiKey;
    const showBox = !this.equip && !this.sv.res && !this.sel.tags.length && !this.sel.on && F && F.box && F.box.length===4 && F.box[2]>F.box[0] && vw;
    if(!this.equip && !showBox && !this.sv.res && !this.sv.busy && !this.sel.on && !this.sel.tags.length){ x.strokeStyle="rgba(59,214,198,.7)"; x.lineWidth=2*u; const s=70*u, cx=X+W/2, cy=Y+H/2;
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{ x.beginPath(); x.moveTo(cx+a*s,cy+b*s-b*18*u); x.lineTo(cx+a*s,cy+b*s); x.lineTo(cx+a*s-a*18*u,cy+b*s); x.stroke(); });
      this.text(x, liveOn?"설비·명판을 비추고 📋 현황 등록":"QR을 비추거나 📋 현황 등록",X+W/2,cy+s+26*u,14*u,"#cfe9e6","center"); }
    // 실시간 AI 인식 결과: 설비 위치 박스 + 프레임 누적 판독값(✓n/m = n개 프레임에서 같은 값)
    if(showBox){
      const [y0,x0,y1,x1]=F.box, A=map({x:x0/1000*vw,y:y0/1000*vh}), B=map({x:x1/1000*vw,y:y1/1000*vh});
      const age=Date.now()-(L.obs[L.obs.length-1]||{}).at, col="#a78bfa";
      x.save(); x.globalAlpha=age<5000?1:0.45; x.strokeStyle=col; x.lineWidth=3*u; x.setLineDash([10*u,6*u]); x.strokeRect(A.x,A.y,B.x-A.x,B.y-A.y); x.restore();
      const ag=k=>F[k]?` ✓${F.agree[k]}/${F.n}`:"";
      const m=L.match||{};
      const lines=[`🧠 ${F.name||typeName(F.type)}`, F.maker?`제조사 ${F.maker}${ag("maker")}`:"", F.model?`모델 ${F.model}${ag("model")}`:"", F.serial?`S/N ${F.serial}${ag("serial")}`:"",
        F.status?`상태 ${F.status}`:"", m.top? `대장 후보: ${m.top.e.name||m.top.e.id} (${m.top.why.join("·")})` : (F.n>=2?"대장에 없음 → 신규 등록 가능":"")];
      this.panel(x,Math.max(X+12*u,Math.min(A.x,X+W-232*u)),Math.max(Y+(this.glasses?60:110)*u,A.y-8*u),lines,u,col,"topleft");
    }
    if(!this.equip && liveOn && !this.sv.res && !this.sv.busy){
      const st=(L.busy?"⏳ ":"🧠 ")+(L.status||"실시간 AI 인식 대기");
      this.panel(x,X+W/2,Y+(this.glasses?14:64)*u,[st],u*0.9,"#a78bfa","top",W-24*u);
    }

    // QR 위치 표시 + 설비 라벨(공간 앵커)
    const q=this.qr;
    if(q && Date.now()-q.t<700 && vw){
      const P=q.pts.map(map), eq=findEquip(parseQR(q.text));
      x.strokeStyle=eq?"#3bd6c6":"#f4b740"; x.lineWidth=3*u; x.beginPath(); P.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)); x.closePath(); x.stroke();
      const top=P.reduce((a,p)=>p.y<a.y?p:a), cx=P.reduce((a,p)=>a+p.x,0)/4;
      // 이미 점검 중인 설비면 테두리만, 다른/미등록 설비면 공간 라벨 표시
      if(!(eq && this.equip && eq.id===this.equip.id)){
        const lines= eq? [eq.name||typeName(eq.type), `${eq.id} · ${eq.location||""}`, `최근점검 ${eq.lastInspected?fmt(eq.lastInspected).slice(0,10):"없음"} · ${eq.health||"-"}`]
                       : ["미등록 설비", parseQR(q.text).slice(0,28)];
        this.panel(x,cx,top.y-10*u,lines,u,eq?"#3bd6c6":"#f4b740","bottom");
      }
    }

    // 상단 HUD: 설비 정보
    let yy=Y+(this.glasses?14:64)*u;
    if(this.equip){
      const e=this.equip;
      this.panel(x,X+12*u,yy,[`${typeIc(e.type)} ${e.name||typeName(e.type)}`,`${e.maker||""} ${e.model||""}`.trim()||typeName(e.type),`${e.location||"위치 미입력"}`,`현행화: ${e.sync||"미확인"}`],u,"#2a9df4","topleft");
    }
    // 진행률
    if(this.session){
      const s=this.session, n=s.items.length, done=s.items.filter(i=>i.result).length;
      const bw=W*0.36, bx=X+W-bw-12*u, by=yy;
      x.fillStyle="rgba(11,18,32,.75)"; this.rr(x,bx,by,bw,22*u,6*u); x.fill();
      x.fillStyle="#3bd6c6"; this.rr(x,bx,by,bw*done/n,22*u,6*u); x.fill();
      this.text(x,`${done}/${n} 점검`,bx+bw/2,by+15.5*u,12*u,"#fff","center");
      // 항목 점 표시
      s.items.forEach((it,i)=>{ const cx=bx+(i+.5)*bw/n, cy=by+32*u; x.beginPath(); x.arc(cx,cy,(i===this.step?5:3.5)*u,0,7);
        x.fillStyle=it.result==="정상"?"#4ad991":it.result==="주의"?"#f4b740":it.result==="불량"?"#f4685f":"rgba(255,255,255,.4)"; x.fill(); });
    }
    // 현재 점검항목(하단 카드)
    const bottomPad=this.glasses?16*u:170*u;
    let msgY=Y+H-bottomPad-8*u;
    if(this.session){
      const it=this.cur();
      const lines=[`${this.step+1}. ${it.label}`, it.result?`결과: ${it.result}`:"정상 / 주의 / 불량 을 말하거나 누르세요"];
      if(it.photo) lines[1]+="  📷";
      msgY-=this.panel(x,X+W/2,Y+H-bottomPad,lines,u*1.15,"#3bd6c6","bottom",W-24*u);
    }
    // AI 결과
    const a=this.lastAI;
    if(a){
      const col=a.status==="정상"?"#4ad991":a.status==="주의"?"#f4b740":a.status==="불량"?"#f4685f":"#9fb0cc";
      const lines=[`🤖 AI: ${a.status||"판단불가"}`, a.summary||"", ...(a.findings||[]).slice(0,3).map(f=>"· "+f), ...(a.actions||[]).slice(0,2).map(f=>"→ "+f), ...(a.readings||[]).filter(r=>r.value).slice(0,3).map(r=>`▣ ${r.name} ${r.value}${r.unit||""}`)];
      this.panel(x,X+W-12*u,Y+H*0.30,lines,u*0.95,col,"topright",W*0.62);
    }
    if(this.busy){ this.text(x,"AI 분석 중…",X+W/2,Y+H*0.45,16*u,"#3bd6c6","center"); }
    const sv=this.sv;
    if(sv.busy) this.panel(x,X+W/2,Y+H*0.42,["⏳ "+(sv.status||"명판 판독 중…"),"설비를 그대로 비춰 주세요"],u*1.05,"#2a9df4","center",W-30*u);
    if(sv.res){
      const r=sv.res, e=sv.eq, col=e?(sv.diff.length?"#f4b740":"#4ad991"):"#a78bfa";
      const lines=[ e? `📋 대장 설비: ${e.name||e.id}` : `📋 신규 설비 — "등록"이라고 말하면 저장`,
        `${typeIc(r.type)} ${r.name||typeName(r.type)}`, r.maker?`제조사 ${r.maker}`:"", r.model?`모델 ${r.model}`:"", r.serial?`S/N ${r.serial}`:"", r.mfgDate?`제조 ${r.mfgDate}`:"",
        ...(e? (sv.diff.length? sv.diff.map(d=>`⚠ ${d.label}: 대장 ${d.ledger} → 현장 ${d.field}`) : ["✓ 대장과 일치"]) : []),
        `📍 ${[S.here.building,S.here.floor,S.here.room].filter(Boolean).join(" ")||"위치 미설정(상단 📍)"}`];
      this.panel(x,X+W/2,Y+(this.glasses?40:110)*u,lines,u*1.05,col,"top",W-24*u);
    }
    const n=sv.n; if(n.add+n.ok+n.upd) this.text(x,`조사: 등록 ${n.add} · 확인 ${n.ok} · 갱신 ${n.upd}`,X+W-12*u,Y+H-(this.glasses?8:180)*u,11*u,"#cfe9e6","right");
    if(this.msg && Date.now()<this.msgUntil){ this.panel(x,X+W/2,msgY,[this.msg],u,"#9fb0cc","bottom",W-40*u); }
    // 🎯 선택 인식 태그
    const SEL=this.sel;
    SEL.tags.slice().reverse().forEach((t,i)=>{
      const A=map({x:t.box.x0,y:t.box.y0}), B=map({x:t.box.x1,y:t.box.y1}), age=Date.now()-t.at, r=t.r, latest=t===SEL.last;
      x.save(); x.globalAlpha=latest?1:(age<30000?0.7:0.4); x.strokeStyle="#ffd23f"; x.lineWidth=3*u; x.setLineDash(latest?[]:[8*u,5*u]);
      x.strokeRect(A.x,A.y,B.x-A.x,B.y-A.y);
      // 연결선 + 이름표
      const lines=[`🎯 ${r.what||"알 수 없음"}${r.confidence?` (${Math.round(r.confidence*100)}%)`:""}`, r.category||"", r.partOf?`↳ ${r.partOf}`:"",
        [r.maker,r.model].filter(Boolean).join(" "), r.serial?`S/N ${r.serial}`:"", latest&&r.function?r.function:"", r.state?`상태: ${r.state}`:"",
        ...(latest?(r.readings||[]).filter(q=>q.value).slice(0,3).map(q=>`▣ ${q.name} ${q.value}${q.unit||""}`):[]),
        latest&&r.advice?`💡 ${r.advice}`:"", t.eq?`📋 대장: ${t.eq.name||t.eq.id}`:""];
      const px=Math.max(X+8*u,Math.min(A.x,X+W-(latest?W*0.7:200*u)-8*u)), py=B.y+8*u > Y+H*0.62 ? Math.max(Y+70*u,A.y-8*u) : B.y+8*u;
      if(latest) this.panel(x,px,py,lines.slice(0,11),u,"#ffd23f",(B.y+8*u > Y+H*0.62)?"bottomleft":"topleft",W*0.7);
      else this.panel(x,A.x+4*u,A.y+4*u,[`🎯 ${r.what||"?"}`],u*0.8,"#ffd23f","topleft",Math.max(90*u,B.x-A.x-8*u));
      x.restore();
    });
    if(SEL.busy){ const A=map({x:SEL.busy.x0,y:SEL.busy.y0}), B=map({x:SEL.busy.x1,y:SEL.busy.y1});
      x.save(); x.strokeStyle="#ffd23f"; x.lineWidth=3*u; x.setLineDash([6*u,6*u]); x.lineDashOffset=-(Date.now()/40%24); x.strokeRect(A.x,A.y,B.x-A.x,B.y-A.y); x.restore();
      this.text(x,"🎯 인식 중…",(A.x+B.x)/2,A.y-8*u,13*u,"#ffd23f","center"); }
    if(SEL.drag && !this.glasses){ const g=SEL.drag; x.save(); x.strokeStyle="#ffd23f"; x.lineWidth=2*u; x.setLineDash([6*u,4*u]); x.strokeRect(Math.min(g.x0,g.x1),Math.min(g.y0,g.y1),Math.abs(g.x1-g.x0),Math.abs(g.y1-g.y0)); x.restore(); }
    if(SEL.on && !SEL.busy && !SEL.drag && !this.glasses && !SEL.tags.length) this.panel(x,X+W/2,Y+H*0.5,["🎯 선택 모드","인식할 물체를 탭하거나 끌어서 범위 지정"],u,"#ffd23f","center");
    // 셔터/판정 플래시
    const f=Date.now()-this.flash; if(f<250){ x.fillStyle=`rgba(255,255,255,${.25*(1-f/250)})`; x.fillRect(X,Y,W,H); }
    x.restore();
  },
  rr(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); },
  text(x,t,X,Y,size,col,align="left"){ x.font=`600 ${size}px ${FONT}`; x.textAlign=align; x.fillStyle="rgba(0,0,0,.6)"; x.fillText(t,X+1,Y+1); x.fillStyle=col; x.fillText(t,X,Y); },
  wrap(x,t,maxW){ const out=[]; let line=""; for(const ch of String(t)){ if(x.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch; } if(line) out.push(line); return out; },
  /* 반투명 정보 패널. anchor: topleft | topright | bottom | center */
  panel(x,ax,ay,lines,u,col,anchor,maxW){
    const fs=13*u, lh=fs*1.38, padd=9*u; maxW=maxW||220*u;
    x.font=`600 ${fs}px ${FONT}`;
    let L=[]; lines.filter(l=>l!=="" && l!=null).forEach((l,i)=>this.wrap(x,l,maxW-padd*2).forEach(w=>L.push({t:w,first:i===0})));
    L=L.slice(0,9);
    const w=Math.min(maxW, Math.max(...L.map(l=>x.measureText(l.t).width))+padd*2), h=L.length*lh+padd*2-(lh-fs);
    let X=ax, Y=ay;
    if(anchor==="topright") X=ax-w; else if(anchor==="bottom"){ X=ax-w/2; Y=ay-h; } else if(anchor==="center"){ X=ax-w/2; Y=ay-h/2; } else if(anchor==="top"){ X=ax-w/2; } else if(anchor==="bottomleft"){ Y=ay-h; }
    x.fillStyle="rgba(8,14,26,.78)"; this.rr(x,X,Y,w,h,8*u); x.fill();
    x.fillStyle=col; this.rr(x,X,Y,4*u,h,2*u); x.fill();
    x.textAlign="left";
    L.forEach((l,i)=>{ x.fillStyle=l.first?col:"#e8edf7"; x.fillText(l.t,X+padd+2*u,Y+padd+fs*0.85+i*lh); });
    return h;
  },
};

  async layoutFromVideo(key, capture){
    if(!S.settings.apiKey) return toast("AI 배치에는 API 키가 필요합니다(설정)","bad");
    const el=capture? $("#filePick") : $("#filePickAny");
    el.accept="video/*"; if(capture) el.setAttribute("capture","environment"); el.value="";
    const file=await new Promise(res=>{ el.onchange=()=>res(el.files[0]||null); el.click(); });
    el.accept="image/*";
    if(!file) return;
    const st=$("#lyStat"), say=t=>{ if(st) st.innerHTML=`<p class="note" style="margin-top:10px">⏳ ${esc(t)}</p>`; };
    try{
      say("영상에서 장면 추출 중…");
      const {frames,duration}=await videoFrames(file, 10);
      say(`AI가 ${frames.length}개 장면을 분석해 배치도를 만드는 중… (영상 ${Math.round(duration)}초, 30초~1분 소요)`);
      const roomEq=S.equips.filter(e=>roomKey(e.building,e.floor,e.room)===key), others=S.equips.filter(e=>!roomEq.includes(e));
      const cands=[...roomEq,...others].slice(0,200).map(e=>[e.id,typeName(e.type),e.name,e.maker,e.model,e.serial,e.location].map(v=>String(v||"").replace(/\|/g,"/")).join("|"));
      const r=await callGemini(PROMPT_LAYOUT(roomName(key),frames.length,cands), frames, {maxTokens:8192});
      const L=S.layouts[key]??={items:[]};
      const used=new Set(); let matched=0, fresh=0;
      const items=[];
      for(const it of (r.items||[])){
        let eq=it.match_id && findEquip(it.match_id);
        if(!eq && it.serial) eq=S.equips.find(e=>e.serial && normSN(e.serial)===normSN(it.serial));
        if(eq && used.has(eq.id)) eq=null;
        const clamp=(v,a,b)=>Math.max(a,Math.min(b,+v||0));
        const w=clamp(it.w||10,4,40), h=clamp(it.h||8,4,40);
        const li={id:uid("LI"), equipId:eq?eq.id:null, type:TYPES[it.type]?it.type:(eq?eq.type:"etc"), label:it.label||"", maker:it.maker||"", model:it.model||"", serial:it.serial||"",
          note:it.note||"", x:clamp(it.x,0,100-w), y:clamp(it.y,0,100-h), w, h};
        if(eq){ used.add(eq.id); matched++; } else { fresh++; const fb=frames[(+it.frame||1)-1]||frames[0]; if(fb){ li.photo=uid("PH"); await DB.put(li.photo,fb); } }
        items.push(li);
      }
      // 이전에 손으로 배치한 대장 설비 중 이번에 못 찾은 것은 유지
      const keep=L.items.filter(i=>i.equipId && !used.has(i.equipId));
      L.items=[...items,...keep]; L.desc=r.room&&r.room.desc||""; L.updatedAt=Date.now();
      if(file.size<80*1024*1024){ if(L.video) urlCache[L.video]=null; L.video=uid("VD"); await DB.put(L.video,file); }
      save(); render();
      toast(`배치 완료: 대장 일치 ${matched} · 미등록 ${fresh}`,"good");
      ui.openSheet("layout",{key});
    }catch(e){ if(st) st.innerHTML=""; toast(e.message,"bad"); }
  },
  async rackAnalyze(id, mode, blobs){
    if(!S.settings.apiKey) return toast("랙 분석에는 API 키가 필요합니다(설정)","bad");
    const e=findEquip(id);
    const st=()=>$("#rkStat"), say=t=>{ const x=st(); if(x) x.innerHTML=`<p class="note" style="margin-top:10px">⏳ ${esc(t)}</p>`; };
    try{
      if(!blobs){
        const inp=document.createElement("input"); inp.type="file";
        if(mode==="video"){ inp.accept="video/*"; } else { inp.accept="image/*"; inp.multiple=true; }
        const files=await new Promise(res=>{ inp.onchange=()=>res([...inp.files]); inp.click(); });
        if(!files.length) return;
        if(mode==="video"){ say("영상에서 장면 추출 중…"); blobs=(await videoFrames(files[0],12,1600)).frames; }
        else { say("사진 준비 중…"); blobs=[]; for(const f of files.slice(0,10)) blobs.push(await resizeImage(f,1600,0.85)); }
      }
      say(`AI가 ${blobs.length}장을 종합해 실장 장비를 판독하는 중… (20초~1분)`);
      const r=await callGemini(PROMPT_RACK(blobs.length,e), blobs, {maxTokens:12000});
      const photos=[]; for(const b of blobs.slice(0,6)){ const pid=uid("PH"); await DB.put(pid,b); photos.push(pid); }
      const scan={at:Date.now(), label:(r.rack&&r.rack.label)||"", desc:(r.rack&&r.rack.desc)||"", units:(r.units||[]).map(u=>({...u, kind:u.kind||"장비"})), unreadable:r.unreadable||[], tip:r.tip||"", photos};
      if(e.rackScan){ e.rackHist=[e.rackScan,...(e.rackHist||[])].slice(0,5); }
      e.rackScan=scan; if(!e.photo) e.photo=photos[0]; save();
      toast(`실장 분석 완료: 장비 ${scan.units.filter(isGear).length}대`,"good");
      ui.openSheet("rack",{id});
    }catch(err){ const x=st(); if(x) x.innerHTML=""; toast(err.message,"bad"); }

  async importCSV(){

      const g=i=>i>=0?(r[i]||"").trim():"";
      const id=g(C.id)||newEquipId();
      const rec={id, type:guessType(g(C.type)||g(C.name)), name:g(C.name), maker:g(C.maker), model:g(C.model), serial:g(C.serial), location:g(C.loc), installed:g(C.inst),

  },
  exportEquips(){
    const rows=[["설비ID","종류","명칭","제조사","모델","시리얼","정격","건물","층","실","랙/세부","설치일","현행화상태","현행화확인일","확인자","최근점검","최근판정","비고"]];
    S.equips.forEach(e=>rows.push([e.id,typeName(e.type),e.name,e.maker,e.model,e.serial,e.rating,e.building,e.floor,e.room,e.rack,e.installed,e.sync||"미확인",fmt(e.verifiedAt),e.verifiedBy,fmt(e.lastInspected),e.health,e.memo]));
    download(`설비현행화_${today()}.csv`, toCSV(rows), "text/csv");
  },
  exportInsp(){
    const rows=[["점검ID","설비ID","설비명","종류","점검자","시작","종료","종합","항목번호","점검항목","결과","비고","AI판정","AI요약","AI근거","AI조치"]];
    S.inspections.forEach(s=>s.items.forEach((it,i)=>rows.push([s.id,s.equipId,s.equipName,typeName(s.type),s.inspector,fmt(s.startedAt),fmt(s.endedAt),s.overall,i+1,it.label,it.result||"미점검",it.note,it.ai?.status,it.ai?.summary,(it.ai?.findings||[]).join(" / "),(it.ai?.actions||[]).join(" / ")])));
    download(`점검결과_${today()}.csv`, toCSV(rows), "text/csv");
  },
  printLabels(){
    const list=S.equips; if(!list.length){ toast("설비가 없습니다"); return; }
    $("#print").innerHTML=`<div class="labels">${list.map(e=>{ const q=qrcode(0,"M"); q.addData(QR_PREFIX+e.id); q.make();
      return `<div class="label">${q.createSvgTag({cellSize:2,margin:0,scalable:true})}<div><b>${esc(e.name||typeName(e.type))}</b>${esc(e.id)}<br>${esc(e.location||"")}</div></div>`; }).join("")}</div>`;
    setTimeout(()=>window.print(),100);
  },
  async printReport(id){
    const s=S.inspections.find(i=>i.id===id); const e=findEquip(s.equipId)||{};
    $("#print").innerHTML=`<div class="rep"><h1>설비 점검 보고서</h1>
      <table><tr><th>설비</th><td>${esc(s.equipName)} (${esc(s.equipId)})</td><th>종류</th><td>${esc(typeName(s.type))}</td></tr>
      <tr><th>위치</th><td>${esc(e.location||"")}</td><th>사업장</th><td>${esc(s.site||"")}</td></tr>
      <tr><th>점검자</th><td>${esc(s.inspector||"")}</td><th>일시</th><td>${fmt(s.startedAt)} ~ ${fmt(s.endedAt).slice(11)}</td></tr>
      <tr><th>종합판정</th><td colspan="3"><b>${esc(s.overall)}</b></td></tr></table><br>
      <table><tr><th>#</th><th>점검항목</th><th>결과</th><th>비고 / AI 진단</th><th>사진</th></tr>
      ${s.items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.label)}</td><td>${esc(it.result||"미점검")}</td>
        <td>${esc(it.note||"")}${it.ai?`<br>AI: ${esc(it.ai.status)} — ${esc(it.ai.summary||"")}${(it.ai.actions||[]).length?"<br>조치: "+(it.ai.actions).map(esc).join(", "):""}`:""}</td>
        <td>${it.photo?`<img data-photo="${esc(it.photo)}">`:""}</td></tr>`).join("")}</table></div>`;
    await hydratePhotos($("#print")); setTimeout(()=>window.print(),300);
  },
  backup(){ const d={...S, settings:{...S.settings, apiKey:""}}; download(`AR점검_백업_${today()}.json`, JSON.stringify(d,null,1), "application/json"); toast("사진은 백업에 포함되지 않습니다"); },
  async restore(){
    const f=await pickFile(".json,application/json"); if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(!Array.isArray(d.equips)) throw 0; const key=S.settings.apiKey;
      S={...blankState(), ...d, settings:{...blankState().settings, ...d.settings, apiKey:key}}; save(); render(); toast("복원 완료","good"); }
    catch(_){ toast("올바른 백업 파일이 아닙니다","bad"); }
  },
  async reset(){ if(!confirm("모든 설비·점검·사진 데이터를 삭제합니다. 계속할까요?")) return; const key=S.settings.apiKey; S=blankState(); S.settings.apiKey=key; save(); await DB.clear(); render(); toast("초기화됨"); },
};
window.ui=ui;

/* 시작 */
S.layouts=S.layouts||{}; S.here=S.here||{}; migrateLoc();
ui.tab(S.tab==="ar"?"home":(S.tab||"home"));
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("service-worker.js").catch(()=>{});
</script>
</body>
</html>
