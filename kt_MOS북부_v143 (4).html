  function setResultClass(btnGroup, item){
    btnGroup.querySelectorAll("button").forEach(b=>{
      b.classList.remove("active","good","bad","na");
      if(b.dataset.val === item.result && item.result){
        b.classList.add("active", b.dataset.cls);
      }
    });
  }

  function buildItemEl(cat, loc, item){
  /* ── 다중 측정값(온·습도, 열화상 ΔT 등) ──
     item.fields = [{k:"온도",u:"℃"},…] 가 있으면 칸을 여러 개 렌더링한다.
     개별 값은 item.vals{}에 저장하고, item.value 에는 합성 문자열을 넣어
     기존 워드/엑셀 출력 로직이 그대로 동작하도록 한다. */
  // fieldsOf() 는 IIFE 최상위로 이동 — 워드 내보내기(buildWordReport)에서도 필요하다.
  function readVals(item){
    const fs = fieldsOf(item); if(!fs) return null;
    if(item.vals && typeof item.vals === "object") return item.vals;
    const nums = String(item.value||"").match(/-?\d+(?:\.\d+)?/g) || [];
    const out = {};
    fs.forEach((f,i)=>{ out[f.k] = (nums[i] !== undefined) ? nums[i] : ""; });
    item.vals = out;
    return out;
  }
  function composeVals(item){
    const fs = fieldsOf(item); if(!fs) return item.value || "";
    const v = item.vals || {};
    return fs.filter(f => String(v[f.k]||"").trim() !== "")
             .map(f => f.k + " " + String(v[f.k]).trim() + (f.u||""))
             .join(" / ");
  }
  function deltaHint(item){
    const fs = fieldsOf(item); if(!fs || !item.delta) return "";
    const v = item.vals || {};
    const a = parseFloat(v[item.delta[0]]), b = parseFloat(v[item.delta[1]]);
    if(isNaN(a) || isNaN(b)) return "";
    const d = a - b;
    return "ΔT " + (d>0?"+":"") + d.toFixed(1) + "℃" + (d > 20 ? "  ⚠ 기준(20℃) 초과" : "");
  }

    const row = document.createElement("div");
    row.className = "item";

    const top = document.createElement("div");
    top.innerHTML = `<div class="item-name">${escapeHtml(item.name)}</div>` +
      (item.std ? `<div class="item-std">📌 기준: ${escapeHtml(item.std)}</div>` : "");
    row.appendChild(top);

    // segmented result control
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.innerHTML = `
      <button data-val="양호" data-cls="good">적합</button>
      <button data-val="불량" data-cls="bad">부적합</button>
      <button data-val="해당없음" data-cls="na">해당없음</button>
    `;
    setResultClass(seg, item);
    seg.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        item.result = (item.result===b.dataset.val) ? "" : b.dataset.val;
        setResultClass(seg, item);
        refreshBadges();
        // 보안/접지저항 항목의 해당없음 상태가 바뀌면 위치 비고를 자동 갱신
        if(isAutoMemoItem(item) && applyAutoMemo(cat, loc)) syncMemoUI(cat, loc);
        scheduleSave();
      };
    });
    row.appendChild(seg);

    // value input
    if(item.hasValue){
      const fs = fieldsOf(item);
      const vrow = document.createElement("div");
      if(fs){
        vrow.className = "value-row multi";
        const cur = readVals(item);
        vrow.innerHTML = fs.map(f=>`<label class="vfield"><span class="vfield-k">${escapeHtml(f.k)}</span><input class="value-input" inputmode="decimal" data-k="${escapeHtml(f.k)}" placeholder="0" value="${escapeHtml(cur[f.k]||"")}"><span class="value-unit">${escapeHtml(f.u||"")}</span></label>`).join("")
          + `<div class="vdelta">${escapeHtml(deltaHint(item))}</div>`;
        const dEl = vrow.querySelector(".vdelta");
        vrow.querySelectorAll("input").forEach(inp=>{
          inp.addEventListener("input", ()=>{
            item.vals = item.vals || {};
            item.vals[inp.dataset.k] = inp.value;
            item.value = composeVals(item);
            if(dEl) dEl.textContent = deltaHint(item);
            scheduleSave();
          });
        });
      } else {
        vrow.className = "value-row";
        vrow.innerHTML = `<input class="value-input" inputmode="decimal" placeholder="측정값 입력" value="${escapeHtml(item.value||"")}"><span class="value-unit">${escapeHtml(item.unit||"")}</span>`;
        const input = vrow.querySelector("input");
        input.addEventListener("input", ()=>{ item.value = input.value; scheduleSave(); });
      }
      row.appendChild(vrow);
    }

    // 기존 메모가 있으면 작게 표시 (수정 불가 — 위치 메모에서 통합 관리)
    if(item.note){
      const noteLine = document.createElement("div");
      noteLine.style.cssText = "font-size:11.5px;color:var(--muted);padding:4px 0 2px;line-height:1.4;";
      noteLine.textContent = "💬 " + item.note;
      row.appendChild(noteLine);
    }

    return row;
  }

  /* 사진 선택 기본값: 사용자가 아직 직접 고르지 않았으면 사진 4장을 자동 선택한다(첫·마지막 포함, 사이 균등).
     - loc.selManual 이 true 가 되면(사용자가 ✓를 한 번이라도 누르면) 그 선택을 그대로 보존한다.
       → 자동으로 들어간 뒤에도 지금처럼 다른 사진으로 자유롭게 바꿀 수 있다.
     - 사진을 한 장씩 촬영하는 도중에는 selManual 이 false라 매번 4장 기준으로 다시 계산된다.
     - 선택을 전부 해제하면 selManual 이 false로 돌아가 다시 4장 기본값이 된다. */
  /* 사진 4장을 고르게 뽑는다: 첫 장·마지막 장은 항상 포함하고 사이를 균등 간격으로 채운다.
     - 사진이 n장 미만이면 있는 만큼 전부 선택. */
  function pickSpread(arr, n){
    const len = arr.length;
    if(len <= n) return arr.slice();
    const out = [];
    for(let i=0;i<n;i++) out.push(arr[Math.round(i*(len-1)/(n-1))]);
    return [...new Set(out)];   // 혹시 겹치면 중복 제거(순서 유지)
  }

  function autoPickDefaults(loc){
    if(!loc.photos || !loc.photos.length) return false;
    if(!loc.selectedPhotos) loc.selectedPhotos = [];
    const before = loc.selectedPhotos.join("|");
    const valid = loc.selectedPhotos.filter(k=>loc.photos.includes(k));
    // 이전 버전 데이터: 선택이 이미 있으면 사용자가 고른 것으로 간주해 보존
    if(loc.selManual === undefined && valid.length) loc.selManual = true;
    // 수동 선택은 '유효한 사진이 1장이라도 남아 있을 때'만 존중한다.
    // 동기화·재가져오기 등으로 사진 키가 새로 발급되면 예전 selectedPhotos 가
    // 전부 무효가 되는데, 그대로 두면 선택 0장이 되어 워드에 사진이 한 장도
    // 들어가지 않는다(빈 2×2 칸). 이 경우 자동 선택으로 되돌린다.
    if(loc.selManual && valid.length){
      loc.selectedPhotos = valid;                 // 사용자 선택 유지(삭제된 키만 정리)
    } else {
      loc.selManual = false;
      loc.selectedPhotos = pickSpread(loc.photos, 4);  // 첫·마지막 포함 4장 자동
    }
    return loc.selectedPhotos.join("|") !== before; // 변경 여부
  }

  async function renderCatPhotoStrip(cat, loc, pstrip){
    if(!loc.photos) loc.photos = [];
    if(!loc.selectedPhotos) loc.selectedPhotos = [];
    if(autoPickDefaults(loc)){ scheduleSave(); refreshCatPhotoCount(); }
    pstrip.innerHTML = "";
    for(const key of loc.photos){
      const dataUrl = await sGet(key);
      if(!dataUrl) continue;
      const isSel = loc.selectedPhotos.includes(key);
      const isBad = (loc.badPhotos||[]).includes(key);
      const tw = document.createElement("div");
      tw.className = "photo-thumb-wrap" + (isSel?" picked":"") + (isBad?" bad":"");
      tw.innerHTML = `<img class="photo-thumb" src="${dataUrl}"><button class="photo-corner${isBad?' bad':''}" title="탭: 부적합 표시 · 길게: 삭제">${isBad?'⚠️':'×'}</button>${isBad?'<span class="photo-bad-tag">부적합</span>':''}<button class="photo-pick${isSel?' on':''}" title="워드 선택 사진">${isSel?'✓':''}</button>`;
      tw.querySelector("img").onclick = ()=> openPhotoView(dataUrl, loc, key, ()=>{ renderCatPhotoStrip(cat, loc, pstrip); refreshCatPhotoCount(); });
      tw.querySelector(".photo-pick").onclick = (ev)=>{
        ev.stopPropagation();
        const i = loc.selectedPhotos.indexOf(key);
        if(i>=0) loc.selectedPhotos.splice(i,1);
        else loc.selectedPhotos.push(key);
        // 직접 고르면 수동 모드(자동값이 덮어쓰지 않음). 전부 해제하면 다시 자동(첫+마지막).
        loc.selManual = loc.selectedPhotos.length > 0;
        scheduleSave();
        renderCatPhotoStrip(cat, loc, pstrip);
        rerenderTabBar(cat);      // 위치 탭의 ✅선택수 즉시 갱신
        refreshCatPhotoCount();   // 설비 카드 배지의 ✅선택수 즉시 갱신
      };
      // 코너 버튼: 짧게 탭 = 부적합 토글, 길게 누르기(600ms) = 삭제
      const cornerBtn = tw.querySelector(".photo-corner");
      let pressTimer = null, longFired = false;
      const doDelete = async ()=>{
        await sDelete(key);
        loc.photos = loc.photos.filter(k=>k!==key);
        if(loc.selectedPhotos) loc.selectedPhotos = loc.selectedPhotos.filter(k=>k!==key);
        if(loc.badPhotos) loc.badPhotos = loc.badPhotos.filter(k=>k!==key);
        if(loc.photoMeta && loc.photoMeta[key]){
          const origKey = loc.photoMeta[key].origKey;
          if(origKey){ try{ await sDelete(origKey); }catch(e){} }
          delete loc.photoMeta[key];
        }
        scheduleSave();
        renderCatPhotoStrip(cat, loc, pstrip);
        refreshCatPhotoCount();
        rerenderTabBar(cat);
      };
      const toggleBad = ()=>{
        if(!loc.badPhotos) loc.badPhotos = [];
        const i = loc.badPhotos.indexOf(key);
        if(i>=0) loc.badPhotos.splice(i,1); else loc.badPhotos.push(key);
        scheduleSave();
        renderCatPhotoStrip(cat, loc, pstrip);
        refreshCatPhotoCount();
      };
      const startPress = (ev)=>{
        ev.stopPropagation();
        longFired = false;
        pressTimer = setTimeout(()=>{
          longFired = true;
          if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
          if(confirm("이 사진을 삭제할까요?")) doDelete();
        }, 600);
      };
      const endPress = (ev)=>{
        ev.stopPropagation();
        if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
        if(!longFired) toggleBad();  // 짧게 탭 = 부적합 토글
      };
      const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
      cornerBtn.addEventListener("touchstart", startPress, {passive:true});
      cornerBtn.addEventListener("touchend", endPress);
      cornerBtn.addEventListener("touchmove", cancelPress, {passive:true});
      cornerBtn.addEventListener("mousedown", startPress);
      cornerBtn.addEventListener("mouseup", endPress);
      cornerBtn.addEventListener("mouseleave", cancelPress);
      pstrip.appendChild(tw);
    }
    // Add buttons: camera + gallery
    const addCam = document.createElement("button");
    addCam.className = "photo-add";
    addCam.innerHTML = `<span>📸</span>촬영`;
    addCam.onclick = ()=> openCatPhotoBoardSheet(cat, loc, pstrip, true);
    pstrip.appendChild(addCam);

    const addGal = document.createElement("button");
    addGal.className = "photo-add";
    addGal.innerHTML = `<span>📷</span>갤러리`;
    addGal.onclick = ()=> openCatPhotoBoardSheet(cat, loc, pstrip, false);
    pstrip.appendChild(addGal);
  }

  function rerenderTabBar(cat){
    const grid = sliderOf(cat);
    if(!grid) return;
    const activeId = activeLocIds[cat.id];
    const cards = grid.querySelectorAll(".loc-card");
    cat.locations.forEach((loc, idx)=>{
      if(!cards[idx]) return;
      cards[idx].replaceWith(buildLocCard(cat, loc, loc.id===activeId));
    });
  }


  function refreshCatPhotoCount(){
    let total = 0;
    current.categories.forEach(c=> c.locations.forEach(l=> total += (l.photos||[]).length));
    const el = document.querySelectorAll(".progress-text")[1];
    if(el) el.textContent = `📷 ${total}장`;
    // Update per-category header badge
    current.categories.forEach((cat)=>{
      const el = catElOf(cat);
      if(!el) return;
      const cnt = cat.locations.reduce((s,l)=> s+(l.photos||[]).length, 0);
      let badge = el.querySelector(".photo-cnt");
      if(cnt > 0){
        if(!badge){
          badge = document.createElement("span");
          badge.className = "photo-cnt";
          badge.style.cssText = "font-size:11px;color:var(--good);font-weight:700;";
          const badgeArea = el.querySelector(".cat-head > div:last-child");
          if(badgeArea) badgeArea.insertBefore(badge, badgeArea.firstChild);
        }
        const selTot = cat.locations.reduce((a,l)=> a+selCount(l), 0);
        badge.textContent = `📷${cnt}` + (selTot?`·✅${selTot}`:"");
      } else if(badge){ badge.remove(); }
      // 부적합 배지 갱신
      const badCnt = cat.locations.reduce((s,l)=> s+(l.badPhotos||[]).length, 0);
      let badBadge = el.querySelector(".cat-bad-cnt");
      const badgeArea2 = el.querySelector(".cat-head > div:last-child");
      if(badCnt > 0){
        if(!badBadge){
          badBadge = document.createElement("span");
          badBadge.className = "cat-bad-cnt";
          badBadge.style.cssText = "font-size:11px;color:#fff;background:#E5484D;font-weight:800;border-radius:6px;padding:1px 6px;";
          if(badgeArea2){ badgeArea2.insertBefore(badBadge, badge ? badge.nextSibling : badgeArea2.firstChild); }
        }
        badBadge.textContent = `⚠️${badCnt}`;
      } else if(badBadge){ badBadge.remove(); }
    });
  }

  function openCatPhotoBoardSheet(cat, loc, pstrip, useCamera){

    ov.innerHTML = `
      <div class="sheet">
        <div class="sheet-title">${useCamera?"📸 사진 촬영":"📷 갤러리 선택"}</div>
        ${!useCamera ? `
        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:12px;">
          <div>
            <div style="font-size:13.5px;font-weight:700;color:var(--ink);">동산보드 합성</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">사진에 국소명·위치 정보 표 삽입</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="pb-use-board" ${boardDefault?"checked":""}>
            <span class="toggle-track"></span>

        <div id="pb-board-fields" style="${!useCamera && !boardDefault ? 'opacity:.4;pointer-events:none;' : ''}">
          <div class="field-label">국소명</div>

          <div class="field-label">건물명</div>

          <div class="field-label">적합/부적합</div>

            <button data-val="적합">적합</button>
            <button data-val="부적합">부적합</button>
            <button data-val="해당없음">해당없음</button>
          </div>
          <div class="field-label">비고</div>
          <textarea class="note-area" id="pb-note" style="margin-top:0;"></textarea>

        <div class="sheet-btn-row" style="gap:8px;margin-top:12px;">
          <button class="outline-btn" id="pb-cancel" style="flex:1;">취소</button>

    document.body.appendChild(ov);
    ov.addEventListener("click",(e)=>{ if(e.target===ov) ov.remove(); });

    // 동산보드 토글 (갤러리 모드만)
    const boardToggle = ov.querySelector("#pb-use-board");
    const boardFields = ov.querySelector("#pb-board-fields");
    const locInput = ov.querySelector("#pb-location");
    const goBtn = ov.querySelector("#pb-go");

    let useBoard = boardDefault;
    if(boardToggle){
      boardToggle.onchange = ()=>{
        useBoard = boardToggle.checked;
        window._lastBoardChoice = useBoard;
        boardFields.style.opacity = useBoard ? "1" : ".4";
        boardFields.style.pointerEvents = useBoard ? "" : "none";
        refreshGo();
      };
    }

    const refreshGo = ()=>{
      if(useCamera || useBoard){
        goBtn.disabled = !locInput.value.trim();
      } else {
        goBtn.disabled = false; // 보드 없이 갤러리: 바로 열기
      }
    };
    locInput && locInput.addEventListener("input", refreshGo);
    refreshGo();

    let statusVal = "";
    const seg = ov.querySelector("#pb-status-seg");
    
    // 성능점검, 유지보수 1번만 "적합" 기본 선택
    if(current.inspType !== "유지보수2"){
      statusVal = "적합";
    }
    
    seg && seg.querySelectorAll("button").forEach(b=>{
      // 초기값 설정 (성능, 1번만 "적합" 자동 선택)
      if(current.inspType !== "유지보수2" && b.dataset.val === "적합"){
        b.classList.add("active", "good");
      }
      
      b.onclick = ()=>{
        statusVal = (statusVal===b.dataset.val) ? "" : b.dataset.val;
        seg.querySelectorAll("button").forEach(bb=>{ bb.classList.remove("active","good","bad","na"); });
        if(statusVal===b.dataset.val){
          const cls = statusVal==="적합"?"good":statusVal==="부적합"?"bad":"na";
          b.classList.add("active", cls);
        }
      };
    });

    ov.querySelector("#pb-cancel").onclick = ()=> ov.remove();
    goBtn.onclick = ()=>{
      const location = locInput ? locInput.value.trim() : "";
      if((useCamera || useBoard) && !location) return;
      const building = ov.querySelector("#pb-building") ? ov.querySelector("#pb-building").value.trim() : "";
      const note = ov.querySelector("#pb-note") ? ov.querySelector("#pb-note").value.trim() : "";
      if(building) current.buildingName = building;
      if(location) current.lastDetailLocation = location;
      scheduleSave();

      const board = (useCamera || useBoard)
        ? { siteName: current.siteName, buildingName: building, location, equipment: cat.name, status: statusVal, note }
        : null; // 보드 없음 → null 전달 → 원본 사진만 저장

      pendingPhotoTarget = { cat, loc, pstrip, board };
      ov.remove();
      if(useCamera){ photoFileInput.setAttribute("capture","environment"); photoFileInput.removeAttribute("multiple"); photoFileInput.click(); }
      else {
        // 갤러리 다중선택: 매번 새 input 생성 (브라우저 호환성 최대화)
        const galleryInput = document.createElement("input");
        galleryInput.type = "file";
        galleryInput.accept = "image/*";
        galleryInput.multiple = true;
        galleryInput.style.display = "none";
        document.body.appendChild(galleryInput);
        galleryInput.addEventListener("change", async (gev)=>{
          const files = Array.from(gev.target.files || []);
          galleryInput.remove();
          if(!files.length) return;
          // pendingPhotoTarget에 이미 저장된 cat/loc/pstrip/board 사용
          const addBtns = pstrip.querySelectorAll(".photo-add");
          addBtns.forEach(b=>{ b.innerHTML="처리중…"; b.disabled=true; });
          let savedCount=0, failCount=0;
          for(const file of files){
            let dataUrl=null;
            let origData=null;
            let boardApplied=true;
            try{
              if(board){
                try{ origData = await compressImage(file, 900, 0.82); }catch(e){ origData = null; }
              }
              if(board && origData){
                dataUrl = await composeBoardFromDataUrl(origData, board, 900);
              } else if(board){
                dataUrl = await composePhotoWithBoard(file, board, 900);
              } else {
                boardApplied = false;
                dataUrl = await compressImage(file, 900, 0.6);
              }
            }
            catch(e){
              boardApplied = false;
              try{ dataUrl = await compressImage(file, 900, 0.6); }
              catch(e2){ try{ dataUrl = await readAsDataURL(file); }catch(e3){} }
            }
            if(!dataUrl){ failCount++; continue; }
            autoSaveToGallery(dataUrl, cat.name);
            const key = "photo:"+current.id+":cat:"+cat.id+":loc:"+loc.id+":"+uid();
            const saved = await sSet(key, dataUrl);
            if(!saved){ failCount++; continue; }
            if(!loc.photos) loc.photos=[];
            loc.photos.push(key);
            // ── 원본 + 동산보드 메타 저장 (재합성용) ──
            if(board && boardApplied && origData){
              const origKey = "photoOrig:"+current.id+":cat:"+cat.id+":loc:"+loc.id+":"+uid();
              const origSaved = await sSet(origKey, origData);
              if(origSaved){
                if(!loc.photoMeta) loc.photoMeta = {};
                loc.photoMeta[key] = { origKey, board: {...board} };
              }
            }
            savedCount++;
          }
          scheduleSave();
          renderCatPhotoStrip(cat, loc, pstrip);
          refreshCatPhotoCount();
          rerenderTabBar(cat);
          if(savedCount>0) showToast(files.length>1?`사진 ${savedCount}장 추가됐습니다.`:"사진이 추가됐습니다.");
          else showToast("사진 처리에 실패했습니다.");
        });
        // 동기적으로 click — iOS/Android 모두 정상 동작
        galleryInput.click();
      }
    };
  }

  function mapResultToStatus(result){
    if(result === "양호") return "적합";
    if(result === "불량") return "부적합";
    if(result === "해당없음") return "해당없음";

  photoFileInput.addEventListener("change", async (ev)=>{
    const files = Array.from(ev.target.files || []);
    photoFileInput.value = "";
    if(!files.length || !pendingPhotoTarget) return;
    const {cat, loc, pstrip, board} = pendingPhotoTarget;

    const addBtns = pstrip.querySelectorAll(".photo-add");
    addBtns.forEach(b=>{ b.innerHTML = "처리중…"; b.disabled = true; });

    let savedCount = 0;
    let failCount  = 0;

    for(const file of files){
      let dataUrl = null;
      let origData = null;
      let boardApplied = true;
      try{
        // 재합성을 위해 원본(정보표 없는 버전)을 먼저 확보
        if(board){
          try{ origData = await compressImage(file, 900, 0.82); }catch(e){ origData = null; }
        }
        if(board && origData){
          dataUrl = await composeBoardFromDataUrl(origData, board, 900);
        } else {
          dataUrl = await composePhotoWithBoard(file, board, 900);
        }
      }catch(e){
        boardApplied = false;
        try{ dataUrl = await compressImage(file, 900, 0.6); }
        catch(e2){
          try{ dataUrl = await readAsDataURL(file); }
          catch(e3){ dataUrl = null; }
        }
      }

      if(!dataUrl){ failCount++; continue; }

      // ── 모바일에서만 갤러리 자동 저장 ──
      autoSaveToGallery(dataUrl, cat.name);

      const key = "photo:"+current.id+":cat:"+cat.id+":loc:"+loc.id+":"+uid();
      const saved = await sSet(key, dataUrl);
      if(!saved){ failCount++; continue; }

      const verify = await sGet(key);
      if(!verify){ await sDelete(key); failCount++; continue; }

      if(!loc.photos) loc.photos = [];
      loc.photos.push(key);

      // ── 원본 + 동산보드 메타 저장 (위치 수정 시 재합성용) ──
      if(board && boardApplied && origData){
        const origKey = "photoOrig:"+current.id+":cat:"+cat.id+":loc:"+loc.id+":"+uid();
        const origSaved = await sSet(origKey, origData);
        if(origSaved){
          if(!loc.photoMeta) loc.photoMeta = {};
          loc.photoMeta[key] = { origKey, board: {...board} };
        }
      }
      savedCount++;
    }

    scheduleSave();
    renderCatPhotoStrip(cat, loc, pstrip);
    refreshCatPhotoCount();
    rerenderTabBar(cat);

    if(savedCount > 0 && failCount === 0){
      showToast(files.length > 1 ? `사진 ${savedCount}장이 추가됐습니다.` : "사진이 추가됐습니다.");
    } else if(savedCount > 0){
      showToast(`${savedCount}장 추가 완료 (${failCount}장 실패)`);
    } else {
      showToast("사진을 처리하지 못했습니다. 다시 시도해주세요.");
    }
  });

  // ── 모바일 기기 여부 판별 ──
  function isMobileDevice(){
    return /Android|iPhone|iPad|iPod|Mobile|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  }

  // ── 갤러리 자동 저장 (모바일 전용) ──
  function autoSaveToGallery(dataUrl, catName){
    if(!isMobileDevice()) return; // PC/노트북에서는 저장 팝업 방지
    try{
      const now = new Date();
      const pad = n => String(n).padStart(2,'0');
      const fname = `점검사진_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}_${(catName||'설비').slice(0,8)}.jpg`;
      const byteStr = atob(dataUrl.split(',')[1]);
      const arr = new Uint8Array(byteStr.length);
      for(let i=0;i<byteStr.length;i++) arr[i]=byteStr.charCodeAt(i);
      const blob = new Blob([arr], {type:'image/jpeg'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 3000);
    }catch(e){ console.warn('갤러리 자동저장 실패:', e.message); }
  }

  function readAsDataURL(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // 이미지에 동산보드(정보표)를 그려 dataURL 반환 (공통)
  function drawBoardCanvas(img, board, maxW){
    let w = img.width, h = img.height;
    if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }

    const rows = [
      ["국소명",      board.siteName     || ""],
      ["건물명",      board.buildingName  || ""],
      ["상세위치",    board.location      || ""],
      ["설비명",      board.equipment     || ""],
      ["적합/부적합", board.status        || ""],
      ["비고",        board.note          || ""],
    ];

    const boardW  = Math.round(w * 0.38);
    const rowH    = Math.max(18, Math.round(h * 0.035));
    const boardH  = rowH * rows.length;
    const labelW  = Math.round(boardW * 0.38);
    const baseFont = Math.max(9, Math.round(rowH * 0.48));
    const lineW   = Math.max(1, Math.round(w * 0.0018));

    const canvas = document.createElement("canvas");
    canvas.width  = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);

    const bx = 0;
    const by = h - boardH;

    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fillRect(bx, by, boardW, boardH);

    ctx.lineWidth    = lineW;
    ctx.strokeStyle  = "#111";
    ctx.textBaseline = "middle";

    rows.forEach((r, i)=>{
      const ry = by + i * rowH;
      ctx.strokeRect(bx,          ry, labelW,          rowH);
      ctx.strokeRect(bx + labelW, ry, boardW - labelW, rowH);
      fitText(ctx, r[0], bx + 4,          ry + rowH/2, labelW - 8,          baseFont, true);
      fitText(ctx, r[1], bx + labelW + 4, ry + rowH/2, boardW - labelW - 8, baseFont, false);
    });

    return canvas.toDataURL("image/jpeg", 0.82);
  }

  // 파일(File)에 동산보드 합성
  function composePhotoWithBoard(file, board, maxW){
    return new Promise((resolve, reject)=>{
      if(!board){ reject(new Error("no board")); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{ try{ resolve(drawBoardCanvas(img, board, maxW)); }catch(e){ reject(e); } };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // dataURL(원본)에 동산보드 재합성 — 위치 수정 시 사용
  function composeBoardFromDataUrl(dataUrl, board, maxW){
    return new Promise((resolve, reject)=>{
      if(!board || !dataUrl){ reject(new Error("no board/data")); return; }
      const img = new Image();
      img.onload = ()=>{ try{ resolve(drawBoardCanvas(img, board, maxW)); }catch(e){ reject(e); } };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  // 위치/건물명 수정 시 해당 위치의 동산보드 사진 재합성
  async function recomposeLocationPhotos(cat, loc){
    if(!loc.photoMeta) return 0;
    const keys = Object.keys(loc.photoMeta);
    if(!keys.length) return 0;
    let n = 0;
    for(const key of keys){
      const meta = loc.photoMeta[key];
      if(!meta || !meta.origKey) continue;
      let orig = null;
      try{ orig = await sGet(meta.origKey); }catch(e){ orig = null; }
      if(!orig) continue; // 원본 없으면 재합성 불가 (기존 사진)
      // 최신 정보로 갱신
      meta.board = {
        ...meta.board,
        siteName:     current.siteName || meta.board.siteName || "",
        buildingName: current.buildingName || meta.board.buildingName || "",
        location:     loc.name || meta.board.location || "",
        equipment:    cat.name
      };
      let composed = null;
      try{ composed = await composeBoardFromDataUrl(orig, meta.board, 900); }catch(e){ composed = null; }
      if(!composed) continue;
      const ok = await sSet(key, composed); // 기존 합성본 덮어쓰기
      if(ok) n++;
    }
    if(n) scheduleSave();
    return n;
  }

  function fitText(ctx, text, x, yMid, maxWidth, baseFontPx, bold){
    if(!text) return;
    let fontPx = baseFontPx;
    function setFont(){ ctx.font = (bold ? "bold " : "") + fontPx + "px sans-serif"; }
    setFont();
    while(fontPx > 10 && ctx.measureText(text).width > maxWidth){
      fontPx -= 1;
      setFont();
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - 2, yMid - fontPx, maxWidth + 4, fontPx * 2);
    ctx.clip();
    ctx.fillStyle = "#000";
    ctx.fillText(text, x, yMid);
    ctx.restore();
  }

  function compressImage(file, maxW, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

      const cp = categoryProgress(cat);
      const badge = wrap.querySelector(".cat-badge");
      badge.textContent = cp.done+"/"+cp.total;
      badge.classList.remove("done","partial");
      if(cp.total>0 && cp.done>0) badge.classList.add(cp.done===cp.total ? "done":"partial");

        const its = loc.items||[];

        btn.classList.toggle("active", g);

    const ptext = document.querySelector(".progress-text");
    if(ptext) ptext.textContent = p.done+"/"+p.total+" 완료 · "+p.pct+"%";
    const filledBars = Math.min(5, Math.ceil(p.pct/20));
    document.querySelectorAll(".signal i").forEach((bar,i)=>{
      bar.classList.toggle("on", i < filledBars);

  }

  async function analyzePhotoForEquipment(imageData){
    try {
      prog.textContent = "🤖 AI 분석 중...";
      
      const result = await Tesseract.recognize(
        imageData,
        "kor+eng",
        {logger: m => console.log("Tesseract:", m.status, Math.round(m.progress*100)+"%")}
      );
      
      const text = result.data.text.toUpperCase();
      console.log("인식된 텍스트:", text);
      
      // 설비명 자동 판단
      let detectedEquipment = null;
      for(const [equipment, keywords] of Object.entries(EQUIPMENT_KEYWORDS)){
        if(keywords.some(kw => text.includes(kw.toUpperCase()))){
          detectedEquipment = equipment;
          break;
        }
      }
      
      return detectedEquipment || null;
    } catch(err){
      console.error("AI 분석 오류:", err);
      return null;
    }
  }

  async function buildWordReport(onProgress, selectedOnly){
    // 선택 사진만 모드: 아직 열어보지 않은 위치도 기본 선택(첫+마지막)이 반영되도록 먼저 적용
    if(selectedOnly){
      let changed = false;
      current.categories.forEach(cat=> cat.locations.forEach(loc=>{ if(autoPickDefaults(loc)) changed = true; }));
      if(changed) scheduleSave();
    }
    // 선택 사진만 모드: 각 위치에서 선택된 사진만 사용 (선택 없으면 그 위치는 사진 없음 처리)
    const photosOf = (loc)=>{
      const all = loc.photos||[];
      if(!selectedOnly) return all;
      const sel = (loc.selectedPhotos||[]).filter(k=>all.includes(k));
      // 안전장치: 사진은 있는데 유효한 선택이 하나도 없으면(키 불일치 등)
      // 사진 없이 내보내지 말고 자동 4장으로 대체한다.
      if(!sel.length && all.length) return pickSpread(all, 4);
      return sel;
    };
    onProgress("사진 불러오는 중…");
    const photoCache = {};
    let loaded = 0, total = 0;
    current.categories.forEach(cat=> cat.locations.forEach(loc=>{ total += photosOf(loc).length; }));
    for(const cat of current.categories){
      for(const loc of cat.locations){
        for(const key of photosOf(loc)){
          const data = await sGet(key);
          if(data) photoCache[key] = data;
          else console.warn("[사진] 로드 실패 key:", key);
          loaded++;
          onProgress(`사진 불러오는 중… (${loaded}/${total})`);
        }
      }
    }

    onProgress("라이브러리 로딩 중…");
    if(!window.JSZip){
      const cdns = [
        "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
        "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
        "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"
      ];
      const loadScript = (src)=> new Promise((res,rej)=>{
        const s = document.createElement("script");
        s.src = src; s.onload = ()=>res(true); s.onerror = ()=>rej(new Error("load fail"));
        document.head.appendChild(s);
      });
      let loaded = false;
      for(const url of cdns){
        try{ await loadScript(url); if(window.JSZip){ loaded = true; break; } }
        catch(e){ /* 다음 CDN 시도 */ }
      }
      if(!loaded || !window.JSZip){
        throw new Error("워드 생성에 필요한 파일을 불러오지 못했습니다. 인터넷(Wi‑Fi/데이터)이 연결됐는지 확인 후 다시 시도해주세요.");
      }
    }

    onProgress("워드 문서 생성 중…");
    const p = computeProgress(current);
    const bad = [];
    current.categories.forEach(cat=>{
      cat.locations.forEach(loc=>{
        loc.items.forEach(it=>{ if(it.result==="불량") bad.push({cat:cat.name, loc:loc.name||"", item:it.name, note:it.note||""}); });
      });
    });

    // ── XML helpers ──
    const x = s=> String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const rpr = (o={})=>
      `<w:rPr><w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="Malgun Gothic" w:cs="Malgun Gothic"/>`+
      (o.bold?"<w:b/><w:bCs/>":"")+
      `<w:sz w:val="${o.sz||20}"/><w:szCs w:val="${o.sz||20}"/>`+
      (o.color?`<w:color w:val="${o.color}"/>`:"")+"</w:rPr>";
    const run  = (t,o={})=>`<w:r>${rpr(o)}<w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
    const para = (inner,o={})=>{
      let ppr="";
      const parts=[];
      if(o.align) parts.push(`<w:jc w:val="${o.align}"/>`);
      if(o.after!==undefined) parts.push(`<w:spacing w:after="${o.after}"/>`);
      else if(o.before!==undefined) parts.push(`<w:spacing w:before="${o.before}" w:after="0"/>`);
      if(o.shade) parts.push(`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`);
      if(parts.length) ppr=`<w:pPr>${parts.join("")}</w:pPr>`;
      return `<w:p>${ppr}${inner}</w:p>`;
    };

    const BORD = `<w:tcBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="BBBBBB"/><w:left w:val="single" w:sz="4" w:space="0" w:color="BBBBBB"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="BBBBBB"/><w:right w:val="single" w:sz="4" w:space="0" w:color="BBBBBB"/></w:tcBorders>`;
    const MAR  = `<w:tcMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tcMar>`;
    const cell = (inner, w, opts={})=>{
      const span = opts.span?`<w:gridSpan w:val="${opts.span}"/>`:"";
      const shade= opts.bg?`<w:shd w:val="clear" w:color="auto" w:fill="${opts.bg}"/>`:"";
      return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span}${shade}${BORD}${MAR}<w:vAlign w:val="center"/></w:tcPr>${inner}</w:tc>`;
    };
    const row = inner=>`<w:tr>${inner}</w:tr>`;

    // ── Image helper ──
    const mediaFiles={};
    const usedImgExt={};   // 실제로 쓰인 이미지 확장자 추적 (Content-Types 등록용)
    let imgSeq = 0;        // ⚠️ 이미지 일련번호(image1,image2…/rImg1…). 미선언 시 addImg 안의
                           //    imgSeq++ 가 ReferenceError 를 던져 모든 사진이 failError 로 실패한다.
    /* 내보내기용 이미지 정규화 ─────────────────────────────────
       사진은 저장 경로에 따라 JPEG / PNG / (압축 실패 시) HEIC·WebP 원본 등
       형식이 제각각이다. 워드는 선언한 Content-Type 과 실제 바이트가 다르면
       이미지를 조용히 렌더하지 않는다. 그래서 삽입 직전에 캔버스로 한 번
       다시 그려 항상 JPEG 로 통일한다. (형식 불일치 원인을 통째로 제거) */
    const toJpegDataUrl = (dataUrl)=> new Promise(resolve=>{
      try{
        const img = new Image();
        img.onload = ()=>{
          try{
            const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            if(!w || !h){ resolve(null); return; }
            const cv = document.createElement("canvas");
            cv.width = w; cv.height = h;
            const ctx = cv.getContext("2d");
            ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0,0,w,h);  // 투명 PNG 대비
            ctx.drawImage(img, 0, 0, w, h);
            resolve(cv.toDataURL("image/jpeg", 0.85));
          }catch(e){ resolve(null); }
        };
        img.onerror = ()=> resolve(null);
        img.src = dataUrl;
      }catch(e){ resolve(null); }
    });

    let imgFail=0, imgOK=0, failNoData=0, failFormat=0, failError=0;
    const addImg=async(dataUrl, cxEmu, cyEmu)=>{
      if(!dataUrl){ imgFail++; failNoData++; return ""; }
      try{
        // 값이 문자열이 아니거나(Blob 등) base64 dataURL 이 아니면 그대로는 못 쓴다.
        if(typeof dataUrl !== "string"){
          console.warn("[사진] 문자열 아님:", typeof dataUrl); imgFail++; failFormat++; return "";
        }
        if(!/^data:image\//i.test(dataUrl) || dataUrl.indexOf(",") < 0){
          console.warn("[사진] dataURL 형식 아님:", dataUrl.slice(0,40)); imgFail++; failFormat++; return "";
        }
        // 항상 JPEG 로 재인코딩 → 확장자/Content-Type/실제 바이트가 반드시 일치
        let src = dataUrl;
        const conv = await toJpegDataUrl(dataUrl);
        if(conv) src = conv;
        else console.warn("[사진] 재인코딩 실패 — 원본 사용:", dataUrl.slice(0,30));

        const ci = src.indexOf(",");
        const head = src.slice(0, ci).toLowerCase();
        const isPng = head.indexOf("image/png") >= 0;
        const ext = isPng ? "png" : "jpg";
        usedImgExt[ext] = true;   // Content-Types 에 해당 확장자 등록용
        const b64 = src.slice(ci+1);
        const bin=atob(b64);
        const bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
        imgSeq++;
        const fname=`image${imgSeq}.${ext}`;
        mediaFiles[fname]=bytes;
        const cx = cxEmu || Math.round(7.2 * 360000);
        const cy = cyEmu || Math.round(9.3 * 360000);
        const rid=`rImg${imgSeq}`;
        mediaFiles[`__r${imgSeq}`]={rid, fname};
        imgOK++;
        return `<w:r><w:rPr/><w:drawing>`+
          `<wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">`+
          `<wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/>`+
          `<wp:docPr id="${imgSeq}" name="${fname}"/>`+
          `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>`+
          `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">`+
          `<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`+
          `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">`+
          `<pic:nvPicPr><pic:cNvPr id="${imgSeq}" name="${fname}"/><pic:cNvPicPr/></pic:nvPicPr>`+
          `<pic:blipFill><a:blip r:embed="${rid}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>`+
          `<a:stretch><a:fillRect/></a:stretch></pic:blipFill>`+
          `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>`+
          `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>`+
          `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
      }catch(e){ imgFail++; failError++; console.warn("[사진] 처리 예외:", e && e.message, "| head:", String(dataUrl).slice(0,40)); return ""; }
    };

    // 사진 2열 배치 — 메인 테이블 밖 독립 단락으로 배치
    // 이미지 1장: 너비 7.2cm × 높이 9.3cm
    const IMG_CX = Math.round(7.2 * 360000);  // 7.2cm = 2,592,000 EMU
    const IMG_CY = Math.round(9.3 * 360000);  // 9.3cm = 3,348,000 EMU

    const buildPhotoSection = async (photoKeys, cache) => {
      if(!photoKeys || !photoKeys.length) return "";
      const imgXmls = [];
      for(const key of photoKeys){
        const r = await addImg(cache[key], IMG_CX, IMG_CY);
        if(r) imgXmls.push(r);
      }
      if(!imgXmls.length) return "";

      let result = "";
      for(let i=0; i<imgXmls.length; i+=2){
        const hasRight = i+1 < imgXmls.length;
        // 사진 제목 행: "점검사진" 레이블 (좌/우)
        const labelLeft  = `<w:r><w:rPr><w:rFonts w:ascii="Malgun Gothic" w:eastAsia="Malgun Gothic"/><w:sz w:val="18"/><w:b/></w:rPr><w:t xml:space="preserve">점검사진</w:t></w:r>`;
        const labelGap   = `<w:r><w:rPr/><w:t xml:space="preserve">                              </w:t></w:r>`;
        const labelRight = hasRight ? `<w:r><w:rPr><w:rFonts w:ascii="Malgun Gothic" w:eastAsia="Malgun Gothic"/><w:sz w:val="18"/><w:b/></w:rPr><w:t xml:space="preserve">점검사진</w:t></w:r>` : "";
        result += `<w:p><w:pPr><w:jc w:val="left"/><w:spacing w:after="0"/></w:pPr>${labelLeft}${labelGap}${labelRight}</w:p>`;

        // 사진 행: 이미지 2개 나란히, 사이 간격
        const gap = hasRight ? `<w:r><w:rPr/><w:t xml:space="preserve"> </w:t></w:r>` : "";
        result += `<w:p><w:pPr><w:jc w:val="left"/><w:spacing w:after="100"/></w:pPr>`+
          imgXmls[i] + gap + (hasRight ? imgXmls[i+1] : "") +
          `</w:p>`;
      }
      return result;
    };

    // ── 항목 자동 그룹화 (외관/기능/안전) ──
    function autoGroup(items){
      const 외관KW = ['외관 상태','케이블 및 커넥터','고정 및 취부','작동 표시부','주변기기','배터리 보호','배터리 누액','FDF 내','배관·트레이','안테나 수직','렌즈 오염','카메라부','방진/방수','선번장','케이블 명찰','케이블 연결 상태','케이블 정리','케이블 결선','광케이블 곡률','동축케이블','볼트 및 너트','내화 충전재','맨홀 내 시설물','맨홀 뚜껑','배터리 충전'];
      const 안전KW = ['설치 환경 확인','전원 단자 및 연결','이상 발열','접지저항 측정','조명설비 동작','예비전원','항온·항습','가스 발생','맨홀 내 사다리','맨홀·수공','이격거리','잠금 장치','재해','환기 상태','트레이 접지','접지 상태 확인','장비 전원공급','냉각팬'];
      const g = { 외관:[], 기능:[], 안전:[] };
      items.forEach(it=>{
        if(외관KW.some(k=> it.name.includes(k))) g.외관.push(it);
        else if(안전KW.some(k=> it.name.includes(k))) g.안전.push(it);
        else g.기능.push(it);
      });
      return g;
    }

    // ── 결과 기호 변환 ──
    const resSym = r => r==="양호"?"○" : r==="불량"?"X" : r==="해당없음"?"-" : "";

    // ── 테이블 상수 (샘플 양식 기준) ──
    const TW=9752;   // 17.2cm (표 속성 너비 지정)
    const CG=1418;   // 점검항목(구분) 2.5cm
    const CN=4960;   // 점검내용 (PG2+PG3+PG4와 동일 → 열 경계 일치)
    const CR=1480;   // 점검결과 (PG5와 동일)
    const CB=TW-CG-CN-CR; // 비고 1894 (PG6와 동일)
    // ── 점검표 + 사진표 통합 격자 ──────────────────────────────
    //   워드에서 두 표를 합쳤을 때 실제로 생기는 격자와 동일하게 맞춘다.
    //     점검표 경계 : 0 · 1418 · 4898 · 6378 · 7858 · 9752
    //     사진표 경계 : 0 · 1440 · 5596 · 9752
    //     통합   경계 : 0 · 1418 · 1440 · 4898 · 5596 · 6378 · 7858 · 9752 → 7열
    //   → [1418, 22, 3458, 698, 782, 1480, 1894]   (22 = 두 표의 라벨 열 차이)
    const UG1 = 1418, UG2 = 22, UG3 = 3458, UG4 = 698, UG5 = 782;
    // 상단 헤더 전용 5열 분할 (첨부 이미지 기준)
    //   설치위치 라벨이 점검결과 경계가 아니라 점검내용 열 안쪽에서 시작한다
    const CN1 = CG;        // 점검자/설치업체/점검항목 라벨  1418
    const CN2 = CN - CR;   // 점검자·설치업체 값            3480
    const CN3 = CR;        // 설치위치 라벨                 1480
    const CH_VAL = CR + CB;// 설치위치 값 (점검결과+비고 폭) 3374

    // ── 공통 테이블 테두리 ──
    const BORD_STD =
      `<w:tcBorders>`+
      `<w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `<w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `<w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `</w:tcBorders>`;
    const BORD_TOP_THICK =
      `<w:tcBorders>`+
      `<w:top w:val="single" w:sz="12" w:space="0" w:color="000000"/>`+
      `<w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `<w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `</w:tcBorders>`;
    /* 표 맨 오른쪽 열 전용 — 오른쪽 세로 테두리를 그리지 않는다.
       (성능점검표 우측 끝 세로줄 제거용. 유지보수 표에는 사용하지 않음) */
    const BORD_STD_NOR =
      `<w:tcBorders>`+
      `<w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `<w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `<w:right w:val="none" w:sz="2" w:space="0" w:color="000000"/>`+
      `</w:tcBorders>`;
    const BORD_TOP_THICK_NOR =
      `<w:tcBorders>`+
      `<w:top w:val="single" w:sz="12" w:space="0" w:color="000000"/>`+
      `<w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/>`+
      `<w:right w:val="none" w:sz="2" w:space="0" w:color="000000"/>`+
      `</w:tcBorders>`;
    const MAR_STD = `<w:tcMar><w:top w:w="60" w:type="dxa"/><w:left w:w="99" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="99" w:type="dxa"/></w:tcMar>`;
    // 촘촘한 셀 여백 (첨부 유지보수 자료와 동일 — 상하 0) : 행 높이를 낮춰 한 페이지 수용
    const MAR_TIGHT = `<w:tcMar><w:top w:w="0" w:type="dxa"/><w:left w:w="99" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="99" w:type="dxa"/></w:tcMar>`;

    const F = "맑은 고딕";
    const rp  = (o={})=>`<w:rPr><w:rFonts w:ascii="${F}" w:hAnsi="${F}" w:eastAsia="${F}" w:cs="${F}"/>`+
      (o.b?`<w:b/><w:bCs/>`:"")+(o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:"")+
      (o.color?`<w:color w:val="${o.color}"/>`:"")+`</w:rPr>`;
    const rn  = (t,o={})=>`<w:r>${rp(o)}<w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
    const pp  = (inner,o={})=>`<w:p><w:pPr><w:widowControl/><w:wordWrap/><w:autoSpaceDE/><w:autoSpaceDN/>`+
      `<w:spacing${o.before!==undefined?` w:before="${o.before}"`:""} w:after="${o.after!==undefined?o.after:0}"/>`+
      (o.ind!==undefined?`<w:ind w:leftChars="200" w:left="${o.ind}"/>`:"")+
      (o.jc?`<w:jc w:val="${o.jc}"/>`:"")+(o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:"")+
      `</w:pPr>${inner}</w:p>`;

    // 셀 생성
    let _pfNW = false;   // true일 때 성능점검표 점검항목 행 셀에 <w:noWrap/> 부여(텍스트 줄 바꿈 해제)
    const tc = (inner, w, o={})=>{
      const sp  = o.span?`<w:gridSpan w:val="${o.span}"/>`:"";
      const vmg = o.vmerge==="restart"?`<w:vMerge w:val="restart"/>`:o.vmerge==="continue"?`<w:vMerge/>`:"";
      const vm  = o.vm?`<w:vAlign w:val="${o.vm}"/>`:`<w:vAlign w:val="center"/>`;
      const shd = o.bg?`<w:shd w:val="clear" w:color="auto" w:fill="${o.bg}"/>`:"";
      const brd = o.noR ? (o.thick?BORD_TOP_THICK_NOR:BORD_STD_NOR)
                        : (o.thick?BORD_TOP_THICK:BORD_STD);
      const nw  = _pfNW ? `<w:noWrap/>` : "";
      const mar = o.tight?MAR_TIGHT:MAR_STD;
      return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${sp}${vmg}${shd}${brd}${nw}${mar}${vm}</w:tcPr>${inner}</w:tc>`;
    };
    const tr  = inner=>`<w:tr><w:trPr><w:trHeight w:val="405"/></w:trPr>${inner}</w:tr>`;
    // ── 행 높이 (twip) ──  1cm = 1440/2.54 = 566.93 twip
    const RH_HEAD    = 510;   // 0.90cm — 점검자 / 설치업체 / 점검항목 헤더 행
    const RH_ITEM    = 414;   // 0.73cm — 점검항목 데이터 행 (유지보수·성능 공통)
    const RH_NOTE_MT = 1871;  // 3.30cm — 유지보수 사진 아래 비고 행
    const RH_NOTE_PF = 1531;  // 2.70cm — 성능 현황사진 표 하단 비고 행

    /* ── 성능점검표 · 설비별 행 높이 예외 ─────────────────────────
       아래 표에 없는 설비는 기본값(RH_ITEM 414 = 0.73cm)을 그대로 쓴다.
       유지보수점검표에는 전혀 영향 없음.                                */
    const PF_ROW_H = {                    // 점검항목 칸 줄 높이
      "방송 공동수신 안테나 시설": 369,     // 0.65cm
      "원격검침 시스템":           369,    // 0.65cm
      "스마트 도서관 시스템":       369,    // 0.65cm
      "지능형 인원계수 시스템":     397,    // 0.70cm
      "전자출입(통제) 시스템":      397,    // 0.70cm
      "디지털 사이니지":            397,    // 0.70cm
      "지능형 경계 감시 시스템":    397,    // 0.70cm
      "영상정보처리기기 시스템":    340     // 0.60cm
    };
    const PF_BAD_H = {                    // 부적합사항 / 조치사항 각 행 높이
      "지능형 경계 감시 시스템":   1134,    // 각 2.0cm (총 4.0cm)
      "영상정보처리기기 시스템":   1417     // 각 2.5cm (총 5.0cm)
    };
    const pfRowH = name => 397;   // 0.7cm 고정(요청) · 1cm=566.93twip → 0.7cm≈397
    const pfBadH = (name, dflt) => PF_BAD_H[name] || dflt;
    const trHd = inner=>`<w:tr><w:trPr><w:trHeight w:val="${RH_HEAD}" w:hRule="atLeast"/></w:trPr>${inner}</w:tr>`;

    /* ── 성능점검표 표 속성 행 높이(가이드 반영) ─────────────────────
       첨부 표 속성(행 탭) 가이드의 4개 영역별 지정 높이.
       모두 "행 높이 = 최소"(hRule="atLeast") 로 지정한다.
       1cm = 1440/2.54 = 566.93 twip                                     */
    const PF_H_HEADER = 624;   // 1.1cm — 상단 헤더(타이틀) 행 ((소속)점검자·관리주체(입회자)·설치위치)
    const PF_H_COLHD  = 397;   // 0.7cm — 컬럼 헤더 행 (구분·점검내용·점검결과·비고)
    const PF_H_ITEM   = 334;   // 0.59cm — 중간 점검항목 세부 행 (내용이 있는 행)
    const PF_H_EMPTY  = 334;   // 0.59cm — 중간 점검항목 세부 행 (빈 행)
    const PF_H_BAD    = 1644;  // 2.9cm — 하단 부적합사항·조치사항 각 행

    /* ── 글자 폭 모델 ────────────────────────────────────────────
       맑은 고딕은 한글·한자가 전각(1em), 영문·숫자·기호는 비례폭(≈0.55em),
       공백은 ≈0.3em 이다. 종전의 "26자/줄" 어림은 한글과 영문을 같게 봐서
       긴 항목명의 줄바꿈을 놓쳤다. 글자 종류별로 폭을 더해 추정한다.        */
    function textEm(str){
      let w = 0;
      for(const ch of String(str||"")){
        const c = ch.codePointAt(0);
        if((c>=0xAC00&&c<=0xD7A3)||(c>=0x1100&&c<=0x11FF)||(c>=0x3130&&c<=0x318F)||
           (c>=0x4E00&&c<=0x9FFF)||(c>=0x3000&&c<=0x303F)||(c>=0xFF00&&c<=0xFF60)) w += 1.0;   // 한글·한자·전각
        else if(ch===" ") w += 0.3;
        else w += 0.55;                                                                        // 영문·숫자·기호
      }
      return w;
    }
    // 셀 폭(twip) 안에 sz(half-point) 글자가 몇 em 들어가는가
    const emFit = (cellW, sz)=> (cellW - 198) / (sz * 10);   // 198 = 좌우 셀여백 99+99
    // 점검내용/비고 칸을 감안한 이 항목의 줄 수
    const linesOf = (name, note, sz)=> Math.max(
      Math.max(1, Math.ceil(textEm(name) / emFit(CN, sz))),
      Math.max(1, Math.ceil(textEm(note) / emFit(CB, 18)))
    );
    const MT_SIZES = [20, 19, 18, 17, 16];   // 10 / 9.5 / 9 / 8.5 / 8 pt
    const tr2 = (h,inner,hRule)=>`<w:tr><w:trPr><w:trHeight w:val="${h}"${hRule?` w:hRule="${hRule}"`:""}/></w:trPr>${inner}</w:tr>`;

    // 테이블 열기/닫기
    const openTbl=()=>
      `<w:tbl><w:tblPr><w:tblW w:w="${TW}" w:type="dxa"/>`+
      `<w:tblLayout w:type="fixed"/>`+
      `<w:tblCellMar><w:left w:w="99" w:type="dxa"/><w:right w:w="99" w:type="dxa"/></w:tblCellMar>`+
      `</w:tblPr>`+
      `<w:tblGrid><w:gridCol w:w="${UG1}"/><w:gridCol w:w="${UG2}"/><w:gridCol w:w="${UG3}"/><w:gridCol w:w="${UG4}"/><w:gridCol w:w="${UG5}"/><w:gridCol w:w="${CR}"/><w:gridCol w:w="${CB}"/></w:tblGrid>`;
    const closeTbl=()=>`</w:tbl>`;

    // 그룹 행 (외관/기능/안전) — 첫 항목만 그룹명 표시, 나머지는 빈칸
    function groupRows(groupName, items, minRows, sz){
      const NSZ = sz || 20;   // 점검내용 글꼴 (한 페이지에 안 들어가면 설비별로 낮아짐)
      const n = Math.max(items.length, minRows||0);
      if(!n) return "";
      let out="";
      // 행 높이를 405로 고정(atLeast) + 셀 상하 여백 0 → 워드에서도 촘촘하게 렌더
      const trT = (inner)=>`<w:tr><w:trPr><w:trHeight w:val="${RH_ITEM}" w:hRule="atLeast"/></w:trPr>${inner}</w:tr>`;
      for(let i=0;i<n;i++){
        const it = items[i];
        // 그룹 라벨: 첫 행에서 시작해 나머지 행과 세로 병합
        const labelCell = i===0
          ? tc(pp(rn(groupName,{sz:20}),{jc:"center"}), CG, {vmerge:"restart", vm:"center", tight:true})
          : tc(pp(rn("")), CG, {vmerge:"continue", tight:true});
        if(it){
          const sym  = resSym(it.result);
          const meas = (it.hasValue && it.value) ? `${it.value}${it.unit||""}` : "";
          const note = it.result==="불량" ? (it.note||"") : meas;
          const symColor = it.result==="양호"?"000000":it.result==="불량"?"CC0000":"000000";
          out += trT(
            labelCell+
            tc(pp(rn(it.name,{sz:NSZ})), CN, {span:4, tight:true})+
            tc(pp(rn(sym,{sz:20,b:it.result==="불량",color:symColor}),{jc:"center"}), CR, {tight:true})+
            tc(pp(rn(note,{sz:18,color:it.result==="불량"?"CC0000":"555555"})), CB, {tight:true})
          );
        } else {
          // 빈 행
          out += trT(
            labelCell+
            tc(pp(rn("")), CN, {span:4, tight:true})+
            tc(pp(rn("")), CR, {tight:true})+
            tc(pp(rn("")), CB, {tight:true})
          );
        }
      }
      return out;
    }

    // 유지보수 점검표 작성방법 2개 항목 (첨부 자료 원문)
    const MT_GUIDE = [
      "1. 점검결과에는 [적합 ㅇ, 부적합 X, 해당없음 - ]을 표기하고, 비고에는 부적합 사유를 기록한다.",
      "2. 유지보수·관리 대상 정보통신설비의 특성 및 여건에 맞게 점검내용을 추가ㆍ변경할 수 있다."
    ];

    // ════════════════════════════════════════════════
    // 공통 사진 섹션 (성능점검·유지보수 동일)
    // 사진: 너비 7.2 × 높이 9.3cm
    // 셀:   너비 7.3 × 높이 9.4cm
    // 셀 들여쓰기: 왼쪽 -0.35글자
    // ════════════════════════════════════════════════
    const PHOTO_CELL_W = 4876;                     // 8.6cm (표 17.2cm ÷ 2)
    const PHOTO_CELL_H = Math.round(9.4 * 567);    // 9.4cm = 5330 twips
    const PHOTO_IMG_CX = Math.round(7.2 * 360000); // 7.2cm EMU
    const PHOTO_IMG_CY = Math.round(9.3 * 360000); // 9.3cm EMU
    const PHOTO_TW2    = PHOTO_CELL_W * 2;          // 두 셀 합 = 9752

    // ── 사진 표 (참고 워드 틀과 동일 규격) ──
    // grid: [현황사진 라벨 1440(2.54cm) | 사진 4156(7.33cm) | 사진 4156(7.33cm)] = 9752(17.2cm)
    const PH_LABEL_W = 1440;                        // 현황사진/비고 라벨 열 2.54cm
    const PH_IMG_CELL_W = Math.round((TW - PH_LABEL_W) / 2); // 사진 셀 4156
    const PH_IMG_CX = Math.round(7.2 * 360000);     // 이미지 7.2cm (가로)
    const PH_IMG_CY = Math.round(9.3 * 360000);     // 이미지 9.3cm (세로로 긴 사진)
    const PH_ROW_H = 5329;                          // 사진 행 높이 9.4cm

    // 테두리 헬퍼 (참고 파일: sz=3 기본, 굵은선 sz=9)
    const phB = (top,left,bottom,right)=>{
      const one=(side,v)=> v==="none" ? `<w:${side} w:val="none" w:sz="2" w:space="0" w:color="000000"/>`
        : `<w:${side} w:val="single" w:sz="${v}" w:space="0" w:color="000000"/>`;
      return `<w:tcBorders>${one("top",top)}${one("left",left)}${one("bottom",bottom)}${one("right",right)}</w:tcBorders>`;
    };
    // 사진 셀 (사진에 캡션이 이미 합성돼 있으므로 워드 캡션 표는 넣지 않음)
    const tcPhotoCap = (imgXml, isRight, sp, w)=>{
      const ppr = `<w:pPr><w:spacing w:after="0"/><w:jc w:val="center"/></w:pPr>`;
      const imgPara = imgXml ? `<w:p>${ppr}${imgXml}</w:p>` : `<w:p>${ppr}</w:p>`;
      return `<w:tc><w:tcPr><w:tcW w:w="${w||PH_IMG_CELL_W}" w:type="dxa"/>${sp?`<w:gridSpan w:val="${sp}"/>`:""}`+
        phB("3","3","3", isRight?"3":"none")+
        `<w:vAlign w:val="center"/></w:tcPr>${imgPara}</w:tc>`;
    };
    // 현황사진 세로 라벨 셀 (음영 없음)
    const tcVLabel = (text, first, sp, w)=>{
      const vm = first ? `<w:vMerge w:val="restart"/>` : `<w:vMerge/>`;
      const body = first
        ? `<w:p><w:pPr><w:spacing w:after="0"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕"/><w:b/><w:sz w:val="18"/></w:rPr><w:t>${escapeXml(text)}</w:t></w:r></w:p>`
        : `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>`;
      return `<w:tc><w:tcPr><w:tcW w:w="${w||PH_LABEL_W}" w:type="dxa"/>${sp?`<w:gridSpan w:val="${sp}"/>`:""}${vm}`+
        phB("3","none","3","3")+
        `<w:vAlign w:val="center"/></w:tcPr>${body}</w:tc>`;
    };

    // 작성방법 3개 항목 (참고 워드 원문)
    const PH_GUIDE = [
      "1. 제6조 각 호에 따른 자료와 정보통신설비 유지보수·관리 및 성능점검 대상 현황표와의 적합여부를 참고하여 점검결과를 작성한다.",
      "2. 점검결과에는 [적합 ㅇ, 부적합 X, 해당없음 - ]을 표기하고, 부적합 항목에 부적합 사항과 조치사항을 기록한다.",
      "3. 성능점검 대상 정보통신설비의 특성 및 여건에 맞게 점검내용을 추가ㆍ변경할 수 있다."
    ];

    // ── 사진 섹션 배치 사양 ────────────────────────────────────
    //  SP 를 넘기면 부모 표(점검표) 안에 이어지는 행만 만든다 → 표 1개로 병합.
    //  SP 없이 부르면 종전처럼 독립된 사진 표를 만든다.
    //  워드가 표를 합칠 때 두 번째 표의 속성을 tblPrEx 로 각 행에 보존하므로
    //  동일하게 재현한다.
    const PH_PREX =
      `<w:tblPrEx><w:jc w:val="center"/>`+
      `<w:tblBorders><w:top w:val="single" w:sz="3" w:space="0" w:color="000000"/>`+
      `<w:left w:val="single" w:sz="3" w:space="0" w:color="000000"/>`+
      `<w:bottom w:val="single" w:sz="3" w:space="0" w:color="000000"/>`+
      `<w:right w:val="single" w:sz="3" w:space="0" w:color="000000"/></w:tblBorders>`+
      `<w:tblCellMar><w:left w:w="102" w:type="dxa"/><w:right w:w="102" w:type="dxa"/></w:tblCellMar></w:tblPrEx>`;
    // 유지보수 통합 격자(7열)   : 라벨 1440=sp2 · 사진 4156=sp2 / 4156=sp3 · 비고 8312=sp5 · 전체 sp7
    const SP_MT = { lab:2, labW:1440, l:2, lW:4156, r:3, rW:4156, note:5, noteW:8312, full:7, prEx:PH_PREX, noteH:RH_NOTE_MT };
    // 성능 격자(8열, 격자 변경 없음): 라벨 1421=sp1 · 사진 4076=sp3 / 4255=sp4 · 비고 8331=sp7 · 전체 sp8
    const SP_PF = { lab:1, labW:1421, l:3, lW:4076, r:4, rW:4255, note:7, noteW:8331, full:8, prEx:PH_PREX, noteH:RH_NOTE_PF };

    async function buildPhotoSec(loc, secNo, catName, SP){
      const M = !!SP;
      const S = SP || { lab:0, labW:PH_LABEL_W, l:0, lW:PH_IMG_CELL_W, r:0, rW:PH_IMG_CELL_W,
                        note:2, noteW:PH_IMG_CELL_W*2, full:3, prEx:"", noteH:1033 };
      const PX = M ? S.prEx : "";
      const photos = photosOf(loc);
      let out = "";
      if(!M){
      out += pp(rn(""), {after:60});
      out += pp(rn(`${secNo}-2) ${catName} 점검사진`,{sz:24,b:true}),{after:60});
      out += `<w:tbl><w:tblPr><w:tblOverlap w:val="never"/><w:tblW w:w="${TW}" w:type="dxa"/><w:jc w:val="center"/>`+
        `<w:tblBorders><w:top w:val="single" w:sz="3" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="3" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="3" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="3" w:space="0" w:color="000000"/></w:tblBorders>`+
        `<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="102" w:type="dxa"/><w:right w:w="102" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
        `<w:tblGrid><w:gridCol w:w="${PH_LABEL_W}"/><w:gridCol w:w="${PH_IMG_CELL_W}"/><w:gridCol w:w="${PH_IMG_CELL_W}"/></w:tblGrid>`;
      }

      // 사진 행 (2장씩, 최소 2행)
      const rowsN = Math.max(2, Math.ceil(photos.length/2));
      for(let ri=0, pi=0; ri<rowsN; ri++, pi+=2){
        const leftKey = photos[pi], rightKey = photos[pi+1];
        // 캐시에 없으면 저장소에서 즉시 재조회 (캐시 누락으로 사진이 빠지는 것 방지)
        const getData = async (k)=>{
          if(!k) return null;
          if(photoCache[k]) return photoCache[k];
          const d = await sGet(k);
          if(d){ photoCache[k] = d; return d; }
          console.warn("[사진] 저장소에 없음 key:", k);
          return null;
        };
        const leftImg  = leftKey  ? await addImg(await getData(leftKey),  PH_IMG_CX, PH_IMG_CY) : "";
        const rightImg = rightKey ? await addImg(await getData(rightKey), PH_IMG_CX, PH_IMG_CY) : "";
        out += `<w:tr>${PX}<w:trPr><w:trHeight w:val="${PH_ROW_H}"/><w:jc w:val="center"/></w:trPr>`+
          tcVLabel("현황사진", ri===0, S.lab, S.labW)+
          tcPhotoCap(leftImg,false,S.l,S.lW)+tcPhotoCap(rightImg,true,S.r,S.rW)+`</w:tr>`;
      }

      // 비 고 행 (라벨 + 내용 병합) — 하단 굵은선
      const memo = loc.memo||"";
      const bad_items = loc.items.filter(it=>it.result==="불량").map(it=>`ㅇ ${it.name}${it.note?" — "+it.note:""}`).join("\n");
      // 참조 워드 기본문구: 성능 = "○ {설비} 특이사항 없음" / 유지보수 = "ㅇ {설비} 관리상태 양호"
      const isPerf = (current.inspType !== "유지보수" && current.inspType !== "유지보수2");
      /* ── 측정 요약문 ──────────────────────────────────────────────
         접지저항 / AC 전원 측정값이 입력돼 있으면 비고에 규격 충족 여부를 적는다.
           · 접지저항만        → "○ 접지저항 측정 결과 : 양호" + 측정값 줄
           · 접지저항 + AC     → "○ 주요 전원·접지·신호 측정 결과: 양호" + 2줄
         부적합 항목이 있으면 그쪽이 우선이므로, 이 문구는 항상 '양호' 기준이 맞다. */
      const valOf = it => `${it.value}${(fieldsOf(it) ? "" : (it.unit||""))}`;
      const gndIt = loc.items.find(it => it.hasValue && it.value && it.name && it.name.indexOf("접지저항") >= 0);
      const acIt  = loc.items.find(it => it.hasValue && it.value && it.name && it.name.indexOf("AC") >= 0);
      const L_GND = g => `- 측정값: ${valOf(g)}, 통신관련시설 접지저항 기준(10Ω 이하)을 충족`;
      const L_AC  = a => `- AC 전원전압: ${valOf(a)}, 정격전압 220V 기준 전압유지범위(220v ± 6%) 내 해당`;
      let measSummary = "";
      if(gndIt && acIt)      measSummary = ["○ 주요 전원·접지·신호 측정 결과: 양호", L_GND(gndIt), L_AC(acIt)].join("\n");
      else if(gndIt)         measSummary = ["○ 접지저항 측정 결과 : 양호", L_GND(gndIt)].join("\n");
      else if(acIt)          measSummary = ["○ 주요 전원·접지·신호 측정 결과: 양호", L_AC(acIt)].join("\n");

      /* 비고 조립 — 메모(자동 비고 포함)가 묻히지 않도록 뒤에 덧붙인다.
         (이전에는 bad_items / measSummary 가 있으면 memo 가 통째로 버려져서
          AC·접지저항 측정값이 있는 설비에서는 자동 비고가 워드에 안 나왔다.) */
      // 메모가 이미 ○/ㅇ/- 로 시작하면(접지 문구 등) 접두 기호를 덧붙이지 않는다
      const memoLine = memo ? (/^\s*[○ㅇ\-]/.test(memo) ? memo : (isPerf?`○ ${memo}`:`ㅇ ${memo}`)) : "";
      const noteBase = bad_items || measSummary;
      const noteText = noteBase
        ? (memoLine ? noteBase + "\n" + memoLine : noteBase)
        : (memoLine || (isPerf ? `○ ${catName} 특이사항 없음` : `ㅇ ${catName} 관리상태 양호`));
      out += `<w:tr>${PX}<w:trPr><w:trHeight w:val="${S.noteH||1033}" w:hRule="atLeast"/><w:jc w:val="center"/></w:trPr>`+
        `<w:tc><w:tcPr><w:tcW w:w="${S.labW}" w:type="dxa"/>${S.lab?`<w:gridSpan w:val="${S.lab}"/>`:""}${phB("3","none","9","3")}<w:vAlign w:val="center"/></w:tcPr>`+
          `<w:p><w:pPr><w:spacing w:after="0"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕"/><w:b/><w:sz w:val="18"/></w:rPr><w:t>비 고</w:t></w:r></w:p></w:tc>`+
        `<w:tc><w:tcPr><w:tcW w:w="${S.noteW}" w:type="dxa"/><w:gridSpan w:val="${S.note}"/>${phB("3","3","9","3")}<w:vAlign w:val="center"/></w:tcPr>`+
          String(noteText).split("\n").map(line=> pp(rn(line,{sz:18}))).join("")+`</w:tc></w:tr>`;

      // 작 성 방 법 행 (회색 음영 + 굵은 상단선)
      out += `<w:tr>${PX}<w:trPr><w:trHeight w:val="454"/><w:jc w:val="center"/></w:trPr>`+
        `<w:tc><w:tcPr><w:tcW w:w="${TW}" w:type="dxa"/><w:gridSpan w:val="${S.full}"/>${phB("9","none","3","none")}`+
        `<w:shd w:val="clear" w:color="auto" w:fill="D8D8D8"/><w:vAlign w:val="center"/></w:tcPr>`+
        `<w:p><w:pPr><w:spacing w:after="0"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕"/><w:sz w:val="20"/></w:rPr><w:t>작 성 방 법</w:t></w:r></w:p></w:tc></w:tr>`;

      // 작성방법 3줄 행
      const guideParas = PH_GUIDE.map(line=>
        `<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/><w:ind w:left="312" w:hanging="252"/></w:pPr>`+
        `<w:r><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕"/><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">${escapeXml(line)}</w:t></w:r></w:p>`
      ).join("");
      out += `<w:tr>${PX}<w:trPr><w:trHeight w:val="1123"/><w:jc w:val="center"/></w:trPr>`+
        `<w:tc><w:tcPr><w:tcW w:w="${TW}" w:type="dxa"/><w:gridSpan w:val="${S.full}"/>${phB("3","none","3","none")}<w:vAlign w:val="center"/></w:tcPr>`+
        guideParas+`</w:tc></w:tr>`;

      if(!M){
        out += `</w:tbl>`;
        out += pp(rn(""),{after:200});
      }
      return out;
    }

    // ════════════════════════════════════════════════
    // 성능점검표 전용 테이블 (6열 그리드)
    // ════════════════════════════════════════════════
    // 참조 워드(정보통신설비_성능점검_결과서_v1.docx)의 tblGrid를 그대로 사용
    //   [1421, 1739, 1447, 890, 924, 1118, 1118, 1095]  합 9752
    const PG1=1421, PG2=1739, PG3=1447, PG4=890, PG5=924, PG6=1118, PG7=1118, PG8=1095;
    const PF_NAME = PG2+PG3+PG4+PG5+PG6;   // 점검내용 6118 (span 5)
    const PF_RES  = PG7;                   // 점검결과 1118
    const PF_NOTE = PG8;                   // 비고     1095
    const PF_WIDE = TW-PG1;                // 부적합/비고 본문 8331 (span 7)
    const PF_IMG1 = PG2+PG3+PG4;           // 사진 좌 4076 (span 3)
    const PF_IMG2 = PG5+PG6+PG7+PG8;       // 사진 우 4255 (span 4)
    const PF_SHD  = "E5E5E5";              // 참조 워드 헤더 음영
    const openPerfTbl = ()=>
      `<w:tbl><w:tblPr><w:tblW w:w="${TW}" w:type="dxa"/><w:jc w:val="center"/>`+
      /* 표 들여쓰기 0 고정 — 지정하지 않으면 워드 기본 표 들여쓰기(약 108twip)가 적용돼
         표 전체가 오른쪽으로 밀리고, 표 오른쪽 끝선이 본문 여백 밖으로 삐져나와
         페이지 우측에 얇은 세로선처럼 보인다. (스키마 순서: tblW → tblInd → tblLayout) */
      `<w:tblInd w:w="0" w:type="dxa"/><w:tblLayout w:type="fixed"/>`+
      `<w:tblCellMar><w:top w:w="28" w:type="dxa"/><w:left w:w="0" w:type="dxa"/><w:bottom w:w="28" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
      `<w:tblGrid><w:gridCol w:w="${PG1}"/><w:gridCol w:w="${PG2}"/><w:gridCol w:w="${PG3}"/><w:gridCol w:w="${PG4}"/><w:gridCol w:w="${PG5}"/><w:gridCol w:w="${PG6}"/><w:gridCol w:w="${PG7}"/><w:gridCol w:w="${PG8}"/></w:tblGrid>`;

    // ── 본문 구성 ──
    let body="";
    let catIdx=0;

    // 2번 (부적합추출): Phase 1 체크리스트만 / Phase 2 부적합 사진만
    if(current.inspType === "유지보수2"){
      // Phase 1: 모든 설비의 체크리스트만
      for(const cat of current.categories){
        if(!cat.locations.some(l=>l.items.length>0)) continue;
        catIdx++;

        for(let li=0; li<cat.locations.length; li++){
          const loc = cat.locations[li];
          if(!loc.items.length) continue;
          const locName = loc.name || "";
          const secNo = `${catIdx}-${li+1}`;

          // 섹션 제목
          body += pp(rn(`${secNo}-1) ${cat.name}${locName?" - "+locName:""}`, {sz:24, b:true}), {after:60});

          // 점검표 (사진 없이 체크리스트만)
          body += openTbl();
          body += trHd(tc(pp(rn("점검자",{sz:20,b:true}),{jc:"center"}), CN1, {bg:"D9D9D9",thick:true})+tc(pp(rn(`kt MOS북부 · ${current.inspector||""}`,{sz:20}),{jc:"center"}), CN2, {span:2, thick:true})+tc(pp(rn("설치위치",{sz:20,b:true}),{jc:"center"}), CN3, {span:2, bg:"D9D9D9",thick:true,vmerge:"restart"})+tc(pp(rn(locName,{sz:20}),{jc:"center"}), CH_VAL, {span:2, thick:true, vmerge:"restart"}));
          body += trHd(tc(pp(rn("설치업체",{sz:20,b:true}),{jc:"center"}), CN1, {bg:"D9D9D9"})+tc(pp(rn(current.vendor||"",{sz:20}),{jc:"center"}), CN2, {span:2})+tc(pp(rn("")), CN3, {span:2, bg:"D9D9D9",vmerge:"continue"})+tc(pp(rn("")), CH_VAL, {span:2, vmerge:"continue"}));
          body += trHd(tc(pp(rn("점검항목",{sz:20,b:true}),{jc:"center"}), CG, {bg:"D9D9D9"})+tc(pp(rn("점검내용",{sz:20,b:true}),{jc:"center"}), CN, {span:4, bg:"D9D9D9"})+tc(pp(rn("점검결과",{sz:20,b:true}),{jc:"center"}), CR, {bg:"D9D9D9"})+tc(pp(rn("비고",{sz:20,b:true}),{jc:"center"}), CB, {bg:"D9D9D9"}));

          const grp = autoGroup(loc.items);
          body += groupRows("외관", grp.외관, {});
          body += groupRows("기능", grp.기능, {});
          body += groupRows("안전", grp.안전, {});

          body += closeTbl();
          body += pp(rn(""), {after:120});
        }
      }

      // Phase 2: 부적합 사진만 2×2 격자
      body += pp(rn("부적합 사항 상세", {sz:24, b:true}), {after:80});
      
      let badPhotos = [];
      for(const cat of current.categories){
        for(const loc of cat.locations){
          if(loc.photos && loc.photos.length > 0){
            loc.photos.forEach((key, idx) => {
              if(loc.items[idx] && loc.items[idx].result === "불량"){
                badPhotos.push({key, cat: cat.name, loc: loc.name});
              }
            });
          }
        }
      }

      if(badPhotos.length > 0){
        const GRID_C = Math.round(TW / 2);
        const PHOTO_CX = Math.round(7.2*360000);
        const PHOTO_CY = Math.round(9.3*360000);

        body += `<w:tbl><w:tblPr><w:tblW w:w="${TW}" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr>`;
        body += `<w:tblGrid><w:gridCol w:w="${GRID_C}"/><w:gridCol w:w="${TW-GRID_C}"/></w:tblGrid>`;

        for(let i=0; i<badPhotos.length; i+=2){
          body += tr(tc(pp(rn("부적합 사항",{sz:15,b:true}),{jc:"center"}), GRID_C, {bg:"CCCCCC"})+tc(pp(rn("부적합 사항",{sz:15,b:true}),{jc:"center"}), TW-GRID_C, {bg:"CCCCCC"}));

          const leftImg = badPhotos[i] ? await addImg(photoCache[badPhotos[i].key], PHOTO_CX, PHOTO_CY) : "";
          const rightImg = badPhotos[i+1] ? await addImg(photoCache[badPhotos[i+1].key], PHOTO_CX, PHOTO_CY) : "";

          body += tr2(2200,
            tc(pp(leftImg,{jc:"center"}), GRID_C, {vm:"center"})+
            tc(pp(rightImg,{jc:"center"}), TW-GRID_C, {vm:"center"})
          );

          body += tr2(300,
            tc(pp(rn("○(적합함) / ②(중요위치)",{sz:12}),{jc:"center"}), GRID_C)+
            tc(pp(rn("○(적합함) / ②(중요위치)",{sz:12}),{jc:"center"}), TW-GRID_C)
          );
        }

        body += `</w:tbl>`;
      }

      body += pp(rn(""), {after:240});
    } else if(current.inspType === "성능") {
      // ════════════════════════════════════════════════
      // 성능점검표 양식 (이미지 1,3 기준)
      // 헤더: (소속)점검자 | kt MOS북부 [이름] | 관리주체(입회자) | [입회자] | 설치위치 | [위치]
      // 단일 "점검항목" 그룹 + <부적합사항>/<조치사항> 섹션
      // ════════════════════════════════════════════════
      for(const cat of current.categories){
        if(!cat.locations.some(l=>l.items.length>0)) continue;
        catIdx++;

        for(let li=0; li<cat.locations.length; li++){
          const loc = cat.locations[li];
          if(!loc.items.length) continue;
          const locName = loc.name || "";
          const secNo = `${catIdx}-${li+1}`;

          // ── 성능점검표 제목 ──
          body += pp(rn(`(${secNo}) ${cat.name} 성능점검표`, {sz:28, b:true}), {before:240, after:60, ind:440});

          // ── 메인 성능점검표 테이블 (6열) ──
          body += openPerfTbl();

          // 헤더 행1: (소속)점검자 | kt MOS북부 [이름] | 관리주체(입회자) | [입회자] | 설치위치 | [위치]
          // ▶ 상단 헤더(타이틀) 영역 : 행 높이 1.1cm(최소)
          body += tr2(PF_H_HEADER,
            tc(pp(rn("(소속)",{sz:20,b:true}),{jc:"center",after:0})+pp(rn("점검자",{sz:20,b:true}),{jc:"center"}), PG1, {bg:PF_SHD,thick:true})+
            tc(pp(rn("kt MOS북부",{sz:20}),{jc:"center",after:0})+pp(rn(current.inspector||"",{sz:20}),{jc:"center"}), PG2, {thick:true})+
            tc(pp(rn("관리주체",{sz:20,b:true}),{jc:"center",after:0})+pp(rn("(입회자)",{sz:20,b:true}),{jc:"center"}), PG3, {bg:PF_SHD,thick:true})+
            tc(pp(rn(current.witness||"",{sz:20}),{jc:"center"}), PG4+PG5, {span:2, thick:true})+
            tc(pp(rn("설치위치",{sz:20,b:true}),{jc:"center"}), PG6, {bg:PF_SHD,thick:true})+
            tc(pp(rn(locName,{sz:20}),{jc:"center"}), PG7+PG8, {span:2, thick:true, noR:true})
          , "atLeast");

          // 컬럼 헤더 행: 구 분 | 점검내용 | 점검결과 | 비고
          // ▶ 중간 점검항목 영역 상단부 : 행 높이 0.7cm(최소)
          body += tr2(PF_H_COLHD,
            tc(pp(rn("구  분",{sz:20,b:true}),{jc:"center"}), PG1, {bg:PF_SHD})+
            tc(pp(rn("점검내용",{sz:20,b:true}),{jc:"center"}), PF_NAME, {span:5, bg:PF_SHD})+
            tc(pp(rn("점검결과",{sz:20,b:true}),{jc:"center"}), PF_RES, {bg:PF_SHD})+
            tc(pp(rn("비고",{sz:20,b:true}),{jc:"center"}), PF_NOTE, {bg:PF_SHD, noR:true})
          , "atLeast");

          // 점검항목 행 (단일 그룹 — 외관/기능/안전 구분 없음)
          // 빈 행 수를 14행으로 제한 → 부적합항목·조치사항까지 한 페이지에 들어감
          const items = loc.items;
          const MIN_ROWS = 18; // 한 페이지 기준 최소 행 수 (요청: 14 → 18칸)
          const rowCount = Math.max(MIN_ROWS, items.length);
          _pfNW = true;   // 점검항목 행: 텍스트 줄 바꿈 해제
          for(let ri=0; ri<rowCount; ri++){
            const it = items[ri];
            // 점검항목 라벨: 첫 행에서 시작해 나머지 행과 세로 병합
            const grpCell = ri===0
              ? tc(pp(rn("점검항목",{sz:20}),{jc:"center"}), PG1, {vmerge:"restart", vm:"center"})
              : tc(pp(rn("")), PG1, {vmerge:"continue"});
            if(it){
              const sym  = resSym(it.result);
              const meas = (it.hasValue && it.value) ? `${it.value}${(fieldsOf(it)?"":(it.unit||""))}` : "";
              const note = it.result==="불량" ? (it.note||"") : meas;
              const symColor = it.result==="불량"?"CC0000":"000000";
              body += tr2(PF_H_ITEM,
                grpCell+
                tc(pp(rn(it.name,{sz:20})), PF_NAME, {span:5})+
                tc(pp(rn(sym,{sz:20,b:it.result==="불량",color:symColor}),{jc:"center"}), PF_RES)+
                tc(pp(rn(note,{sz:18,color:it.result==="불량"?"CC0000":"555555"})), PF_NOTE, {noR:true})
              , "atLeast");
            } else {
              // 빈 행 (중간 점검항목 하단부) : 행 높이 0.6cm(최소)
              body += tr2(PF_H_EMPTY,
                grpCell+
                tc(pp(rn("")), PF_NAME, {span:5})+
                tc(pp(rn("")), PF_RES)+
                tc(pp(rn("")), PF_NOTE, {noR:true})
              , "atLeast");
            }
          }
          _pfNW = false;  // 이후 부적합/조치·사진 셀은 줄 바꿈 허용

          // ── 부적합 항목 섹션 ──
          const badItems = items.filter(it=>it.result==="불량");
          const badText = badItems.length
            ? badItems.map(it=>`○ ${it.name}${it.note?" — "+it.note:""}`).join("\n")
            : " ○ 부적합사항 없음";
          const fixText = badItems.length
            ? badItems.map(it=>`○ ${it.name} 조치 필요`).join("\n")
            : " ○ 조치사항 없음";

          // 부적합사항 (하단 부적합·항목 영역) : 행 높이 2.9cm(최소) — 라벨은 조치사항 행까지 세로 병합
          body += tr2(PF_H_BAD,
            tc(pp(rn("부적합 항목",{sz:20,b:true}),{jc:"center"}), PG1, {vm:"center", vmerge:"restart"})+
            tc(pp(rn("<부적합 사항>",{sz:20,b:true}),{jc:"both",after:0})+pp(rn(badText,{sz:20}),{jc:"both"}), PF_WIDE, {span:7, vm:"top", noR:true})
          , "atLeast");
          // 조치사항 (하단 부적합·항목 영역) : 행 높이 2.9cm(최소) — 라벨 셀은 위와 세로 병합
          body += tr2(PF_H_BAD,
            tc(pp(rn("")), PG1, {vmerge:"continue"})+
            tc(pp(rn("<조치사항>",{sz:20,b:true}),{jc:"both",after:0})+pp(rn(fixText,{sz:20}),{jc:"both"}), PF_WIDE, {span:7, vm:"top", noR:true})
          , "atLeast");

          // ── 사진 행을 같은 표 안에 이어 붙인다 (성능점검표 + 사진표 = 표 1개) ──
          body += await buildPhotoSec(loc, secNo, cat.name, SP_PF);
          body += closeTbl();
          // 표 뒤 빈 단락 없음 — 다음 섹션 제목 단락이 표 구분자 역할을 한다.
          // (빈 단락이 있으면 표가 페이지를 꽉 채웠을 때 다음 장 맨 위에 빈 줄이 생겨 이후 내용이 밀림)
        }
      }

      // 작성방법 (성능점검표 하단)
      body += pp(rn("작성방법", {sz:20, b:true}), {after:40});
      body += pp(rn("1. 점검결과에는 [적합 ○, 부적합 X, 해당없음 - ]을 표기하고, 비고에는 부적합 사유를 기록한다.",{sz:18}), {after:20});
      body += pp(rn("2. 성능점검 대상 정보통신설비의 특성 및 여건에 맞게 점검내용을 추가·변경할 수 있다.",{sz:18}), {after:200});
    } else {
      // 1번 (기존 방식): 설비별로 체크리스트 + 사진 함께
      for(const cat of current.categories){
        if(!cat.locations.some(l=>l.items.length>0)) continue;
        catIdx++;

      for(let li=0; li<cat.locations.length; li++){
        const loc = cat.locations[li];
        if(!loc.items.length) continue;
        const locName = loc.name || "";
        const secNo = `${catIdx}-${li+1}`;

        // ── 점검표 섹션 제목 ──
        body += pp(rn(`${secNo}) ${cat.name} 유지보수·관리 점검표`, {sz:26}), {before:240, after:60, ind:440});

        // ── 메인 점검표 테이블 (성능점검과 동일한 틀: 17.2cm) ──

            if(data) photoCache[key] = data;
            loadedPhotos++;
            onProgress(`사진 불러오는 중… (${loadedPhotos}/${totalPhotos})`);
          }
        }
      }
    }
    onProgress("보고서 생성 중…");

    const H = (s) => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    let rows = "";
    let catIdx = 0;
    for(const cat of current.categories){
      const hasItems = cat.locations.some(l=>l.items.length>0);
      if(!hasItems){ catIdx++; continue; }
      catIdx++;

      for(const loc of cat.locations){
        if(loc.items.length===0) continue;
        const locLabel = cat.locations.length>1 ? ` <span class="loc-tag">${H(loc.name||"미지정")}</span>` : "";
        const locPhotos = (loc.photos||[]);
        let locPhotoHtml = "";
        if(locPhotos.length){
          locPhotoHtml = `<div class="photo-row" style="margin-top:6px;">`;
          for(const key of locPhotos){
            const data = photoCache[key];
            if(data) locPhotoHtml += `<img src="${data}" class="rpt-photo" alt="설비사진">`;
          }
          locPhotoHtml += `</div>`;
        }
        rows += `<tr class="cat-row"><td colspan="3"><span class="cat-num">${catIdx}</span> ${H(cat.name)}${locLabel}${locPhotoHtml}</td></tr>`;
        for(const it of loc.items){
          const rb = it.result==="양호"?"ok": it.result==="불량"?"bad": it.result==="해당없음"?"na":"none";
          const measured = it.hasValue && it.value ? `<div class="mval">${H(it.value)} ${H(it.unit||"")}</div>` : "";
          const noteHtml = it.note ? `<div class="note-text">${H(it.note)}</div>` : "";
          rows += `<tr>
            <td class="item-name-cell">${H(it.name)}${noteHtml}</td>
            <td class="std-cell">${H(it.std||"")}</td>
            <td class="result-cell"><span class="rb rb-${rb}">${H(it.result==="양호"?"적합":it.result==="불량"?"부적합":(it.result||"미점검"))}</span>${measured}</td>
          </tr>`;
        }
      }
    }

    const good = [], bad = [], unfinished = [];
    current.categories.forEach(cat=>{
      cat.locations.forEach(loc=>{
        loc.items.forEach(it=>{
          if(it.result==="불량") bad.push({cat:cat.name, item:it.name, note:it.note||""});
          else if(!it.result) unfinished.push({cat:cat.name, item:it.name});
        });
      });
    });

    const badRowsHtml = bad.length ? bad.map(b=>`<tr><td>${H(b.cat)}</td><td>${H(b.item)}</td><td>${H(b.note)||"—"}</td></tr>`).join("") : `<tr><td colspan="3" style="text-align:center;color:#888;">없음</td></tr>`;

    return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점검보고서 — ${H(current.siteName)}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:11pt;color:#111;background:#fff;padding:14mm 14mm 18mm;}
  @media print{body{padding:10mm 12mm 15mm;} .no-print{display:none!important;}}
  h1{font-size:18pt;font-weight:700;margin-bottom:4px;}
  .meta{font-size:10.5pt;color:#444;margin-bottom:16px;}
  .meta span{margin-right:16px;}
  .summary-boxes{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .sbox{border:1px solid #ddd;border-radius:8px;padding:10px 14px;flex:1;min-width:120px;text-align:center;}
  .sbox .sv{font-size:22pt;font-weight:700;line-height:1;}
  .sbox .sl{font-size:9pt;color:#666;margin-top:3px;}
  .sbox.ok .sv{color:#1a8754;} .sbox.bad .sv{color:#d7263d;} .sbox.na .sv{color:#b07a14;}
  .section-title{font-size:12pt;font-weight:700;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid #155eef;color:#155eef;}
  table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:6px;}
  th{background:#1a2540;color:#fff;padding:6px 8px;text-align:center;font-weight:600;}
  td{padding:5px 7px;border:1px solid #ddd;vertical-align:top;}
  tr.cat-row td{background:#e8f0ff;font-weight:700;font-size:10pt;padding:6px 8px;border:1px solid #c5d4f0;}
  .cat-num{display:inline-block;background:#155eef;color:#fff;border-radius:3px;padding:1px 6px;font-size:8.5pt;margin-right:5px;}
  .loc-tag{font-size:8.5pt;background:#fde;color:#c25;border-radius:3px;padding:1px 6px;margin-left:4px;}
  .item-name-cell{min-width:160px;}
  .std-cell{color:#555;font-size:8.5pt;min-width:80px;}
  .result-cell{text-align:center;white-space:nowrap;min-width:80px;}
  .photo-cell{min-width:140px;}
  .rb{display:inline-block;border-radius:4px;padding:2px 8px;font-size:8.5pt;font-weight:700;}
  .rb-ok{background:#e7f6ee;color:#1a8754;} .rb-bad{background:#fdeaec;color:#d7263d;} .rb-na{background:#fbf1dd;color:#b07a14;} .rb-none{background:#f0f0f0;color:#888;}
  .mval{font-size:8pt;color:#444;margin-top:2px;font-family:monospace;}
  .note-text{font-size:8pt;color:#555;margin-top:3px;padding-top:3px;border-top:1px solid #eee;}
  .photo-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
  .rpt-photo{width:220px;height:165px;object-fit:cover;object-position:bottom left;border-radius:4px;border:1px solid #ddd;display:block;}
  @media print{.rpt-photo{width:180px;height:135px;object-fit:cover;object-position:bottom left;page-break-inside:avoid;}}
  .defect-title{font-size:11pt;font-weight:700;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid #d7263d;color:#d7263d;}
  .print-btn{position:fixed;bottom:24px;right:24px;background:#155eef;color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(21,94,239,.35);}
  .print-btn:hover{background:#0d47c7;}
</style>
</head>
<body>
<button class="print-btn no-print" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>

<h1>정보통신설비 성능점검 보고서</h1>
<div class="meta">
  <span>📍 ${H(current.siteName)}${current.buildingName?" / "+H(current.buildingName):""}</span>
  <span>📅 ${H(current.date||todayStr())}</span>

<div class="summary-boxes">

<div class="section-title">설비별 점검결과</div>
<table>
