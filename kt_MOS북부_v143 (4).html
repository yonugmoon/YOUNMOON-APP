  <tbody>${rows}</tbody>
</table>

${bad.length>0?`
<div class="defect-title">부적합(불량) 항목 요약</div>
<table>
  <thead><tr><th style="width:30%">설비</th><th style="width:35%">항목</th><th style="width:35%">메모</th></tr></thead>
  <tbody>${badRowsHtml}</tbody>
</table>`:""}

<div style="margin-top:30px;font-size:9pt;color:#aaa;text-align:right;">생성일시: ${new Date().toLocaleString("ko-KR")}</div>
</body>
</html>`;
  }

  /* ============ 회의록 함수들 ============ */
  async function loadMeetings(){
    try {
      const data = await sGet("meetings_list", false);
      meetings = data ? JSON.parse(data) : [];
    } catch(err) {
      console.error("회의록 로드 오류:", err);
      meetings = [];
    }
  }

  async function saveMeetings(){
    await sSet("meetings_list", JSON.stringify(meetings));
  }

  function renderMeetings(){
    view = "list";
    const html = [];
    html.push('<div class="topbar"><div class="topbar-row"><div class="brand">회의록 관리<small>팀 회의 기록 및 추적</small></div><div style="display:flex;gap:6px;align-items:center;"><button class="fb-setup-btn" id="fb-setup-btn">🔥</button></div></div></div>');
    
    // === 탭 ===
    html.push('<div style="display:flex;gap:8px;background:#fff;padding:10px;border-bottom:1px solid var(--border);overflow-x:auto;">');
    html.push('<button onclick="showInspectionTab()" style="padding:8px 14px;border:none;border-radius:6px;background:#f0f0f0;color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;">🔍 점검</button>');
    html.push('<button onclick="showMeetingsTab()" style="padding:8px 14px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;">📋 회의록</button>');
    html.push('</div>');
    
    html.push('<div class="container">');
    
    // 새 회의록 버튼
    html.push('<button class="primary-btn" onclick="startNewMeeting()" style="margin-top:14px;">+ 새 회의록</button>');
    
    if(meetings.length === 0){
      html.push('<div class="empty-state" style="margin-top:30px;">저장된 회의록이 없습니다.<br>위 버튼을 눌러 새 회의록을 작성하세요.</div>');
    } else {
      html.push('<div class="field-label" style="margin-top:18px;">저장된 회의록</div>');
      meetings.forEach(m => {
        html.push(`
          <div class="insp-card">
            <div class="insp-card-top">
              <div>
                <div class="insp-name">${escapeHtml(m.title)}</div>
                <div class="insp-meta">📅 ${m.date} ${m.attendees ? '| 👥 ' + m.attendees : ''}</div>
              </div>
            </div>
            ${m.discussions ? `<div style="margin-top:8px;font-size:13px;color:var(--muted);"><strong>논의:</strong> ${escapeHtml(m.discussions.substring(0, 60))}...</div>` : ''}
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="outline-btn" onclick="editMeeting(${m.id})" style="flex:1;">✏️ 편집</button>
              <button class="outline-btn" onclick="exportMeetingWord(${m.id})" style="flex:1;">📄 Word</button>
              <button class="outline-btn" onclick="deleteMeeting(${m.id})" style="flex:1;border-color:#ffcccc;color:#cc0000;">🗑️ 삭제</button>
            </div>
          </div>
        `);
      });
    }
    
    html.push('</div>');
    app.innerHTML = html.join("");
    setupMeetingHandlers();
    
    // === Word 버튼 이벤트 설정 (간단하게) ===
    document.querySelectorAll('button[onclick*="exportMeetingWord"]').forEach(btn => {
      const onclickStr = btn.getAttribute('onclick');
      const id = parseInt(onclickStr.match(/\d+/)[0]);
      btn.onclick = (e) => {
        e.preventDefault();
        exportMeetingWord(id);
      };
    });
  }

  function startNewMeeting(){
    currentMeetingForm = {
      id: Date.now(),
      title: "",
      date: new Date().toLocaleDateString("ko-KR"),
      attendees: "",
      discussions: "",
      decisions: "",
      notes: "",
      transcript: "",
      actionItems: []
    };
    editMeeting(currentMeetingForm.id, true);
  }

  function editMeeting(id, isNew = false){
    let m = isNew ? currentMeetingForm : meetings.find(x => x.id === id);
    if(!m) return;

    const html = [];
    html.push('<div class="topbar"><button class="back-btn" onclick="renderMeetings()">← 뒤로</button><div class="brand">회의록 작성</div><div></div></div>');
    html.push('<div class="container">');
    html.push(`
      <div class="field-label">회의 제목 *</div>
      <input class="text-input" id="m-title" value="${escapeHtml(m.title)}" placeholder="회의 제목 입력">
      
      <div class="field-label">회의 날짜</div>
      <input class="text-input" type="date" id="m-date" value="${m.date.split('/')[2]}-${String(m.date.split('/')[0]).padStart(2,'0')}-${String(m.date.split('/')[1]).padStart(2,'0')}">
      
      <div class="field-label">참석자 (쉼표로 구분)</div>
      <input class="text-input" id="m-attendees" value="${escapeHtml(m.attendees)}" placeholder="예: 영문, 윤재, 석빈">

      <div style="margin-top:18px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fafbfc;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
          <div style="font-size:13px;font-weight:700;color:var(--ink);">🎙️ 음성 회의록</div>
          <button type="button" id="voice-key-btn" class="outline-btn" style="padding:6px 10px;font-size:12px;">⚙️ AI 키</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <button type="button" id="voice-rec-btn" class="outline-btn" style="padding:9px 14px;">● 녹음 시작</button>
          <span id="voice-status" style="font-size:12px;color:var(--muted);">대기 중</span>
        </div>
        <div class="field-label" style="margin-top:12px;">녹취록 (실시간 받아쓰기)</div>
        <textarea class="text-input" id="m-transcript" style="min-height:90px;" placeholder="녹음을 시작하면 여기에 자동으로 받아쓴 내용이 채워집니다. 직접 붙여넣거나 수정해도 됩니다.">${escapeHtml(m.transcript || "")}</textarea>
        <button type="button" class="primary-btn" id="voice-ai-btn" style="margin-top:10px;">✨ AI로 회의록 자동 정리</button>
        <div id="voice-ai-status" style="font-size:12px;color:var(--muted);margin-top:6px;"></div>
      </div>

      <div class="field-label">주요 논의사항</div>
      <textarea class="text-input" id="m-discussions" placeholder="회의에서 논의된 주요 내용">${escapeHtml(m.discussions)}</textarea>
      
      <div class="field-label">결정 사항</div>
      <textarea class="text-input" id="m-decisions" placeholder="회의에서 결정된 사항">${escapeHtml(m.decisions)}</textarea>
      
      <div class="field-label">비고</div>
      <textarea class="text-input" id="m-notes" placeholder="추가 메모">${escapeHtml(m.notes)}</textarea>
      
      <div class="form-row-btns" style="margin-top:20px;">
        <button class="outline-btn" onclick="renderMeetings()" style="flex:1;">취소</button>
        <button class="primary-btn" onclick="saveMeetingData(${id}, ${isNew})" style="flex:1;">저장</button>
      </div>
    `);
    html.push('</div>');
    app.innerHTML = html.join("");
    
    // === 뒤로 가기 버튼 이벤트 설정 ===
    const backBtn = document.querySelector('button[onclick*="renderMeetings"]');
    if(backBtn){
      backBtn.onclick = () => renderMeetings();
    }
    
    // === 취소 버튼 이벤트 설정 ===
    const cancelBtn = document.querySelector('.outline-btn[onclick*="renderMeetings"]');
    if(cancelBtn){
      cancelBtn.onclick = () => renderMeetings();
    }
    
    // === 저장 버튼 이벤트 설정 ===
    const saveBtn = document.querySelector('.primary-btn[onclick*="saveMeetingData"]');
    if(saveBtn){
      saveBtn.onclick = () => saveMeetingData(id, isNew);
    }

    // === 음성 녹음 & AI 회의록 정리 설정 ===
    setupVoiceMeetingUI();
  }

  // ── 음성 회의록 (Web Speech API + Gemini) ─────────────
  const GEMINI_MEETING_MODEL = "gemini-2.5-flash";

  function setupVoiceMeetingUI(){
    const recBtn = document.getElementById("voice-rec-btn");
    const statusEl = document.getElementById("voice-status");
    const transcriptEl = document.getElementById("m-transcript");
    const aiBtn = document.getElementById("voice-ai-btn");
    const aiStatus = document.getElementById("voice-ai-status");
    const keyBtn = document.getElementById("voice-key-btn");
    if(!recBtn || !transcriptEl) return;

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let manualStop = false;

    if(!SR){
      recBtn.disabled = true;
      recBtn.style.opacity = "0.5";
      statusEl.textContent = "이 브라우저는 음성 인식을 지원하지 않습니다 (크롬/엣지 권장)";
    } else {
      recBtn.addEventListener("click", () => {
        if(isRecording){ stopRec(); } else { startRec(); }
      });
    }

    function baseText(){
      let t = transcriptEl.value;
      if(t && !/\s$/.test(t)) t += " ";
      return t;
    }

    function startRec(){
      recognition = new SR();
      recognition.lang = "ko-KR";
      recognition.continuous = true;
      recognition.interimResults = true;
      let anchor = baseText();

      recognition.onresult = (e) => {
        let finalChunk = "";
        let interim = "";
        for(let i = e.resultIndex; i < e.results.length; i++){
          const txt = e.results[i][0].transcript;
          if(e.results[i].isFinal){ finalChunk += txt; }
          else { interim += txt; }
        }
        if(finalChunk){ anchor = (anchor + finalChunk).replace(/\s+/g, " ") + " "; }
        transcriptEl.value = anchor + interim;
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
      };
      recognition.onerror = (e) => {
        if(e.error === "not-allowed" || e.error === "service-not-allowed"){
          statusEl.textContent = "마이크 사용 권한을 허용해 주세요";
          manualStop = true;
        } else if(e.error === "no-speech"){
          statusEl.textContent = "🔴 녹음 중… (음성 대기)";
        }
      };
      recognition.onend = () => {
        // 브라우저가 중간에 끊으면 사용자가 멈추기 전까지 자동 재시작
        if(isRecording && !manualStop){
          try { recognition.start(); } catch(err){}
        } else {
          isRecording = false;
          recBtn.textContent = "● 녹음 시작";
          recBtn.style.color = "";
          statusEl.textContent = "정지됨";
        }
      };

      try {
        manualStop = false;
        recognition.start();
        isRecording = true;
        recBtn.textContent = "■ 녹음 정지";
        recBtn.style.color = "var(--accent)";
        statusEl.textContent = "🔴 녹음 중…";
      } catch(err){
        statusEl.textContent = "녹음을 시작할 수 없습니다: " + err.message;
      }
    }

    function stopRec(){
      manualStop = true;
      isRecording = false;
      if(recognition){ try { recognition.stop(); } catch(err){} }
      recBtn.textContent = "● 녹음 시작";
      recBtn.style.color = "";
      statusEl.textContent = "정지됨";
    }

    // AI 키 설정
    if(keyBtn){
      keyBtn.addEventListener("click", async () => {
        const cur = await sGet("gemini_api_key") || "";
        const input = prompt("Gemini API 키를 입력하세요.\n(Google AI Studio에서 무료 발급 · aistudio.google.com/apikey)\n\n비우고 확인하면 저장된 키가 삭제됩니다.", cur);
        if(input === null) return;
        const val = input.trim();
        if(val){ await sSet("gemini_api_key", val); alert("AI 키가 저장되었습니다."); }
        else { await sDelete("gemini_api_key"); alert("AI 키가 삭제되었습니다."); }
      });
    }

    // AI로 회의록 자동 정리
    if(aiBtn){
      aiBtn.addEventListener("click", async () => {
        const transcript = transcriptEl.value.trim();
        if(!transcript){ aiStatus.textContent = "먼저 녹음하거나 녹취록을 입력하세요."; return; }
        const key = await sGet("gemini_api_key");
        if(!key){ aiStatus.textContent = "먼저 [⚙️ AI 키] 버튼으로 Gemini 키를 등록하세요."; return; }

        if(isRecording) stopRec();
        aiBtn.disabled = true;
        aiStatus.textContent = "AI가 회의록을 정리하는 중…";

        const prompt = "다음은 회의 녹취록입니다. 이를 바탕으로 회의록을 한국어로 작성하세요. " +
          "반드시 아래 JSON 형식만 출력하고, 그 외의 설명·머리말·마크다운 코드펜스는 절대 붙이지 마세요.\n" +
          '{"title":"회의 제목(간결하게)","discussions":"주요 논의사항을 항목별 줄바꿈으로","decisions":"결정 사항을 항목별 줄바꿈으로","notes":"후속 조치(담당/기한 포함)나 특이사항"}\n\n' +
          "녹취록:\n" + transcript;

        try {
          const resp = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MEETING_MODEL + ":generateContent",
            {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-goog-api-key": key },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }
          );
          if(!resp.ok){
            const errTxt = await resp.text();
            aiStatus.textContent = "AI 오류(" + resp.status + "): " + errTxt.slice(0, 120);
            aiBtn.disabled = false;
            return;
          }
          const data = await resp.json();
          let text = (data.candidates && data.candidates[0] && data.candidates[0].content &&
                      data.candidates[0].content.parts || []).map(p => p.text || "").join("");
          text = text.replace(/```json/gi, "").replace(/```/g, "").trim();
          let parsed = null;
          try { parsed = JSON.parse(text); }
          catch(e){
            const m = text.match(/\{[\s\S]*\}/);
            if(m){ try { parsed = JSON.parse(m[0]); } catch(e2){} }
          }
          if(!parsed){ aiStatus.textContent = "AI 응답을 해석하지 못했습니다. 다시 시도해 주세요."; aiBtn.disabled = false; return; }

          const titleEl = document.getElementById("m-title");
          const disEl = document.getElementById("m-discussions");
          const decEl = document.getElementById("m-decisions");
          const noteEl = document.getElementById("m-notes");
          if(titleEl && parsed.title && !titleEl.value.trim()) titleEl.value = parsed.title;
          if(disEl && parsed.discussions) disEl.value = parsed.discussions;
          if(decEl && parsed.decisions) decEl.value = parsed.decisions;
          if(noteEl && parsed.notes) noteEl.value = parsed.notes;
          aiStatus.textContent = "✅ 정리 완료. 아래 항목을 확인 후 저장하세요.";
        } catch(err){
          aiStatus.textContent = "네트워크 오류: " + err.message;
        }
        aiBtn.disabled = false;
      });
    }
  }

  window.saveMeetingData = async function(id, isNew){

  // Word 파일 다운로드 헬퍼 함수
  async function downloadFile(blob, filename) {
    // 1) 모바일: Web Share API로 파일 저장/공유 시트 띄우기 (인앱 브라우저·WebView 대응)
    try{
      if(navigator.canShare){
        const type = blob.type || "application/octet-stream";
        const file = new File([blob], filename, {type});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:filename});
          return true;
        }
      }
    }catch(e){
      // 사용자가 공유 취소한 경우엔 폴백하지 않고 종료
      if(e && e.name === "AbortError") return false;
      // 그 외에는 아래 폴백 시도
    }
    // 2) 폴백: a[download] 클릭 방식
    try{
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = filename;
      link.rel = "noopener";
      link.target = "_blank";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    }catch(e2){
      // 3) 최후: 새 탭에서 blob 열기 (사용자가 길게 눌러 저장)
      try{
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        return true;
      }catch(e3){
        alert("파일 저장에 실패했습니다. 크롬·사파리 같은 기본 브라우저에서 열어 다시 시도해주세요.");
        return false;
      }
    }
  }

      // .docx 파일로 생성
      zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })
        .then(blob => {

  // 순수 텍스트 폴백

  // XML 특수 문자 이스케이프
  function escapeXml(str) {
    if (!str) return "";
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&apos;");

      tip.querySelector('p').textContent=step.text;
      tip.querySelector('.tour-step').textContent=(idx+1)+' / '+STEPS.length;
      tip.querySelector('.tour-prev').style.display = idx===0?'none':'inline-block';
      tip.querySelector('.tour-next').textContent = idx===STEPS.length-1?'완료':'다음';
      tip.style.visibility='hidden';
      requestAnimationFrame(()=>{
        const tw=tip.offsetWidth, th=tip.offsetHeight;
        const vw=window.innerWidth, vh=window.innerHeight;
        let left, top;
        if(r){
          const spaceBelow = vh - r.bottom;
          top = (spaceBelow > th+24) ? (r.bottom+12) : Math.max(12, r.top-th-12);
          left = Math.min(Math.max(12, r.left + r.width/2 - tw/2), vw-tw-12);
        } else {
          left=(vw-tw)/2; top=(vh-th)/2;
        }
        tip.style.left=left+'px';
        tip.style.top=top+'px';
        tip.style.visibility='visible';
      });
    }, el?260:0);
  }

  function start(){
    if(document.querySelector('.tour-overlay')) return;
    idx=0;
    ov=document.createElement('div'); ov.className='tour-overlay';
    hole=document.createElement('div'); hole.className='tour-hole';
    tip=document.createElement('div'); tip.className='tour-tip';
    tip.innerHTML=`
      <h4></h4><p></p>
      <div class="tour-row">
        <span class="tour-step"></span>
        <div class="tour-btns">
          <button class="tour-skip">건너뛰기</button>
          <button class="tour-prev">이전</button>
          <button class="tour-next">다음</button>
        </div>
      </div>`;
    ov.appendChild(hole);
    document.body.appendChild(ov);
    document.body.appendChild(tip);
    tip.querySelector('.tour-skip').onclick=end;
    tip.querySelector('.tour-prev').onclick=()=>{ if(idx>0){idx--;render();} };
    tip.querySelector('.tour-next').onclick=()=>{ if(idx<STEPS.length-1){idx++;render();} else end(); };
    render();
    try{ localStorage.setItem('tourSeen','1'); }catch(e){}
  }
  function end(){ ov&&ov.remove(); tip&&tip.remove(); ov=hole=tip=null; }

  window.addEventListener('resize', ()=>{ if(ov) render(); });

  // 플로팅 도움말 버튼
  const help=document.createElement('button');
  help.id='tourHelpBtn'; help.textContent='?'; help.setAttribute('aria-label','사용법 보기');
  help.onclick=()=>{
    if(document.querySelector('#export-btn')) start();
    else alert('점검을 먼저 열어주세요. 점검 화면에서 사용법을 볼 수 있어요.');
  };
  document.body.appendChild(help);

  // 처음 점검 상세 화면 진입 시 자동 1회
  let seen=false; try{ seen=localStorage.getItem('tourSeen')==='1'; }catch(e){}
  if(!seen){
    const obs=new MutationObserver(()=>{
      if(document.querySelector('#export-btn') && !document.querySelector('.tour-overlay')){
        obs.disconnect();
        setTimeout(start, 700);
      }
    });
    obs.observe(document.body, {childList:true, subtree:true});
  }
})();
</script>
</body>
</html>
